}
.sol-badge.correct { background: var(--green-bg); color: var(--green); }
.sol-badge.incorrect { background: var(--red-bg); color: var(--red); }
.sol-badge.unanswered { background: var(--surface-2); color: var(--text-muted); }
.sol-tag { font-size: 0.76rem; color: var(--text-muted); }
.sol-q { font-weight: 600; margin: 0 0 14px; white-space: pre-line; line-height: 1.55; }
.sol-note {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-note strong {
  display: block;
  margin-bottom: 5px;
  color: var(--text-muted);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-note p {
  margin: 0;
  white-space: pre-line;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.88rem;
  line-height: 1.5;
}
.sol-marker-box {
  background: var(--marker-bg);
  border: 1px solid color-mix(in srgb, var(--marker) 55%, var(--border));
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-marker-box > strong {
  display: block;
  margin-bottom: 6px;
  color: var(--marker);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-marker-item {
  display: grid;
  grid-template-columns: minmax(120px, 0.36fr) minmax(0, 1fr);
  gap: 10px;
  font-size: 0.88rem;
  line-height: 1.45;
  padding: 5px 0;
}
.sol-marker-item + .sol-marker-item { border-top: 1px solid color-mix(in srgb, var(--marker) 30%, transparent); }
.sol-marker-term { font-weight: 700; }
.sol-marker-note { color: var(--text-muted); }
.sol-option {
  display: flex; gap: 10px; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.92rem; line-height: 1.5;
  border: 1px solid transparent;
}
.sol-option.is-correct { background: var(--green-bg); border-color: var(--green); }
.sol-option.is-your-wrong { background: var(--red-bg); border-color: var(--red); }
.sol-option-mark { font-weight: 700; flex-shrink: 0; }
.sol-block { margin-top: 12px; font-size: 0.92rem; line-height: 1.6; }
.sol-block h5 { margin: 14px 0 4px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
.sol-block p { margin: 0 0 6px; }

.jump-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; }
.jump-nav a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; font-size: 0.75rem;
  text-decoration: none; border: 1px solid var(--border); color: var(--text);
}
.jump-nav a.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.jump-nav a.incorrect { background: var(--red-bg); border-color: var(--red); color: var(--red); }

.footer-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 30px; }
.footer-note + .footer-note { margin-top: 8px; }
