.sol-badge.incorrect { background: var(--red-bg); color: var(--red); }
.sol-badge.unanswered { background: var(--surface-2); color: var(--text-muted); }
.sol-tag { font-size: 0.76rem; color: var(--text-muted); }
.sol-q { font-weight: 600; margin: 0 0 14px; white-space: pre-line; line-height: 1.55; }
.sol-note {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-note strong {
  display: block;
  margin-bottom: 5px;
  color: var(--text-muted);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-note p {
  margin: 0;
  white-space: pre-line;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.88rem;
  line-height: 1.5;
}
.sol-marker-box {
  background: var(--marker-bg);
  border: 1px solid color-mix(in srgb, var(--marker) 55%, var(--border));
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-marker-box > strong {
  display: block;
  margin-bottom: 6px;
  color: var(--marker);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-marker-item {
  display: grid;
  grid-template-columns: minmax(120px, 0.36fr) minmax(0, 1fr);
  gap: 10px;
  font-size: 0.88rem;
  line-height: 1.45;
  padding: 5px 0;
}
.sol-marker-item + .sol-marker-item { border-top: 1px solid color-mix(in srgb, var(--marker) 30%, transparent); }
.sol-marker-term { font-weight: 700; }
.sol-marker-note { color: var(--text-muted); }
.sol-option {
  display: flex; gap: 10px; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.92rem; line-height: 1.5;
  border: 1px solid transparent;
}
.sol-option.is-correct { background: var(--green-bg); border-color: var(--green); }
.sol-option.is-your-wrong { background: var(--red-bg); border-color: var(--red); }
.sol-option-mark { font-weight: 700; flex-shrink: 0; }
.sol-block { margin-top: 12px; font-size: 0.92rem; line-height: 1.6; }
.sol-block h5 { margin: 14px 0 4px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
.sol-block p { margin: 0 0 6px; }

.jump-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; }
.jump-nav a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; font-size: 0.75rem;
  text-decoration: none; border: 1px solid var(--border); color: var(--text);
}
.jump-nav a.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.jump-nav a.incorrect { background: var(--red-bg); border-color: var(--red); color: var(--red); }

.footer-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 30px; }
.footer-note + .footer-note { margin-top: 8px; }

<script>
window.__EXAM__ = {"examId": "2026-08-25-01", "title": "ISTQB CTFL v4.0.1 \u2014 Mock Exam", "generated": "2026-08-25", "durationMinutes": 75, "passMarkPct": 65, "bankVersion": 1, "questions": [{"id": "Q175", "chapter": "1.3", "topic": "Testing Principles - Presence, Not Absence, of Defects", "type": "B", "difficulty": "green", "question": "A team finishes testing a pharmaceutical distribution system. Every planned test case has passed, and no open defects remain in the tracking tool. The project manager tells stakeholders, 'Testing has now proven this system is completely free of defects.' Which testing principle does this statement violate?", "options": {"A": "Testing shows the presence, not the absence, of defects", "B": "Absence-of-defects fallacy", "C": "Exhaustive testing is impossible", "D": "Tests wear out"}, "correct": "A", "why_correct": "The first testing principle states that testing can show defects are present, but cannot prove there are none - even when all planned tests pass and no defects remain open, this only reduces the probability of undiscovered defects, it never proves the test object is correct. The project manager's claim of 'completely free of defects' is exactly the overconfidence this principle warns against.", "option_notes": {"A": "Correct - directly matches the principle that even when no defects are found, testing cannot prove test object correctness.", "B": "A close but less precise match: the absence-of-defects fallacy specifically concerns the mistaken belief that thoroughly verifying all specified requirements and fixing every found defect will, by itself, ensure the system succeeds - it is about verification not being enough without validation of real user needs. The project manager's statement is about certainty of zero remaining defects, which is the more direct territory of the first principle, not this one.", "C": "Exhaustive testing being impossible concerns the infeasibility of testing every possible input, path, or combination. The scenario does not claim exhaustive coverage was achieved - it claims certainty of zero defects, a different (and stronger) overreach.", "D": "Tests wear out concerns previously effective tests becoming less able to find new defects the more times they are repeated unchanged - it has nothing to do with a claim about the system's current defect-free status."}, "distractor_note": "Option B is a genuine trap because both principles deal with over-trusting test results. The distinguishing detail: the absence-of-defects fallacy is specifically about verification (matching the spec) not guaranteeing a successful system that meets user needs, while this principle is the more general statement that passing tests never proves zero defects exist.", "alt_wording": "A test manager tells a client, 'We executed every test in our test basis and all of them passed, so I can guarantee there are zero bugs left in the system.' Which principle does this claim contradict?"}, {"id": "Q193", "chapter": "4.3", "topic": "Statement Coverage vs Branch Coverage - Practical Divergence", "type": "B", "difficulty": "red", "question": "Consider this pseudocode:\n\nfunction processRefund(amount, isPremiumMember) {\n  let fee = 10;                     // statement 1\n  if (isPremiumMember) {            // decision\n    fee = 0;                        // statement 2\n  }\n  processPayment(amount - fee);     // statement 3\n}\n\nA test suite consists of exactly one test case: processRefund(100, true). What statement coverage and branch coverage does this single test case achieve?", "options": {"A": "100% statement coverage; 50% branch coverage", "B": "100% statement coverage; 100% branch coverage, because every executable statement in the function was reached", "C": "50% statement coverage; 50% branch coverage", "D": "100% statement coverage; 0% branch coverage, because a single test case can never exercise a branch outcome"}, "correct": "A", "why_correct": "With isPremiumMember = true, execution runs statement 1 (fee = 10), enters the if block and runs statement 2 (fee = 0), then runs statement 3 (processPayment). All 3 executable statements run at least once, giving 100% statement coverage. However, the 'if' decision has two possible outcomes - true and false - and only the true outcome was exercised; the false outcome (a non-premium member, where statement 2 is skipped) was never tested. Branch coverage = branches exercised / total branches = 1/2 = 50%. This demonstrates the syllabus's point that '100% statement coverage does not ensure that all the decision logic has been tested... it may not exercise all the branches.'", "option_notes": {"A": "Correct, as derived above: all statements execute (100%), but only one of the two branch outcomes of the if-decision is exercised (50%).", "B": "Wrong. This is the classic misconception that statement coverage and branch coverage always move together. Reaching every statement is not the same as exercising every decision outcome - the false path of the 'if' was never taken by this single test case, so branch coverage is only 50%, not 100%.", "C": "Wrong. Statement 2 (fee = 0) DOES execute, because isPremiumMember is true, so the if block runs. All 3 statements execute, giving 100% statement coverage, not 50%. This option incorrectly assumes the if body was skipped.", "D": "Wrong. A single test case with isPremiumMember = true DOES exercise the true outcome of the branch (1 of 2 branches, or 50%) - it just fails to exercise the false outcome. Branch coverage is not automatically 0% just because only one test case was run; it depends on which specific outcomes that test case happens to trigger."}, "distractor_note": "Option B is the most tempting wrong answer because in simple, branch-free code, statement coverage and branch coverage genuinely do coincide. This example is deliberately chosen with a single conditional to show a case where they diverge: statement coverage reaches 100% while branch coverage is still only 50%, since branch coverage subsumes statement coverage but not vice versa (per the syllabus: 'branch coverage subsumes statement coverage... but not vice versa').", "alt_wording": "What is the minimum number of additional test cases needed to raise this test suite to 100% branch coverage, and what input value would that test case need?"}, {"id": "Q180", "chapter": "2.2", "topic": "Test Types - Black-Box vs White-Box Testing", "type": "C", "difficulty": "green", "question": "A hospital's IT team is testing a new patient-scheduling system's appointment conflict-resolution feature. One set of tests is derived purely from the requirements document's rules for what counts as a scheduling conflict, without looking at how the feature is coded. A second, separate set of tests is derived by examining the conflict-resolution function's source code and designing tests to exercise its different branches. Which two test types, as defined in the syllabus's Test Levels and Test Types section, are being used for the first and second sets of tests respectively?", "options": {"A": "First set: functional testing; Second set: non-functional testing", "B": "First set: black-box testing; Second set: white-box testing", "C": "First set: white-box testing; Second set: black-box testing", "D": "First set: black-box testing; Second set: non-functional testing"}, "correct": "B", "why_correct": "Section 2.2.2 defines black-box testing as specification-based, deriving tests from documentation not related to the internal structure of the test object, with the main objective of checking the system's behavior against its specifications - exactly the first set, derived only from the requirements document. White-box testing is defined as structure-based, deriving tests from the system's implementation or internal structure (code, architecture, workflows, data flows), with the main objective of covering that structure - exactly the second set, derived from examining the source code's branches.", "option_notes": {"A": "Tempting because functional versus non-functional is also a genuine test-type pair from the same syllabus section, but the scenario is about HOW the tests were derived (from the spec versus from the code), which is the black-box/white-box distinction. Both sets in the scenario are actually checking the same functional conflict-resolution behavior, just derived by different means.", "B": "Correct - the spec-derived set is black-box testing, and the code-derived set is white-box testing.", "C": "Swaps the two test types, assigning white-box to the specification-derived set and black-box to the code-derived set - the reverse of the syllabus's definitions.", "D": "Correctly identifies the first set as black-box testing, but mislabels the second set as non-functional testing. Examining source-code branches to design tests is about deriving tests from internal structure (white-box), not about testing 'how well' the system performs against quality characteristics like performance or usability."}, "distractor_note": "Option A is the strongest distractor because functional/non-functional and black-box/white-box are both legitimate test-type pairs from the exact same syllabus subsection, and under time pressure it is easy to reach for the more familiar functional/non-functional pairing when the scenario is actually testing the black-box/white-box derivation distinction.", "alt_wording": "For an airline's fare-calculation module, one test set is built purely from the published fare rules document with no view of the code, while another test set is built by tracing through the fare-calculation function's if/else branches. Which two test types does this illustrate?"}, {"id": "Q188", "chapter": "4.2", "topic": "Boundary Value Analysis - 2-Value vs 3-Value Detection Power", "type": "H", "difficulty": "red", "question": "An auto-insurance system should apply a low-mileage discount when a driver's annual mileage is at most 8,000 miles (mileage <= 8000). A developer mistakenly implements this rule as 'if (mileage == 8000) applyDiscount();' - meaning the discount is granted ONLY when mileage is exactly 8,000, and denied for every other value, including mileage well below 8,000. Using 3-value BVA at the 8,000-mile boundary, which test value exposes this defect, and why do the standard 2-value BVA test values fail to catch it?", "options": {"A": "mileage = 7,999 exposes the defect: the correct rule says a discount should be granted (7,999 <= 8,000), but the buggy code denies it (7,999 != 8,000). The 2-value tests, mileage = 8,000 and mileage = 8,001, both happen to match the correct behavior by coincidence, so they do not reveal the defect.", "B": "mileage = 8,001 exposes the defect, because it is above the boundary and should never receive a discount.", "C": "mileage = 8,000 exposes the defect, because it is the exact boundary value where the rule changes.", "D": "mileage = 16,000 exposes the defect, because it is far from the boundary and represents an extreme, out-of-range test value."}, "correct": "A", "why_correct": "3-value BVA at the 8,000-mile boundary tests three values: 7,999 (neighbor below), 8,000 (the boundary itself), and 8,001 (neighbor above). Checking each against both the correct rule (mileage <= 8000) and the buggy code (mileage == 8000): at 8,000, correct says 'discount' (true) and buggy also says 'discount' (8000==8000 is true) - they agree, no defect shown. At 8,001, correct says 'no discount' (false) and buggy also says 'no discount' (8001==8000 is false) - they agree again, no defect shown. Only at 7,999 do they disagree: correct says 'discount' (7999<=8000 is true) but buggy says 'no discount' (7999==8000 is false). This mismatch is what exposes the defect. Since the standard 2-value BVA set for this boundary is exactly {8,000, 8,001} - both of which coincidentally agree with the buggy code - 2-value BVA misses this defect entirely, while 3-value BVA's extra neighbor (7,999) catches it. This mirrors the syllabus's own example of why 3-value BVA is more rigorous than 2-value BVA: a boundary condition mistakenly coded as an equality check can pass every 2-value BVA test while still being wrong for the entire rest of the valid range.", "option_notes": {"A": "Correct, as shown in the worked comparison above: 7,999 is the one BVA-derived value where correct and buggy behavior diverge.", "B": "Wrong. At mileage = 8,001, both the correct rule (8001 <= 8000 is false, so no discount) and the buggy code (8001 == 8000 is false, so no discount) agree - no defect is revealed here, even though 8,001 is a legitimate 2-value and 3-value BVA test point.", "C": "Wrong, and this is the most tempting-looking answer since 8,000 IS the named boundary. But at exactly mileage = 8,000, both the correct rule (8000 <= 8000 is true) and the buggy code (8000 == 8000 is true) agree that a discount should be granted - so testing the boundary value itself does not reveal this particular defect.", "D": "Wrong. While mileage = 16,000 does correctly receive 'no discount' from both the correct rule and the buggy code (both agree, so no defect shown), it is not a value derived from boundary value analysis at all - BVA test values come from the boundaries of partitions, not arbitrary values far from any boundary."}, "distractor_note": "Option C exploits the natural assumption that 'the boundary value' is always the one that best exposes a boundary-related defect. Here, the specific coding error (using == instead of <=) happens to still work correctly at the exact boundary value, so it takes the neighbor just below the boundary - a genuine 3-value BVA coverage item - to catch it. This directly illustrates the syllabus's point that 3-value BVA can detect defects that 2-value BVA overlooks.", "alt_wording": "For the same mis-coded 'mileage == 8000' rule, list the three coverage items required for 3-value BVA at this boundary, and identify which one is the ONLY value (among all values tested by 2-value or 3-value BVA) that produces a different result between the correct and the buggy implementation."}, {"id": "Q210", "chapter": "5.5", "topic": "Defect Severity vs Priority", "type": "C", "difficulty": "yellow", "question": "While testing fleet-management software for agricultural equipment, a tester logs two defects:\n- Defect 1: The rarely-used 'export maintenance history to CSV' feature crashes the whole application, but only a handful of users use it, and it will not be shown during an upcoming board demo.\n- Defect 2: A minor dashboard label reads 'Feul Level' instead of 'Fuel Level' - a typo with no functional impact, but the marketing lead insists it be fixed before tomorrow's investor demo.\n\nWhich pair of ratings correctly reflects the syllabus's distinction between severity and priority for these two defects?", "options": {"A": "Defect 1: high severity, high priority; Defect 2: low severity, low priority", "B": "Defect 1: high severity (a crash is a serious functional impact), with priority set separately by how urgently it needs fixing; Defect 2: low severity (a cosmetic typo), but potentially high priority for the demo - severity measures degree of impact, while priority measures urgency to fix", "C": "Defect 1 and Defect 2 have the same severity and priority, since both were found during the same test cycle", "D": "Defect 1: low severity, high priority; Defect 2: high severity, low priority"}, "correct": "B", "why_correct": "The syllabus lists severity ('degree of impact on the interests of stakeholders or requirements') and priority ('priority to fix') as two separate fields on a defect report. They do not have to move together: Defect 1's crash is high severity regardless of how few users are affected or how urgently it needs fixing before the demo, while Defect 2's typo is low severity but can still be assigned high priority purely because of business context (the investor demo).", "option_notes": {"A": "Incorrect. This assumes severity and priority always correlate. Defect 2 being low severity does not force it to also be low priority - the business context (an investor demo) can make even a cosmetic issue urgent to fix.", "B": "Correct - separates the two attributes properly and shows how they can diverge.", "C": "Incorrect. When a defect was discovered has no bearing on its severity or priority ratings; these are independent, deliberately assigned attributes.", "D": "Incorrect. This reverses Defect 1's severity - a full application crash is high severity because of its serious functional impact, regardless of how few users are affected by that particular feature."}, "distractor_note": "Option A represents the most common misconception - assuming severity and priority always correlate. The syllabus deliberately separates them (severity = degree of impact/harm; priority = urgency to fix) precisely because business or scheduling context, like an upcoming demo, can make a low-severity issue urgent, or leave a high-severity issue at lower priority if, for example, the affected feature is rarely used.", "alt_wording": "A defect causes a rarely-used report to fail silently (little functional impact), but the CEO wants it fixed before tomorrow's board meeting. What does this illustrate about the relationship between severity and priority?"}, {"id": "Q185", "chapter": "6.1", "topic": "Test Management Tools vs DevOps Tools", "type": "C", "difficulty": "yellow", "question": "A software company uses Tool X to track requirements, link them to test cases, log and manage defects, and produce SDLC-wide progress reports shared across several teams. It separately uses Tool Y to automatically trigger a build, run the CI/CD pipeline, and coordinate deployments whenever a developer commits code. According to the syllabus, which of the following correctly identifies Tool X and Tool Y?", "options": {"A": "Tool X is a DevOps tool; Tool Y is a test management tool", "B": "Tool X is a test management tool; Tool Y is a DevOps tool", "C": "Tool X is a test execution tool; Tool Y is a collaboration tool", "D": "Tool X is a static testing tool; Tool Y is a test design tool"}, "correct": "B", "why_correct": "The syllabus describes test management tools as tools that 'increase the test process efficiency by facilitating management of the SDLC, requirements, tests, defects, configuration' - which matches Tool X's job of tracking requirements, linking them to test cases, managing defects, and producing SDLC-wide reports. It describes DevOps tools as tools that 'support the DevOps delivery pipeline, workflow tracking, automated build process(es), CI/CD' - which matches Tool Y's job of triggering builds, running the CI/CD pipeline, and coordinating deployments on every commit.", "option_notes": {"A": "This reverses the correct mapping. Tool X's functions (requirements traceability, test and defect management, SDLC-wide reporting) are the definition of a test management tool, not a DevOps tool; Tool Y's functions (builds, CI/CD, deployment coordination) define a DevOps tool, not a test management tool.", "B": "Correct - this matches each tool's described functions to the syllabus definition of its tool category.", "C": "Test execution tools facilitate automated running of tests and coverage measurement, not requirement traceability or defect management, so it does not fit Tool X. Collaboration tools facilitate communication between people, not automated builds or CI/CD pipelines, so it does not fit Tool Y either.", "D": "Static testing tools support reviews and static analysis, and test design tools facilitate generating test cases, test data, and test procedures - neither category matches Tool X's SDLC-wide requirement/defect management role or Tool Y's build-and-deployment automation role."}, "distractor_note": "Option A is the most tempting wrong answer because both 'DevOps tool' and 'test management tool' are genuine syllabus categories being tested here - the distractor simply swaps which tool gets which label, testing whether the reader maps the described behavior to the correct name rather than just recognizing the two category names.", "alt_wording": "This could be asked as a negative question ('Which of the following is NOT a function associated with DevOps tools, according to the syllabus?') or as a direct-definition question ('What is the primary purpose of a test management tool, according to the syllabus?')."}, {"id": "Q209", "chapter": "5.4", "topic": "Configuration Management and Traceability", "type": "A", "difficulty": "green", "question": "A smart-agriculture company's test object spans irrigation-controller firmware, a cloud API, and a companion mobile app, each with its own test cases, test scripts, and test results. According to the syllabus, what does configuration management ensure about these related work products so that traceability can be maintained throughout the test process?", "options": {"A": "That each item is merged into a single combined document to avoid tracking multiple versions", "B": "That each item is uniquely identified, version controlled, tracked for changes, and related to the other configuration items", "C": "That each item is retested from scratch every time any one of the three components changes", "D": "That each item is reviewed by a certified test manager before it can be used"}, "correct": "B", "why_correct": "The syllabus states that, to properly support testing, configuration management ensures all configuration items - including test items - are uniquely identified, version controlled, tracked for changes, and related to other configuration items, so that traceability can be maintained throughout the test process.", "option_notes": {"A": "Incorrect. Configuration management does not require merging distinct items into one document; it manages multiple separate configuration items and the relationships between them.", "B": "Correct - matches the syllabus's wording on what CM ensures for traceability.", "C": "Incorrect. Configuration management is about identification, version control, and change tracking, not a retesting policy. Deciding what needs retesting after a change is a separate concern (e.g., regression testing scope), not something configuration management itself dictates.", "D": "Incorrect. Configuration management does not mandate review by a certified test manager; that describes a review/approval activity, not the function of configuration management."}, "distractor_note": null, "alt_wording": "Why does configuration management matter for a test project with multiple interrelated components (e.g., firmware, an API, and a mobile app)?"}, {"id": "Q207", "chapter": "5.3", "topic": "Content Unique to a Test Completion Report", "type": "E", "difficulty": "red", "question": "A bank's core-system migration project has just finished its final system-test cycle before go-live, and the team prepares its closing report. Which of the following is a typical element the syllabus lists for a TEST COMPLETION REPORT that does NOT also appear among the typical elements it lists for a routine TEST PROGRESS REPORT?", "options": {"A": "Test metrics gathered during the reporting period", "B": "New and changed risks identified during the period", "C": "Lessons learned that are relevant to the testing", "D": "Impediments encountered during testing and their workarounds"}, "correct": "C", "why_correct": "The syllabus's list of typical test completion report content includes 'lessons learned that are relevant to the testing' - this item does not appear in the syllabus's list of typical test progress report content. The other three items (test metrics, risk-related information, and impediments/workarounds) appear, in some form, in both lists.", "option_notes": {"A": "Incorrect as the answer - test metrics appear in both: progress reports include test metrics for the period, and completion reports include test metrics based on the accumulated progress reports.", "B": "Incorrect as the answer - 'new and changed risks within testing period' is actually listed as a test PROGRESS report element. The completion report instead lists a related but different item, 'unmitigated risks, defects not fixed,' so this specific wording belongs to progress reports, not uniquely to completion reports.", "C": "Correct - 'lessons learned' is listed by the syllabus only under test completion report content, not under test progress report content.", "D": "Incorrect as the answer - impediments and their workarounds appear in both lists (progress reports: 'impediments for testing, and their workarounds'; completion reports: 'testing impediments and workarounds')."}, "distractor_note": "This question is tricky because three of the four elements (metrics, risk information, impediments) appear in some form in BOTH report types, just phrased slightly differently between the two syllabus lists. 'Lessons learned' is the one element the syllabus reserves specifically for the completion report.", "alt_wording": "Which of the following appears in the syllabus's list of typical test progress report content but is absent from its list of typical test completion report content? (correct answer would be 'testing planned for the next period')"}, {"id": "Q199", "chapter": "4.5", "topic": "Collaborative User Story Writing - Stakeholder Testability Signal", "type": "B", "difficulty": "yellow", "question": "During collaborative story writing for a hospital's medication-management system, the team drafts a user story: 'As a clinician, I want to view a patient's medication history so that I can avoid prescribing conflicting drugs.' When asked how they would test this story, a clinician stakeholder is unable to describe any concrete way to verify it. According to the syllabus, what does this MOST likely indicate?", "options": {"A": "The user story may not be clear enough, or it may not reflect something the stakeholder actually finds valuable, or the stakeholder may simply need help understanding how to test it", "B": "The user story violates the 'Independent' criterion of INVEST and must be split into smaller, unrelated stories immediately", "C": "The story provides no genuine business value and should be removed from the backlog immediately", "D": "The team should proceed directly to writing acceptance criteria in Given/When/Then format, since that format always resolves testability confusion"}, "correct": "A", "why_correct": "The syllabus states directly: 'If a stakeholder does not know how to test a user story, this may indicate that the user story is not clear enough, or that it does not reflect something valuable to them, or that the stakeholder just needs help in testing (Wake 2003).' All three possibilities are given together as the likely explanations - the team's next step should be to investigate which of these applies, through further collaborative conversation, not to jump to a single conclusion.", "option_notes": {"A": "Correct - reproduces all three syllabus-stated possible explanations for a stakeholder's inability to describe how to test their own story.", "B": "Wrong. 'Independent' in INVEST concerns whether a story can be developed and delivered without being tightly coupled to other stories - it is unrelated to whether a stakeholder personally understands how to test the story's behavior.", "C": "Wrong - an overreaction not supported by the syllabus. One of the three stated possibilities is that the story simply isn't clear enough or the stakeholder needs help testing it; the syllabus does not conclude that testability confusion alone proves an absence of business value, and it does not recommend immediate removal.", "D": "Wrong. Switching to a specific acceptance-criteria format (Given/When/Then, i.e., BDD-style scenario-oriented format) is not stated anywhere in the syllabus as a guaranteed fix for this kind of testability confusion; the actual underlying issue (unclear story, low perceived value, or a skills gap) needs to be identified and addressed directly."}, "distractor_note": null, "alt_wording": "A product owner cannot explain how they would verify that a new user story has been correctly implemented. What three possible root causes does the syllabus suggest the team should consider?"}, {"id": "Q172", "chapter": "1.1", "topic": "Debugging Process - Reproduction, Diagnosis, Fixing", "type": "G", "difficulty": "green", "question": "During dynamic testing of a ride-sharing app's fare calculator, a tester finds that a five-mile trip is charged $2 more than expected. A developer is assigned to look into it: she first re-enters the same trip details to see the incorrect fare occur again, then steps through the fare-calculation code line by line to pinpoint exactly which statement is applying an extra surcharge, and finally corrects that line. Which activity does the developer's work represent?", "options": {"A": "Testing, because the developer is executing the fare-calculation code and observing its behavior", "B": "Debugging, because the developer is reproducing the failure, diagnosing its cause, and fixing the defect", "C": "Confirmation testing, because the developer is checking whether a previously failed test now passes", "D": "Regression testing, because the developer is checking whether the fix affects other parts of the fare calculator"}, "correct": "B", "why_correct": "The syllabus describes the typical debugging process, triggered when dynamic testing has caused a failure, as: reproduction of the failure, diagnosis (finding the defect), and fixing the defect. The developer's three steps - re-triggering the incorrect fare, tracing the code to find the exact faulty statement, and correcting it - map directly onto this reproduce-diagnose-fix sequence, which is debugging, not testing.", "option_notes": {"A": "Tempting because code is being executed and observed, which superficially resembles dynamic testing. But the goal here is to locate and remove a problem that is already known to exist, not to determine whether problems exist - that goal, and the reproduce-diagnose-fix pattern, is what makes this debugging rather than testing.", "B": "Correct - this is the textbook reproduction, diagnosis, and fixing sequence that the syllabus names as the typical debugging process following a dynamic-testing failure.", "C": "Confirmation testing happens after debugging is finished: it re-runs the previously failed test (or a new test covering the fix) to check that the fix actually resolved the problem. The scenario stops right after the fix is made, before any such re-test has occurred.", "D": "Regression testing checks whether a fix has caused adverse effects elsewhere in the system. Nothing in the scenario describes checking other, unrelated parts of the fare calculator - only reproducing, diagnosing, and fixing the one known problem."}, "distractor_note": "Option A is the main trap: because the developer is running and inspecting code, it can feel like testing. The distinguishing question to ask is whether the activity's purpose is to find out whether a problem exists (testing) or to locate and remove a problem already known to exist (debugging) - here it is clearly the latter.", "alt_wording": "A tester reports that a checkout page double-charges sales tax on certain orders. A developer then traces through the tax-calculation function step by step to find the exact line responsible for the duplicate charge, and corrects it. What is the developer doing?"}, {"id": "Q189", "chapter": "4.2", "topic": "Decision Table Testing - Feasible Rules and Coverage", "type": "H", "difficulty": "yellow", "question": "An online restaurant ordering system applies discounts based on three Boolean conditions: 'Customer is a loyalty member' (T/F), 'Order placed during happy hour' (T/F), and 'Valid promo code entered' (T/F). The system's checkout page automatically disables promo code entry whenever an order is placed during happy hour, so it is infeasible for both 'happy hour = True' and 'valid promo code entered = True' to occur together in the same rule, regardless of loyalty status. The team has already run test cases exercising 4 distinct feasible rules. What is the current decision table coverage, and how many more test cases are needed to reach 100%?", "options": {"A": "66.7% coverage (4 of 6 feasible rules); 2 more test cases are needed", "B": "50% coverage (4 of 8 total rules); 4 more test cases are needed", "C": "66.7% coverage; no more test cases are needed, because infeasible combinations already reduce the required testing effort enough", "D": "80% coverage (4 of 5 feasible rules); 1 more test case is needed"}, "correct": "A", "why_correct": "With 3 Boolean conditions, a full limited-entry decision table has 2^3 = 8 columns (rules). The infeasible combination is 'happy hour = True AND promo code = True,' which occurs regardless of loyalty status, i.e., for 2 of the 8 columns (loyalty = True with that combination, and loyalty = False with that combination). Removing those 2 infeasible columns leaves 8 - 2 = 6 feasible columns. Per the syllabus, decision table coverage items are the columns containing feasible combinations of conditions, and coverage is measured as exercised feasible columns divided by total feasible columns. With 4 of the 6 feasible rules already exercised, coverage = 4/6 = 66.7%, and 2 more feasible rules still need a test case each to reach 100%.", "option_notes": {"A": "Correct. 8 total combinations minus 2 infeasible ones (happy-hour-and-promo-code-together, for each loyalty value) leaves 6 feasible rules; 4/6 exercised = 66.7%, with 2 rules remaining.", "B": "Wrong. This uses the full 8 rules as the denominator instead of the 6 feasible rules, ignoring that decision table coverage is explicitly measured against feasible columns only, not the full un-simplified table. It also overstates the number of tests still needed as a result.", "C": "Wrong. Removing infeasible columns reduces the table size, but it does not exempt the remaining feasible columns from needing coverage - all 6 feasible rules must still be exercised by at least one test case each to reach 100% coverage; only 4 have been so far.", "D": "Wrong. This undercounts the infeasible combinations, effectively removing only 1 rule instead of correctly identifying that BOTH loyalty-member values (True and False) make the happy-hour-and-promo-code combination infeasible, which removes 2 columns, not 1."}, "distractor_note": "Option B represents the single most common decision-table mistake: forgetting to exclude infeasible combinations before calculating coverage percentage. Always identify and remove infeasible columns first, then compute coverage against that reduced, feasible total.", "alt_wording": "If this same restaurant discount decision table needed 100% coverage using the minimum number of test cases, how many total test cases would that require, and why is that number less than 2^3 = 8?"}, {"id": "Q200", "chapter": "5.1", "topic": "Wideband Delphi vs Three-Point Estimation", "type": "C", "difficulty": "red", "question": "Two expert-based estimation techniques described in the syllabus both rely on the judgment of multiple experts, but they differ in method. A test manager for a logistics company's route-optimization module wants an estimate produced in ONE round, where three specific figures - the most optimistic, most likely, and most pessimistic effort - are combined using a weighted formula that also yields a measure of estimation error. Which estimation technique does this describe, and how does it differ from Wideband Delphi?", "options": {"A": "Wideband Delphi; both techniques use the same single-round weighted formula E = (a + 4m + b) / 6", "B": "Three-point estimation; unlike Wideband Delphi, it uses one round of three weighted figures combined by a formula, rather than repeated rounds of anonymous re-estimation and discussion until the experts converge", "C": "Estimation based on ratios; unlike Wideband Delphi, it derives the estimate from a fixed historical development-to-test ratio rather than expert judgment", "D": "Extrapolation; unlike Wideband Delphi, it uses early project measurements rather than expert opinions"}, "correct": "B", "why_correct": "The described technique - three specific figures (optimistic a, most likely m, pessimistic b) combined via a weighted formula E = (a + 4m + b) / 6 in a single round, with SD = (b - a) / 6 as the error measure - is exactly three-point estimation as defined in the syllabus. Wideband Delphi differs because it is an iterative, expert-based technique: each expert estimates in isolation, results are compared, and if estimates deviate beyond agreed boundaries, the experts discuss and re-estimate (again in isolation) until consensus is reached. It has no single weighted formula for combining figures.", "option_notes": {"A": "Incorrect. Wideband Delphi does not use a fixed weighted formula at all - it reaches an estimate through repeated rounds of isolated estimation and group discussion until consensus, not through a mathematical combination of three figures.", "B": "Correct. This is three-point estimation, and the explanation correctly contrasts its single-round formula-based approach with Wideband Delphi's iterative consensus process.", "C": "Incorrect. Estimation based on ratios is a metrics-based technique using historical data (e.g., a 3:2 development-to-test ratio from past projects), not an expert-judgment technique involving optimistic/likely/pessimistic figures.", "D": "Incorrect. Extrapolation is also metrics-based, using measurements gathered early in the current project (e.g., averaging the last few iterations' effort), not expert opinions about a, m, and b."}, "distractor_note": "Option A is the most tempting distractor because both three-point estimation and Wideband Delphi are expert-based techniques, which can make a test-taker assume they share the same mechanics. The real differentiator the syllabus draws is process shape: three-point estimation is a single-round calculation, while Wideband Delphi is a multi-round consensus-building process (of which Planning Poker is a common Agile variant) with no fixed formula.", "alt_wording": "A team wants a consensus estimate reached through several rounds, where each expert first estimates in isolation and any outlying estimates are discussed before a new round of isolated re-estimation - is this Wideband Delphi or three-point estimation, and why?"}, {"id": "Q191", "chapter": "4.2", "topic": "Equivalence Partitioning - Coverage Rules (FALSE Statement)", "type": "E", "difficulty": "green", "question": "Which of the following statements about equivalence partitioning, according to the syllabus, is FALSE?", "options": {"A": "Equivalence partitions must not overlap and must be non-empty sets.", "B": "To achieve 100% equivalence partitioning coverage, only the valid partitions need to be exercised; exercising invalid partitions is optional.", "C": "Equivalence partitions may be continuous or discrete, ordered or unordered, and finite or infinite.", "D": "Each Choice coverage requires exercising each partition from each set of partitions at least once, but does not take combinations of partitions into account."}, "correct": "B", "why_correct": "The syllabus is explicit that 'to achieve 100% coverage with this test technique, test cases must exercise all identified partitions (including invalid partitions) by covering each partition at least once.' Invalid partitions are not optional for 100% coverage - they are coverage items just like valid partitions. Statement B contradicts this directly, making it the FALSE statement and therefore the correct answer to this question.", "option_notes": {"A": "True statement (not the answer). The syllabus states partitions 'must not overlap and must be non-empty sets.'", "B": "False statement (this is the answer). Invalid partitions ARE required for 100% equivalence partitioning coverage, not optional - the syllabus explicitly includes them in the coverage formula.", "C": "True statement (not the answer). The syllabus states partitions 'may be continuous or discrete, ordered or unordered, finite or infinite.'", "D": "True statement (not the answer). The syllabus defines Each Choice coverage exactly this way: it requires exercising each partition from each set at least once, without accounting for combinations of partitions."}, "distractor_note": null, "alt_wording": "All of the following are true about equivalence partitioning EXCEPT: (same four options, reworded stem)"}, {"id": "Q190", "chapter": "4.2", "topic": "State Transition Testing - Valid Transitions vs All Transitions Coverage", "type": "H", "difficulty": "red", "question": "A smart door lock cycles through 4 states (Locked, Unlocking, Unlocked, Locking) via exactly 4 valid transitions, forming a single cycle. Its state table also explicitly identifies 3 additional invalid transition attempts (e.g., pressing the lock button while already Locked), giving 7 transitions in total. A test suite exercises all 4 valid transitions and attempts 1 of the 3 invalid transitions. What valid transitions coverage and all transitions coverage does this test suite achieve?", "options": {"A": "Valid transitions coverage = 100% (4 of 4 valid transitions); all transitions coverage = approximately 71.4% (5 of 7 total transitions)", "B": "Valid transitions coverage = 100%; all transitions coverage = 100%, because achieving full valid transitions coverage automatically guarantees full all transitions coverage", "C": "Valid transitions coverage = approximately 57.1% (4 of 7); all transitions coverage = approximately 71.4% (5 of 7)", "D": "Valid transitions coverage = 100%; all transitions coverage = 80% (4 of 5 total transitions)"}, "correct": "A", "why_correct": "Per the syllabus, valid transitions coverage (0-switch coverage) is measured as exercised valid transitions divided by the TOTAL NUMBER OF VALID transitions only: 4/4 = 100%. All transitions coverage is measured as exercised valid-and-invalid transitions divided by the total number of valid AND invalid transitions shown in the state table: (4 valid + 1 invalid exercised) / (4 valid + 3 invalid total) = 5/7 = approximately 71.4%. The syllabus also states the relationship runs one way only: achieving full ALL transitions coverage guarantees full valid transitions coverage (and full all states coverage), but the reverse is not true - full valid transitions coverage does NOT guarantee full all transitions coverage, since invalid transitions can remain completely unexercised, as they do here (only 1 of 3 invalid transitions was attempted).", "option_notes": {"A": "Correct: valid transitions coverage divides by the valid-transition total (4/4=100%); all transitions coverage divides by the combined total (5/7 is approximately 71.4%).", "B": "Wrong. This states the implication backwards. The syllabus says full ALL transitions coverage guarantees full valid transitions coverage - not the other way around. Here, 100% valid transitions coverage is achieved while 2 of the 3 invalid transitions remain completely untested, so all transitions coverage is well below 100%.", "C": "Wrong. This divides the 4 exercised valid transitions by the combined total of 7 transitions (valid + invalid), rather than dividing by the total number of valid transitions alone (4). Valid transitions coverage is defined against valid transitions only, not the full transition count.", "D": "Wrong. This assumes only 1 invalid transition exists in total (giving a total of 4 valid + 1 invalid = 5), when the state table actually identifies 3 invalid transitions, only 1 of which was exercised."}, "distractor_note": "Option B tests a specific, easily-reversed syllabus relationship: full all-transitions coverage implies full valid-transitions coverage, but achieving 100% valid transitions coverage says nothing about how many invalid transitions were covered, since invalid transitions aren't counted in that metric at all.", "alt_wording": "For the same door-lock state model, if the team wants to reach a minimum requirement suitable for mission- or safety-critical software (per the syllabus), which coverage criterion must they target, and how many more invalid transitions must be exercised from the current test suite to achieve it?"}, {"id": "Q194", "chapter": "4.3", "topic": "Value and Limits of White-Box Testing - Defects of Omission", "type": "D", "difficulty": "yellow", "question": "A tax-calculation module's requirements specify that a luxury-tax surcharge must be applied to purchases over $10,000. However, the developer never implemented this rule at all - no code path for it exists anywhere in the module. A team then achieves 100% statement coverage and 100% branch coverage on the module through white-box testing, yet the missing surcharge rule is never detected. What does the syllabus identify as the BEST explanation for this?", "options": {"A": "White-box testing is based on the code that exists, so it cannot detect defects caused by requirements that were never implemented at all - a limitation the syllabus calls defects of omission", "B": "White-box testing always achieves lower coverage than black-box testing for financial calculations, which is why the missing rule went undetected", "C": "100% branch coverage is not actually achievable for modules involving monetary thresholds, so the reported coverage figures must be inaccurate", "D": "The team should have used decision table testing instead of white-box testing, since decision tables always catch every missing business rule"}, "correct": "A", "why_correct": "The syllabus states a specific weakness of white-box test techniques: 'if the software does not implement one or more requirements, white-box testing may not detect the resulting defects of omission.' Because white-box techniques derive test cases from the code's actual structure, a requirement with no corresponding code simply has nothing for the coverage-based tests to exercise - 100% statement and branch coverage only describes how thoroughly the EXISTING code was tested, not whether all required behavior exists.", "option_notes": {"A": "Correct - directly matches the syllabus's stated weakness of white-box testing: defects of omission (missing requirements) are invisible to a technique that only analyzes existing code structure.", "B": "Wrong. Coverage levels achieved by white-box vs. black-box testing are not compared or ranked this way anywhere in the syllabus, and this claim doesn't explain why a completely missing code path was never flagged - the real issue is that there was no code to cover, not a coverage-level shortfall.", "C": "Wrong. Nothing in the syllabus suggests 100% branch coverage is unachievable for financial modules; this is an unsupported, fabricated claim that doesn't address the actual cause (a missing requirement).", "D": "Wrong. While black-box techniques like decision table testing are indeed well suited to checking business rules against a specification (and could plausibly have caught this specific gap), the syllabus does not claim decision tables 'always' catch every missing rule, and the question is asking specifically about a documented LIMITATION of white-box testing, not a technique-substitution recommendation."}, "distractor_note": null, "alt_wording": "Why can a module pass 100% statement coverage AND 100% branch coverage through white-box testing while still failing to implement one of its documented requirements?"}, {"id": "Q198", "chapter": "4.5", "topic": "ATDD Test Case Creation Order", "type": "A", "difficulty": "yellow", "question": "A team practices ATDD for a user story: 'As a customer, I want to apply a discount code at checkout so that I pay a reduced price.' Its acceptance criteria cover a valid code being applied correctly, an expired code being rejected, promo codes not stacking with other active promotions, and checkout completing within 2 seconds even when a code is applied. According to the syllabus's description of ATDD, in what order should the team typically create its test cases during test design?", "options": {"A": "First, positive test cases confirming correct behavior with no errors (e.g., a valid code is applied correctly); then negative test cases (e.g., an expired code is rejected, stacking is blocked); finally, test cases covering non-functional quality characteristics (e.g., the 2-second checkout performance criterion)", "B": "First negative test cases, to surface defects as early as possible; then positive test cases; then non-functional test cases", "C": "Non-functional test cases first, since performance is treated as the team's highest business risk; then positive test cases; then negative test cases", "D": "Positive and negative test cases should be created together, interleaved rule by rule; non-functional criteria are covered incidentally within those same test cases rather than as separate ones"}, "correct": "A", "why_correct": "The syllabus states the typical ATDD ordering explicitly: 'Typically, the first test cases are positive, confirming the correct behavior without exceptions or error conditions... After the positive test cases are done, the team should perform negative testing. Finally, the team should cover non-functional quality characteristics.' Applied to this story, that means: valid-code application first, then expired-code/stacking-rejection cases, then the 2-second performance criterion last.", "option_notes": {"A": "Correct - matches the syllabus's stated order: positive, then negative, then non-functional.", "B": "Wrong. This reverses the syllabus's stated order. Positive test cases (confirming the sequence of activities executed when everything goes as expected) are created first, not negative ones.", "C": "Wrong. Nothing in the syllabus's description of ATDD prioritizes non-functional test cases first based on perceived business risk; the stated order is positive, then negative, then non-functional, regardless of risk framing (risk-based prioritization is a separate topic covered in Chapter 5, not part of the ATDD ordering guidance).", "D": "Wrong. The syllabus treats non-functional quality characteristics as their own distinct, later step in ATDD test design, not something folded incidentally into positive/negative functional test cases."}, "distractor_note": null, "alt_wording": "In ATDD, why does the syllabus recommend writing the 'happy path' test cases before the error-condition and non-functional ones, rather than mixing them in whatever order the team encounters them during the specification workshop?"}, {"id": "Q183", "chapter": "3.2", "topic": "Review Types - Walkthrough, Technical Review, Informal Review, Inspection", "type": "F", "difficulty": "yellow", "question": "A financial-technology company runs several different review sessions while developing a new fraud-detection module. Consider the following statements about the review types described in the syllabus:\n\nI. A walkthrough is led by the author of the work product, does not require reviewers to perform an individual review beforehand, and can serve to educate reviewers and build consensus, among other objectives.\n\nII. A technical review is performed by technically qualified reviewers, is led by a moderator, and is primarily aimed at gaining consensus and making decisions about a technical problem.\n\nIII. An informal review follows the complete generic review process defined by ISO/IEC 20246, and its main objective is to find the maximum number of anomalies.\n\nIV. An inspection is led by the author of the work product, since the author has the most complete understanding of what the work product is intended to do.\n\nWhich TWO statements are correct?", "options": {"A": "I and II", "B": "I and III", "C": "II and IV", "D": "III and IV"}, "correct": "A", "why_correct": "Statement I correctly describes a walkthrough: the syllabus states a walkthrough 'is led by the author' and that 'reviewers might perform an individual review before the walkthrough, but this is not required,' with objectives including educating reviewers and gaining consensus. Statement II correctly describes a technical review: 'performed by technically qualified reviewers and led by a moderator,' with objectives that include gaining 'consensus and make decisions regarding a technical problem.' Statement III is false - following the complete generic process and aiming to find the maximum number of anomalies describes an Inspection, not an informal review; informal reviews explicitly 'do not follow a defined process and do not require a formal documented output.' Statement IV is false - inspections are led by a moderator/review leader, and the syllabus specifically states that 'in inspections, the author cannot act as the review leader or scribe'; being author-led is a trait of a walkthrough, not an inspection.", "option_notes": {"A": "Correct - both I and II accurately restate the syllabus definitions of walkthrough and technical review.", "B": "I is correct, but III incorrectly swaps the Inspection's traits (formal, complete process, maximum anomaly detection) onto the informal review, which is actually the least formal, least structured review type.", "C": "II is correct, but IV incorrectly assigns author-led leadership to the inspection; inspections explicitly prohibit the author from being review leader or scribe.", "D": "Both III and IV are incorrect - each takes a defining trait from one review type (inspection's rigor, walkthrough's author-led format) and misattributes it to a different review type."}, "distractor_note": "Statements III and IV are built by swapping defining traits between review types - the rigor and thoroughness of an inspection is pasted onto 'informal review,' and the author-led format of a walkthrough is pasted onto 'inspection.' This is a common exam-writing technique: instead of inventing a false fact, take a true fact about one concept and relabel it under a similar, related concept.", "alt_wording": "This could be asked as a matching question ('match each review type to its defining trait') or reworded as a single negative question: 'Which of the following statements about review types is FALSE?' using one of the swapped-trait statements (III or IV) as the answer."}, {"id": "Q177", "chapter": "1.5", "topic": "Generic Tester Skills - Domain Knowledge vs Technical Knowledge", "type": "C", "difficulty": "red", "question": "Two testers are assigned to a new insurance claims fraud-detection system. Tester A spends time learning the test automation framework and the CI pipeline configuration, so that new test scripts run efficiently as part of the automated build. Tester B spends time learning how insurance claims adjusters actually process claims and which fraud patterns are common in the industry, so she can judge whether a flagged claim result makes business sense. According to the syllabus's list of generic tester skills, which skills are Tester A and Tester B respectively developing?", "options": {"A": "Tester A: technical knowledge; Tester B: domain knowledge", "B": "Tester A: domain knowledge; Tester B: technical knowledge", "C": "Tester A: analytical thinking; Tester B: critical thinking", "D": "Tester A: testing knowledge; Tester B: analytical thinking"}, "correct": "A", "why_correct": "The syllabus lists 'technical knowledge (to increase efficiency of testing, e.g., by using appropriate test tools)' and 'domain knowledge (to be able to understand and to communicate with end users/business representatives)' as two separate generic skills. Tester A is learning the automation framework and CI pipeline - tooling mechanics - which is technical knowledge. Tester B is learning the claims-processing business and industry fraud patterns - which is domain knowledge.", "option_notes": {"A": "Correct - Tester A's tooling/pipeline focus is technical knowledge; Tester B's industry/business focus is domain knowledge.", "B": "Reverses the two skills - a common mix-up because both testers are described as 'learning' something, but automation-framework and CI-pipeline mechanics is technical knowledge, while claims-processing and industry patterns is domain knowledge, not the reverse.", "C": "Analytical thinking and critical thinking are genuine listed skills, but they describe reasoning approaches (breaking problems down, questioning assumptions and requirements) rather than the act of learning a specific tool/pipeline or a specific industry's business processes - neither tester's described activity matches these reasoning-focused skills.", "D": "Testing knowledge means knowledge of test techniques and testing approaches themselves, not CI/automation tooling; analytical thinking is a reasoning skill, not the activity of learning how claims adjusters work. Both pairings are mismatched to what is actually described."}, "distractor_note": "Option B is the classic swap-the-labels trap: since both testers are clearly 'learning' something, it is easy to mislabel which one is technical versus domain knowledge if read too quickly. The key giveaway is WHAT each tester is learning about - tooling/pipeline mechanics point to technical knowledge, while business/industry understanding points to domain knowledge.", "alt_wording": "A tester spends a week shadowing warehouse staff to understand how a logistics company actually picks and packs orders, while a colleague spends the week mastering the team's new API-testing tool. Which generic testing skills are each of them developing?"}, {"id": "Q202", "chapter": "5.1", "topic": "Primary Purpose of a Test Plan", "type": "D", "difficulty": "green", "question": "A test manager preparing a new test plan for a government benefits portal is asked by a stakeholder: 'What is this document actually for?' According to the syllabus, which of the following BEST describes the primary purpose of a test plan?", "options": {"A": "To guarantee that the released software will contain zero defects", "B": "To document the means and schedule for achieving the test objectives, and to serve as a means of communication with team members and other stakeholders", "C": "To replace the organization's test policy and test strategy with project-specific rules", "D": "To list every individual test case that will be executed during the project"}, "correct": "B", "why_correct": "The syllabus states that a test plan documents the means and schedule for achieving test objectives, helps ensure performed test activities meet established criteria, serves as a means of communication with stakeholders, and demonstrates adherence to (or deviation from) the test policy and test strategy. Option B captures this core purpose.", "option_notes": {"A": "Incorrect. No document can guarantee zero defects; this also contradicts the 'absence of defects is a fallacy' idea from the testing principles - defects can still slip through even with a thorough test plan.", "B": "Correct - matches the syllabus's stated purpose of a test plan.", "C": "Incorrect. A test plan demonstrates that testing will adhere to the existing test policy and test strategy, or explains why it will deviate from them - it does not replace those higher-level documents.", "D": "Incorrect. Individual test cases are testware typically documented in separate test case specifications produced during test design/implementation, not listed line-by-line inside the test plan itself, which instead addresses scope, approach, risks, schedule, and similar higher-level content."}, "distractor_note": null, "alt_wording": "Which of the following is NOT one of the syllabus-listed purposes of a test plan? (turns this into a negative-style question using the same four candidate purposes)"}, {"id": "Q184", "chapter": "3.2", "topic": "Review Process Activities - Communication and Analysis vs Fixing and Reporting", "type": "D", "difficulty": "red", "question": "A hospital IT team is reviewing a new patient-intake workflow document. During a review meeting, the participants discuss each anomaly the reviewers had logged, decide which ones are genuine defects versus false positives, and assign an owner and required action for every confirmed defect. Two weeks later, all confirmed defects have been fixed and verified, the exit criteria defined earlier for this review have been met, the review leader formally accepts the work product, and the review results are reported to project stakeholders. Which activity of the generic review process does this final step - verifying the fixes, confirming exit criteria are met, accepting the work product, and reporting results - BEST represent?", "options": {"A": "Communication and analysis", "B": "Individual review", "C": "Fixing and reporting", "D": "Review initiation"}, "correct": "C", "why_correct": "The syllabus describes the generic review process activity 'Fixing and reporting' as follows: 'For every defect, a defect report should be created so that corrective actions can be followed up. Once the exit criteria are reached, the work product can be accepted. The review results are reported.' This matches the final step described in the scenario exactly: defects have been fixed and verified, exit criteria are confirmed as met, the work product is accepted, and results are reported. The earlier review meeting, where anomalies were discussed and classified into defects versus false positives with owners assigned, is a separate, earlier activity called 'Communication and analysis' - the question asks specifically about what happens afterward, not about the meeting itself.", "option_notes": {"A": "This describes the earlier part of the scenario (the review meeting where anomalies are discussed, classified as defects or false positives, and assigned owners), not the final step the question asks about. It is tempting because the passage does mention a meeting, but the question specifically points to what happened two weeks later, after the meeting.", "B": "Individual review happens even earlier than the meeting, when each reviewer works alone to examine the work product and log anomalies, recommendations, and questions. Nothing in the final step described (fixes verified, exit criteria met, acceptance, reporting) involves an individual, private examination.", "C": "Correct. Creating defect reports for confirmed defects, reaching exit criteria, accepting the work product, and reporting the results is precisely the 'Fixing and reporting' activity as defined in the syllabus.", "D": "Review initiation is the very first activity, occurring before any anomalies are even logged - it ensures every participant has access to the work product and understands their role. It has nothing to do with fixes, exit criteria, or final reporting, which all happen much later in the process."}, "distractor_note": "This question embeds two different review-process activities in one scenario: the meeting (Communication and analysis) and the later step (Fixing and reporting), but only asks about the second one. A reader who scans for the word 'meeting' or 'discussed anomalies' may reflexively pick Communication and analysis without noticing the question is really asking about the acceptance-and-reporting step that happened two weeks afterward.", "alt_wording": "This could be asked as a sequencing question ('Put the following four review-process activities in the order they occur: Fixing and reporting, Individual review, Planning, Communication and analysis') or as a direct comparison question contrasting what happens during Communication and analysis versus what happens during Fixing and reporting."}, {"id": "Q192", "chapter": "4.3", "topic": "Statement Coverage Calculation", "type": "H", "difficulty": "green", "question": "A traffic-light controller function contains 25 executable statements. A test suite exercises 19 of them. What statement coverage does this test suite achieve?", "options": {"A": "76% (19 divided by 25)", "B": "95% (mistakenly treating 20, not 25, as the total number of executable statements)", "C": "24% (the percentage of statements NOT exercised, mistaken for the coverage figure itself)", "D": "19% (misreading the raw count of exercised statements as if it were already a percentage)"}, "correct": "A", "why_correct": "Per the syllabus, statement coverage is measured as the number of statements exercised by the test cases divided by the total number of executable statements in the code, expressed as a percentage. Here that is 19 / 25 = 0.76 = 76%.", "option_notes": {"A": "Correct: 19/25 = 76%.", "B": "Wrong. This results from using an incorrect total (20 instead of the stated 25 executable statements), which is a data-entry/miscounting error rather than a valid alternative calculation.", "C": "Wrong. 24% is the percentage of statements that were NOT exercised (6 of 25 = 24%), which is the complement of the coverage figure, not the coverage figure itself. A common mistake is calculating the 'gap' and reporting it as if it were the coverage achieved.", "D": "Wrong. This simply restates the raw exercised-statement count (19) as a percentage without dividing by the total number of executable statements at all."}, "distractor_note": null, "alt_wording": "If this same 25-statement function needs to reach at least 90% statement coverage, what is the minimum number of statements that must be exercised, and how many additional statements beyond the 19 already covered does that require?"}, {"id": "Q173", "chapter": "1.2", "topic": "Testing's Contributions to Success", "type": "E", "difficulty": "yellow", "question": "An airline is evaluating why it invests in a dedicated test team for its baggage-tracking system. According to the syllabus's description of testing's contributions to success, which of the following is NOT one of the ways that testing contributes to project success?", "options": {"A": "It provides a cost-effective means of detecting defects, which can then be removed through debugging", "B": "It provides users with indirect representation on the development project when continuously involving real users is not feasible", "C": "It guarantees that, once testing is complete, the software contains no remaining defects", "D": "It may be required to meet contractual, legal, or regulatory requirements"}, "correct": "C", "why_correct": "Section 1.2.1 lists testing's contributions to success as: providing a cost-effective means of detecting defects, providing a direct means of evaluating quality at various SDLC phases to support decisions, providing users with indirect representation on the project, and being required to meet contractual, legal, or regulatory needs. Nowhere does the syllabus claim testing 'guarantees' the absence of remaining defects - that directly contradicts the first testing principle (testing shows the presence, not the absence, of defects), so it cannot be one of testing's genuine contributions.", "option_notes": {"A": "True - this is a direct restatement of the syllabus's first listed contribution: testing provides a cost-effective means of detecting defects, which are then removed by debugging.", "B": "True - this restates the syllabus's point that testing provides users with indirect representation on the project when involving a representative set of real users continuously is too costly or impractical.", "C": "False - this is the correct answer to the NOT question. No source ever claims testing 'guarantees' zero remaining defects; this is the classic misconception the syllabus's testing principles explicitly warn against.", "D": "True - this restates the syllabus's point that testing may be required to meet contractual or legal requirements, or to comply with regulatory standards."}, "distractor_note": "Option C is designed to sound like a natural, positive-sounding benefit of testing, but it directly contradicts the principle that testing can show defects are present but never prove they are absent - a classic exam trap that combines section 1.2 with the testing principles in section 1.3.", "alt_wording": "Which of the following is a myth about what testing contributes to a project, rather than a genuine contribution described by the syllabus?"}, {"id": "Q178", "chapter": "2.1", "topic": "Test-First Approaches - TDD vs BDD", "type": "C", "difficulty": "yellow", "question": "A healthcare software company is building a new appointment-scheduling service using two different practices in parallel. Team 1 writes low-level unit tests before writing any production code, then writes just enough code to make each test pass, then refactors both the tests and the code. Team 2 works with clinic administrators to write scenarios such as 'Given a patient has no upcoming appointments, When they request the earliest available slot, Then the system offers the next open slot within their preferred clinic,' which are later translated into automated tests. Which test-first approaches are Team 1 and Team 2 respectively using?", "options": {"A": "Team 1: Test-Driven Development (TDD); Team 2: Behavior-Driven Development (BDD)", "B": "Team 1: Behavior-Driven Development (BDD); Team 2: Acceptance Test-Driven Development (ATDD)", "C": "Team 1: Acceptance Test-Driven Development (ATDD); Team 2: Test-Driven Development (TDD)", "D": "Team 1: Test-Driven Development (TDD); Team 2: Acceptance Test-Driven Development (ATDD)"}, "correct": "A", "why_correct": "TDD is defined as directing coding through test cases: tests are written first, then code is written to satisfy the tests, then the tests and code are refactored - exactly Team 1's low-level unit-test cycle. BDD expresses the desired behavior of an application in a simple form of natural language, usually the Given/When/Then format, that is easy for stakeholders to understand and which is then automatically translated into executable tests - exactly Team 2's clinic-administrator scenario.", "option_notes": {"A": "Correct - Team 1's write-test/write-code/refactor cycle is TDD; Team 2's Given/When/Then scenario written with business stakeholders and later automated is BDD.", "B": "Mislabels Team 1's activity as BDD, when Team 1 is writing low-level unit tests and refactoring code - the TDD cycle - not natural-language scenarios; also mislabels Team 2 as ATDD rather than BDD.", "C": "Reverses both correctly-matched approaches, calling TDD's write-test/write-code/refactor cycle 'ATDD' and the natural-language Given/When/Then scenario 'TDD.'", "D": "Correctly identifies Team 1 as TDD, but mislabels Team 2 as ATDD. ATDD is also a genuine test-first approach involving acceptance criteria derived with business representatives, but the syllabus specifically attributes the natural-language Given/When/Then format, later translated into executable tests, to BDD - making BDD the more precise match for Team 2's described activity."}, "distractor_note": "Option D is the most defensible-looking wrong answer, since ATDD and BDD are closely related and both involve collaboration with business people on acceptance-criteria-like statements. The distinguishing detail the exam expects you to catch is the explicit Given/When/Then natural-language format, which the syllabus specifically attributes to BDD rather than ATDD.", "alt_wording": "A team writes 'Given an item is out of stock, When a customer tries to add it to their cart, Then the system displays an unavailable message' before development begins, and these statements are later automated into executable tests. Which test-first approach is this?"}, {"id": "Q204", "chapter": "5.2", "topic": "Risk Transfer vs Risk Mitigation by Testing", "type": "C", "difficulty": "yellow", "question": "For a maritime shipping-tracking system, the team identifies a product risk: the vessel position feed could report stale GPS coordinates during network handoffs. In response, the team purchases additional insurance to cover potential losses from cargo misrouted because of this issue, without changing the test approach at all. Which category of response to product risk does this represent?", "options": {"A": "Risk mitigation by testing, since resources are being spent to address the risk", "B": "Risk transfer, since the financial consequence of the risk is being shifted to a third party (the insurer) instead of being reduced through testing", "C": "Risk acceptance, since the team has decided to do nothing about the risk", "D": "Risk monitoring, since the team is tracking the risk's potential financial impact"}, "correct": "B", "why_correct": "The syllabus lists several general response options to an analyzed product risk: risk mitigation by testing, risk acceptance, risk transfer, or a contingency plan. Purchasing insurance shifts the financial consequence of the risk to a third party (the insurer) rather than reducing the likelihood or impact through testing - this is the definition of risk transfer.", "option_notes": {"A": "Incorrect. Mitigation BY TESTING refers specifically to testing-related actions (selecting testers with the right skills, applying appropriate independence, performing reviews/static analysis, applying suitable test techniques and coverage, appropriate test types, dynamic/regression testing). Buying insurance is not a testing action, even though money is being spent.", "B": "Correct - buying insurance transfers the financial consequence elsewhere, which is exactly what risk transfer means.", "C": "Incorrect. Acceptance means consciously deciding to take no action and simply live with the risk. Here the team took an active step (purchasing insurance), so this is not acceptance.", "D": "Incorrect. Risk monitoring is about checking whether mitigation actions remain effective, gathering more information to refine risk assessment, and spotting emerging risks - not shifting a risk's financial consequence to an insurer."}, "distractor_note": "Option C is the main trap because 'not changing the test approach' can look like doing nothing. But the team did take an active response - buying insurance - so it isn't acceptance. The distinguishing feature of transfer is that the consequence (not the likelihood or the testing approach) is being shifted elsewhere.", "alt_wording": "A retailer's product risk of a payment-gateway outage during a promotion is handled by writing a contract clause making a subcontractor liable for related losses, instead of testing more thoroughly - name this response option and explain why it isn't mitigation by testing."}, {"id": "Q176", "chapter": "1.4", "topic": "Test Process in Context - Business Domain Factor", "type": "D", "difficulty": "yellow", "question": "A test manager is defining the test process for a new consumer lending app. Because the app operates under strict financial-privacy regulations, the team adds mandatory compliance test cases, an extra independent review stage, and detailed audit-trail documentation that a comparable internal expense-reporting tool at the same company does not require. According to the syllabus, which contextual factor BEST explains this difference in the test process?", "options": {"A": "Team members - the lending app's testers happen to have more experience than the internal tool's testers", "B": "Business domain - the lending app has specific legal regulations and higher criticality than the internal tool", "C": "Tools - the lending app's team has access to better test automation tools", "D": "Technical factors - the lending app uses a different technology stack than the internal tool"}, "correct": "B", "why_correct": "Section 1.4.2 lists 'business domain (criticality of the test object, identified risks, market needs, specific legal regulations, etc.)' as one of the contextual factors that shape the test process. Strict financial-privacy regulation and the resulting compliance test cases, extra review, and audit-trail requirements are a direct example of this fac
