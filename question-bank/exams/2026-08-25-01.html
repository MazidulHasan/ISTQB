tor - not of team skill, tooling, or technology differences, none of which are mentioned in the scenario.", "option_notes": {"A": "Team members (skills, knowledge, experience, availability) is a genuine listed factor, but the scenario gives no information about relative experience between the two teams - it explicitly cites regulation as the driver, which maps to business domain.", "B": "Correct - the scenario's extra compliance testing, review stage, and audit trail are driven by legal regulation and criticality, exactly matching the business domain factor.", "C": "Tools (availability, usability, compliance) is a genuine listed factor, but nothing in the scenario describes a difference in automation tooling between the two projects.", "D": "Technical factors (type of software, architecture, technology used) is a genuine listed factor, but the scenario does not describe any technology-stack difference - the stated driver is legal and regulatory."}, "distractor_note": "All four options name real contextual factors from the syllabus's list (stakeholders, team members, business domain, technical factors, project constraints, organizational factors, SDLC, tools) - the trap is picking a genuine factor that simply is not the one the scenario's details actually illustrate.", "alt_wording": "A hospital's patient-record system requires additional formally documented reviews that a similar internal staff-scheduling tool at the same hospital does not need, because of healthcare data regulations. Which contextual factor explains this difference?"}, {"id": "Q203", "chapter": "5.2", "topic": "Project Risk vs Product Risk Classification", "type": "F", "difficulty": "red", "question": "A supply-chain visibility platform project has raised four concerns:\n\nI. The platform's geolocation module reports the wrong warehouse for roughly 1 in 200 shipments.\nII. The only integration specialist familiar with the customs-clearance API has resigned mid-project.\nIII. The chosen test automation tool has poor support for the platform's newer UI framework, slowing down test script creation.\nIV. Under peak load, the platform's dashboard takes over 30 seconds to refresh, well outside the non-functional requirement.\n\nWhich combination correctly classifies these as project risks vs product risks, according to the syllabus's examples?", "options": {"A": "I and IV are product risks; II and III are project risks", "B": "I and II are product risks; III and IV are project risks", "C": "I, III, and IV are product risks; II is a project risk", "D": "All four are product risks, since they all ultimately affect the delivered platform"}, "correct": "A", "why_correct": "Item I (wrong functionality/incorrect output) and item IV (inadequate response time) are both explicitly listed by the syllabus as examples of product risks - they relate to the product's own quality characteristics. Item II (staff shortage/people issue) and item III (poor tool support, listed under project risks' 'technical issues') are both explicitly listed as examples of project risks - they relate to the project's ability to meet its schedule, budget, or scope, not the product's quality.", "option_notes": {"A": "Correct. Matches the syllabus's categorization: I and IV are product quality issues (wrong output, inadequate response time); II and III are issues with running the project itself (staffing, tooling).", "B": "Incorrect. It swaps II into product risks, but a resigned specialist is a people issue explicitly listed under project risks, not a product quality characteristic.", "C": "Incorrect. It places III (poor tool support) among the product risks, but the syllabus explicitly lists 'poor tool support' as a project risk example under technical issues, alongside scope creep - it affects the project's execution, not the software's own quality.", "D": "Incorrect. This collapses the entire project risk vs product risk distinction; staffing and tooling problems affect the project's schedule/budget/scope, which is precisely the definition of a project risk, not a product risk."}, "distractor_note": "Option C is the most common trap: 'poor tool support' sounds like it concerns testing quality, tempting a reader to file it under product risk. But the syllabus is explicit that poor tool support is a project risk (a technical issue affecting the project), while inadequate response time IS a product risk because it is a product quality characteristic (performance efficiency).", "alt_wording": "For each of four listed concerns on an aviation maintenance-logging project, state whether it is a project risk or a product risk, then pick the option with the fully correct grouping."}, {"id": "Q201", "chapter": "5.1", "topic": "Additional Coverage Prioritization (Synonym/Description)", "type": "G", "difficulty": "yellow", "question": "A test team for POS terminal firmware orders its regression suite like this: the first test case chosen is the one that, by itself, achieves the most statement coverage. Every test case chosen after that is the one that adds the largest amount of NEW statement coverage not already achieved by any previously selected test case. The syllabus has a specific name for this ordering approach - what is it?", "options": {"A": "Risk-based prioritization", "B": "Requirements-based prioritization", "C": "Coverage-based prioritization (the basic form, where each test case is ranked independently by its own coverage figure)", "D": "Additional coverage prioritization, a variant of coverage-based prioritization in which each subsequent test case is the one achieving the highest ADDITIONAL coverage"}, "correct": "D", "why_correct": "The syllabus explicitly names this exact approach 'additional coverage prioritization': after the first test case (chosen for the highest coverage on its own), each subsequent test case is selected because it achieves the highest additional coverage relative to what has already been covered. This is presented as a specific variant of coverage-based prioritization, distinct from the basic form.", "option_notes": {"A": "Incorrect. Risk-based prioritization orders test execution by the results of risk analysis, executing test cases covering the most important risks first - coverage figures are not the basis here.", "B": "Incorrect. Requirements-based prioritization orders test execution by stakeholder-defined requirement priorities, not by statement coverage.", "C": "Incorrect but tempting. Plain coverage-based prioritization ranks test cases independently by their own coverage (e.g., always run the highest-coverage test cases first), which could pick two heavily overlapping tests back to back. The scenario specifically re-evaluates 'not yet covered' after each selection, which is the additional coverage variant, not the basic form.", "D": "Correct - matches the syllabus's description and name for this exact selection process."}, "distractor_note": "Option C is the key trap: it is the correct parent category (coverage-based) but the wrong specific variant. The scenario's re-evaluation of remaining uncovered code after each pick is precisely what distinguishes 'additional coverage prioritization' from the basic coverage-based approach, which does not account for overlap between already-selected tests.", "alt_wording": "Which prioritization strategy avoids selecting two test cases that mostly re-cover the same code, by always choosing next the test case that adds the most NEW coverage compared to what has already been selected?"}, {"id": "Q208", "chapter": "5.4", "topic": "Formal Change Control After Baseline Approval", "type": "D", "difficulty": "yellow", "question": "A genomics lab's sequencing-analysis software has a test environment configuration that was approved for testing and is now treated as a baseline under configuration management. A developer wants to upgrade one of the underlying libraries in that environment. According to the syllabus, what BEST describes what configuration management requires before this change can be made?", "options": {"A": "The change should go through a formal change control process, since a baseline can only be changed that way", "B": "The change can be made freely, as long as the developer documents it afterward in an email to the team", "C": "The change is blocked entirely, since baselines can never be changed once approved", "D": "The change only needs sign-off from the test manager, since configuration management is solely a testing responsibility"}, "correct": "A", "why_correct": "The syllabus states: 'If the configuration item is approved for testing, it becomes a baseline and can only be changed through a formal change control process.' Configuration management also keeps a record of changed configuration items when a new baseline is created, which is how it remains possible to revert to a previous baseline to reproduce earlier test results.", "option_notes": {"A": "Correct - matches the syllabus's wording exactly.", "B": "Incorrect. Informal, after-the-fact documentation (like an email) is not a formal change control process; configuration management requires tracked, controlled changes, not free-form self-reporting.", "C": "Incorrect. Baselines CAN be changed - just only through a formal change control process. They are not permanently frozen, and configuration management specifically supports reverting to an earlier baseline when needed.", "D": "Incorrect. Configuration management supports testing but is a broader project/organizational discipline covering all configuration items (documentation, software, environments), not something restricted to sign-off by a test manager alone."}, "distractor_note": "Option C is a common overcorrection: readers remember that a baseline is 'locked' and conclude it can never change again, but the syllabus's actual point is that changes remain possible - they just must go through formal change control, which is also why it's possible to revert to an earlier baseline to reproduce previous test results.", "alt_wording": "After a test environment is approved and becomes a baseline, describe what configuration management still allows regarding future changes to it, and what it prevents."}, {"id": "Q197", "chapter": "4.4", "topic": "Checklist-Based Testing - Maintenance and Length Pitfalls", "type": "D", "difficulty": "red", "question": "A QA lead has used the same 15-item usability checklist, unchanged, to test every release of a banking app for three years. Recently, several high-severity usability defects have slipped through even though every checklist item still passes on every release. According to the syllabus, what is the MOST likely explanation, and what should the QA lead do about it?", "options": {"A": "Checklist entries can gradually become less effective over time as developers learn to avoid the errors the checklist was built to catch; the checklist should be regularly updated based on defect analysis, including new entries for newly found high-severity defects", "B": "The checklist approach is fundamentally unsuitable for usability testing and should be replaced entirely with exploratory testing", "C": "The checklist has too few items; the QA lead should expand it to at least 50 items to increase its defect-detection power", "D": "Checklist-based testing always loses effectiveness after its first year of use and should be discarded and rewritten after every major release, regardless of what defects have occurred"}, "correct": "A", "why_correct": "The syllabus states: 'Some checklist entries may gradually become less effective over time because the developers will learn to avoid making the same errors. New entries may also need to be added to reflect newly found high severity defects. Therefore, checklists should be regularly updated based on defect analysis.' This exactly matches the scenario: a static, unchanged checklist stops catching new categories of defects as developers adapt, and the fix is regular defect-analysis-driven updates, not abandonment or indiscriminate expansion.", "option_notes": {"A": "Correct - matches the syllabus's specific guidance on why checklists lose effectiveness over time and how to address it (regular, defect-analysis-driven updates).", "B": "Wrong. The syllabus explicitly notes checklists can support non-functional testing including usability testing (citing Nielsen's usability heuristics as an example), so checklist-based testing is not described as unsuitable for this purpose - it simply needs maintenance.", "C": "Wrong. The syllabus warns the opposite: 'care should be taken to avoid letting the checklist become too long.' Arbitrarily expanding to 50 items contradicts this explicit guidance and is not the recommended fix for a stale checklist.", "D": "Wrong. The syllabus describes checklist staleness as a gradual, defect-analysis-driven maintenance issue, not a rule that checklists automatically expire after a fixed time period or must be discarded on every release regardless of actual findings. This option fabricates a rigid schedule the syllabus does not state."}, "distractor_note": "Options C and D both overcorrect in opposite directions - C says 'add much more,' D says 'throw it away and start over on a schedule' - while the syllabus's actual guidance is a moderate, evidence-based one: keep the checklist reasonably sized but periodically refresh its content based on which defects are actually being found (and missed).", "alt_wording": "Why might a checklist that catches every defect it lists nonetheless become an unreliable indicator of software quality over time, and what does the syllabus recommend as the remedy?"}, {"id": "Q206", "chapter": "5.3", "topic": "Test Metrics Categories - Coverage vs Risk Metrics", "type": "B", "difficulty": "yellow", "question": "A 5G core-network test team's dashboard shows two figures at the end of a test cycle: '94% of the approved requirements now have at least one passing test case' and 'residual risk level for the billing-reconciliation feature has dropped from High to Low.' According to the syllabus's categories of test metrics, these two figures respectively belong to which categories?", "options": {"A": "Both are coverage metrics, since both figures measure how thoroughly the system has been tested", "B": "Requirements coverage is a coverage metric; residual risk level is a risk metric", "C": "Requirements coverage is a product quality metric; residual risk level is a defect metric", "D": "Both are project progress metrics, since both are reported at the end of a test cycle"}, "correct": "B", "why_correct": "The syllabus lists coverage metrics (e.g., requirements coverage, code coverage) and risk metrics (e.g., residual risk level) as two distinct, explicitly named categories of test metrics. The '94% requirements covered' figure is a coverage metric; the 'residual risk level' figure is a risk metric.", "option_notes": {"A": "Incorrect. Lumping both under 'coverage metrics' ignores that residual risk level is the syllabus's own dedicated example of a risk metric, a separate category.", "B": "Correct - matches the syllabus's example lists for coverage metrics and risk metrics exactly.", "C": "Incorrect but plausible-sounding. Product quality metrics cover things like availability, response time, and mean time to failure, not requirements coverage. Defect metrics cover counts/priorities of defects found or fixed, defect density, and defect detection percentage, not residual risk level.", "D": "Incorrect. Project progress metrics cover task completion, resource usage, and test effort - not coverage percentages or risk levels. When a metric is reported doesn't determine which category it belongs to."}, "distractor_note": "Option C is the trickiest distractor because it correctly recognizes the two figures belong to different categories, but assigns the wrong category names - a reminder to memorize the syllabus's actual category examples rather than just knowing that categories exist.", "alt_wording": "A dashboard reports 'code coverage: 81%' and 'defect density: 2.3 per KLOC.' Name the two metric categories these figures respectively belong to."}, {"id": "Q211", "chapter": "5.5", "topic": "Defect Report Objectives and Status (Multiple Statements)", "type": "F", "difficulty": "red", "question": "A tester at a warehouse-robotics company is asked to explain the point of the defect management process to a new hire. Consider the following statements:\n\nI. A defect report's objectives, per the syllabus, include providing enough information for those responsible to resolve the issue, and providing a means of tracking the quality of the work product.\nII. Every anomaly reported during dynamic testing is, by definition, a confirmed defect in the code.\nIII. A defect report's 'status' field can include values such as open, deferred, awaiting confirmation testing, and rejected.\nIV. Defect reports are only useful during dynamic testing; anomalies found during static testing should not be handled through a similar process.\n\nWhich of the statements are TRUE?", "options": {"A": "I and III only", "B": "I, II, and III", "C": "II and IV only", "D": "I, II, III, and IV"}, "correct": "A", "why_correct": "Statement I is true: the syllabus lists providing sufficient information to resolve the issue and providing a means of tracking work product quality among the typical objectives of a defect report. Statement III is true: the syllabus's example status values include open, deferred, duplicate, waiting to be fixed, awaiting confirmation testing, re-opened, closed, and rejected. Statement II is false: the syllabus explicitly notes that a reported anomaly 'may turn out to be real defects or something else (e.g., false-positive result, change request)' - it is not automatically a confirmed defect. Statement IV is false: the syllabus explicitly recommends handling anomalies from static testing (especially static analysis) in a similar way to those from dynamic testing.", "option_notes": {"A": "Correct - I and III both match the syllabus, while II and IV are false.", "B": "Incorrect - includes false statement II; logging an anomaly does not automatically confirm it as a real defect.", "C": "Incorrect - includes false statement IV and wrongly includes false statement II while omitting the true statements I and III.", "D": "Incorrect - includes both false statements II and IV."}, "distractor_note": "Statement II is the classic trap: the term 'defect report' makes it tempting to assume every logged anomaly is confirmed as a real coding defect, but the syllabus is explicit that the true nature of a reported anomaly (real defect, false positive, or change request) is only resolved during the defect-handling process. Statement IV is tempting because static testing is covered separately in Chapter 3, but section 5.5 explicitly recommends applying a similar defect-handling process to anomalies found via static analysis too.", "alt_wording": "True or false: 'Once logged, a defect report entry is guaranteed to represent an actual coding error that must be fixed.' (tests the same misconception as statement II, presented standalone)"}, {"id": "Q174", "chapter": "1.3", "topic": "Testing Principles - Testing Is Context Dependent", "type": "C", "difficulty": "yellow", "question": "A consultancy runs testing for two clients at the same time. For Client A, a small studio building a casual mobile game, testers rely mainly on quick exploratory sessions with minimal documentation and fast, informal bug reports. For Client B, a manufacturer of implantable medical devices, testers follow extensively documented formal test procedures, multiple independent review stages, and full regulatory traceability records for every test case. Which testing principle BEST explains why the consultancy's approach differs so much between these two projects?", "options": {"A": "Early testing saves time and money - Client B simply starts its testing earlier in the lifecycle than Client A", "B": "Testing is context dependent - there is no single universally applicable approach to testing", "C": "Defects cluster together - Client B's system has more defect-prone components than Client A's", "D": "Exhaustive testing is impossible - Client B needs a smaller testing scope than Client A"}, "correct": "B", "why_correct": "The sixth testing principle states that testing is context dependent: there is no single universally applicable approach to testing, and testing is done differently in different contexts. The gap in rigor and formality between a casual mobile game and a safety-critical, regulated medical device is a textbook illustration of this principle - the difference is driven by criticality, risk, and regulation, not by timing, defect distribution, or coverage limits.", "option_notes": {"A": "Tempting because 'early testing' also concerns how testing is organized, but early testing is specifically about when static and dynamic testing begin in the SDLC, not about why the overall depth, formality, and rigor of the whole approach differs between two unrelated projects. The scenario says nothing about relative timing of test activities.", "B": "Correct - the scenario is a direct illustration of context-dependent testing, driven by differing criticality and regulatory needs.", "C": "Defect clustering describes how, within a single system, a small number of components are usually responsible for most defects or failures - it does not explain why two entirely separate projects in different industries use different overall testing approaches.", "D": "Exhaustive testing being impossible concerns the infeasibility of testing every possible input or path combination in any system - both clients face this limitation equally regardless of how rigorous their process is, so it does not explain the difference in rigor between them."}, "distractor_note": "Option A is the strongest distractor because more testing rigor can superficially sound like 'more' or 'earlier' testing, but the principle actually being demonstrated is about tailoring the whole approach to the project's context (regulatory domain, criticality, risk) rather than about shifting activities earlier in the lifecycle.", "alt_wording": "A retailer's internal admin-tools team uses lightweight, informal testing, while the same company's payment-processing team uses formal, heavily documented testing with independent sign-off. Which testing principle explains this difference in approach?"}, {"id": "Q182", "chapter": "3.1", "topic": "Value of Static Testing - Defects Dynamic Testing Can't Find", "type": "B", "difficulty": "green", "question": "A team is developing firmware for a medical infusion pump. During a peer code review, held before any test case is executed, a reviewer finds two issues: (1) a branch of code that can never be reached because of a logic condition earlier in the function, and (2) a design pattern that was implemented differently from what the architecture document specified. The team's automated test suite, which achieves the certification-mandated coverage target, never exposed either issue, because the unreachable branch is never executed during any test run and the design deviation does not cause any observable difference in the pump's output. What does this scenario demonstrate?", "options": {"A": "Static testing can find certain defects, such as unreachable code and design deviations, that dynamic testing may be unable to detect at all", "B": "Static testing is more expensive than dynamic testing and should therefore only be used on safety-critical work products such as medical device firmware", "C": "Dynamic testing becomes unnecessary once a thorough code review has been completed", "D": "The review must have been an informal one, since only informal reviews are able to identify unreachable code"}, "correct": "A", "why_correct": "Static testing evaluates a work product directly through manual examination or tooling, without executing the code. This lets it catch defects that never surface as an observable failure during execution. The syllabus explicitly states that static testing 'can also identify defects which cannot be detected by dynamic testing (e.g., unreachable code, design patterns not implemented as desired, defects in non-executable work products).' In this scenario, the unreachable branch can, by definition, never run, so no amount of dynamic testing (executing the code and analyzing failures) could ever expose it; a code review reading the logic directly is what catches it. The same applies to the silent design deviation, which produces no incorrect output for dynamic tests to observe.", "option_notes": {"A": "Correct. This is exactly the value of static testing described in the syllabus: it can find defect types, like unreachable code and design deviations, that dynamic testing is structurally unable to detect, because dynamic testing can only observe what actually executes and produces a wrong result.", "B": "The syllabus does note that reviews can be costly to implement, but it also states overall project costs are usually much lower with reviews because less time is spent fixing defects later, and it recommends involving a wide variety of stakeholders in static testing generally - not restricting it to safety-critical products only. This misreads a real syllabus point about cost into an unsupported restriction.", "C": "Static and dynamic testing are complementary, not substitutes for each other. Dynamic testing measures quality characteristics that depend on actually running the code (e.g., performance efficiency) and analyzes real failures, which static testing cannot do. Finding two defects in a review does not eliminate the need for dynamic testing.", "D": "The scenario never states the review's formality level, and formality is not what determines whether unreachable code can be found. Both informal reviews and more formal ones (walkthroughs, technical reviews, inspections) are static techniques capable of surfacing this kind of issue through manual examination of the code."}, "distractor_note": "Option B is the most tempting wrong answer because the syllabus genuinely discusses review cost, but it draws the wrong conclusion from it - the syllabus says reviews lower overall project cost and recommends broad stakeholder involvement, the opposite of 'more expensive, so restrict its use.'", "alt_wording": "This could be asked as: 'Which of the following defect types can static testing detect that dynamic testing might never detect, according to the syllabus?' or reworded as a NOT/EXCEPT question listing several defect types static testing typically finds more easily plus one distractor that is actually easier to find via dynamic testing (e.g., a performance bottleneck under load)."}, {"id": "Q181", "chapter": "2.3", "topic": "Maintenance Testing - Impact Analysis", "type": "B", "difficulty": "red", "question": "A government agency's benefits-payment system needs a change: a new means-testing rule must be added to determine eligibility. Before assigning any developers or testers to the work, the team first documents which modules, reports, and downstream systems currently read the eligibility calculation, in order to judge how much of the system could be affected and to help decide whether the change is worth making now. What is this preparatory activity called, according to the syllabus's coverage of maintenance testing?", "options": {"A": "Impact analysis", "B": "Regression testing", "C": "Confirmation testing", "D": "Root cause analysis"}, "correct": "A", "why_correct": "The syllabus's maintenance testing section states that impact analysis may be done before a change is made, to help decide if the change should be made, based on the potential consequences in other areas of the system - exactly the activity described: identifying affected modules, reports, and downstream systems before deciding whether to proceed with the change.", "option_notes": {"A": "Correct - documenting the potential consequences of a not-yet-made change, in order to help decide whether to proceed, is impact analysis.", "B": "Regression testing is the later activity of actually executing tests to check that unchanged parts of the system still behave correctly after the change has been made - it happens after the change and involves running tests, not the earlier documentation-only activity of identifying what could be affected before deciding to proceed.", "C": "Confirmation testing checks whether a specific fix resolved an original defect, by re-running previously failed tests. It is unrelated to deciding upfront whether a planned enhancement should be made at all.", "D": "Root cause analysis is performed after a failure or defect has already been identified, to find the fundamental reason it occurred. It is not about analyzing the potential consequences of a change that has not yet been made."}, "distractor_note": "Option B is the main trap because impact analysis and regression testing are closely related and often confused: impact analysis is the upfront, analytical activity that helps decide whether and how much regression testing will be needed, while regression testing is the actual test execution that happens afterward, once the change has actually been made.", "alt_wording": "Before modifying a shared pricing-calculation module in an e-commerce platform, the team lists every checkout flow, report, and integration that currently depends on that module, to gauge how far-reaching the change might be before committing to it. What is this activity called?"}, {"id": "Q196", "chapter": "4.4", "topic": "Session-Based Exploratory Testing Terminology", "type": "G", "difficulty": "yellow", "question": "A test team structures its investigative testing of a new voice-assistant app into fixed one-hour time-boxed sessions. Before each session, the tester receives a short written mission statement describing what to investigate (e.g., 'investigate how the assistant behaves with overlapping voice commands'). During the session, the tester simultaneously decides what to try, executes it, and evaluates the result, without following any pre-scripted steps. Afterward, the tester and a product stakeholder meet to discuss what was found. In official ISTQB terminology, what are the 'mission statement' and the after-session discussion respectively called?", "options": {"A": "Test charter, and debriefing", "B": "Test condition, and test completion report", "C": "Checklist, and retrospective", "D": "Test procedure, and exit criteria review"}, "correct": "A", "why_correct": "The syllabus describes session-based exploratory testing exactly this way: 'The tester uses a test charter containing test objectives to guide the testing... The test session is usually followed by a debriefing that involves a discussion between the tester and stakeholders interested in the test results of the test session.'", "option_notes": {"A": "Correct - matches the syllabus's own terminology for session-based exploratory testing precisely.", "B": "Wrong. A test condition is a general term for any testable aspect of a component or system (identified using any test technique, not specific to exploratory testing), and a test completion report is a formal end-of-testing summary document, not an informal post-session discussion.", "C": "Wrong. A checklist is the artifact used specifically in checklist-based testing, a different experience-based technique from exploratory testing. A retrospective is a broader, separate practice (discussed under Chapter 2's SDLC content) held to improve the team's overall process at the end of an iteration or project, not a single exploratory session's debriefing.", "D": "Wrong. A test procedure specifies the sequence in which test cases should be executed, typically for scripted testing - essentially the opposite of exploratory testing's unscripted, discovery-driven nature. An exit criteria review is unrelated to a session debriefing."}, "distractor_note": null, "alt_wording": "What term does the syllabus use for the guiding document that lists test objectives at the start of an exploratory testing session, and what happens right after the session ends?"}, {"id": "Q186", "chapter": "4.1", "topic": "Specification-Based vs Structure-Based Terminology", "type": "G", "difficulty": "green", "question": "A test lead is briefing a new hire and avoids the official ISTQB terms, instead saying: 'One category of technique looks only at what the system is specified to do, without ever looking at the code - if the implementation changes but the required behavior stays the same, the same tests are still useful. Another category looks at the code's internal structure and paths, and can only be used once the code exists.' Which official ISTQB terms correspond to these two descriptions, in order?", "options": {"A": "Black-box test techniques (also called specification-based techniques), and white-box test techniques (also called structure-based techniques)", "B": "White-box test techniques (also called specification-based techniques), and black-box test techniques (also called structure-based techniques)", "C": "Experience-based test techniques, and black-box test techniques", "D": "Black-box test techniques, and experience-based test techniques (also called structure-based techniques)"}, "correct": "A", "why_correct": "The syllabus states black-box test techniques are 'also known as specification-based techniques,' based on analyzing specified behavior without reference to internal structure - which is exactly why black-box test cases remain valid if the implementation changes but required behavior does not. White-box test techniques are 'also known as structure-based techniques,' based on analyzing the test object's internal structure and processing, and can only be created after the design or implementation exists. The test lead's two descriptions map directly onto black-box (first) and white-box (second).", "option_notes": {"A": "Correct. Matches the syllabus's alternate names exactly: black-box = specification-based, white-box = structure-based.", "B": "Wrong - reverses the pairing. White-box techniques depend on internal structure/code, so they are structure-based, not specification-based; black-box techniques analyze specified behavior, so they are specification-based, not structure-based.", "C": "Wrong. Experience-based test techniques are not called 'specification-based' - they rely on tester knowledge and experience rather than a formal specification or the code structure. The first description (behavior-only, implementation-independent) matches black-box, not experience-based.", "D": "Wrong on both counts. The first description matches black-box (whose correct alternate name is specification-based), and the second description - internal structure and code-dependent - matches white-box, not experience-based; experience-based techniques are not described as 'structure-based' anywhere in the syllabus."}, "distractor_note": null, "alt_wording": "Which pair of official synonyms correctly replaces 'black-box' and 'white-box' in the sentence: 'Black-box test techniques are also known as ___ techniques, while white-box test techniques are also known as ___ techniques'?"}, {"id": "Q179", "chapter": "2.1", "topic": "DevOps Risks and Challenges", "type": "E", "difficulty": "red", "question": "According to the syllabus, all of the following are risks or challenges associated with adopting DevOps EXCEPT:", "options": {"A": "The DevOps delivery pipeline must be defined and established", "B": "CI/CD tools must be introduced and maintained", "C": "Test automation requires additional resources and may be difficult to establish and maintain", "D": "Manual testing, especially from the user's perspective, becomes entirely unnecessary once the DevOps pipeline is automated"}, "correct": "D", "why_correct": "The syllabus lists three risks/challenges of DevOps: the delivery pipeline must be defined and established, CI/CD tools must be introduced and maintained, and test automation requires additional resources and may be difficult to establish and maintain. It then explicitly states the opposite of option D: 'Although DevOps comes with a high level of automated testing, manual testing - especially from the user's perspective - will still be needed.' Option D is therefore not a genuine risk named by the syllabus, and it directly contradicts what the syllabus actually says.", "option_notes": {"A": "A genuine risk/challenge listed by the syllabus: establishing the pipeline itself is real work that must be done.", "B": "A genuine risk/challenge listed by the syllabus: CI/CD tooling must be introduced and then kept maintained over time.", "C": "A genuine risk/challenge listed by the syllabus: automation needs additional resources and can be hard to establish and maintain.", "D": "Correct answer to the EXCEPT question - the syllabus explicitly says manual testing, especially from the user's perspective, will still be needed even with a high level of automation, directly contradicting this option's claim."}, "distractor_note": "Option D is written to sound like a natural extension of DevOps's automation benefits (fast feedback, automated regression, reduced need for repetitive manual testing), but it overstates those benefits into a claim the syllabus explicitly rejects - a classic 'too good to be true' distractor.", "alt_wording": "A manager claims that once a DevOps pipeline with full CI/CD and automated regression testing is in place, there is no longer any need for a human tester to manually explore the product from a user's point of view. Which statement from the syllabus does this contradict?"}, {"id": "Q187", "chapter": "4.2", "topic": "Equivalence Partitioning - Coverage Calculation", "type": "H", "difficulty": "yellow", "question": "A streaming app selects video quality based on measured bandwidth in Mbps using these partitions: Low (greater than 0 and less than 5 Mbps), Medium (5 up to but not including 15 Mbps), High (15 up to but not including 50 Mbps), Ultra (50 Mbps or more), and Invalid (0 Mbps or a negative reading, e.g. a sensor error). A test suite runs with bandwidth values of 2, 10, 30, and 100 Mbps. What equivalence partition coverage does this test suite achieve, and how many additional test cases are needed to reach 100% coverage?", "options": {"A": "80% coverage (4 of 5 partitions exercised); 1 more test case is needed, using any Invalid-partition value such as 0 or -1", "B": "100% coverage; no more test cases are needed", "C": "75% coverage (3 of 4 partitions exercised); 1 more test case is needed", "D": "80% coverage; 2 more test cases are needed, one for a negative reading and a separate one for exactly 0"}, "correct": "A", "why_correct": "There are 5 identified partitions in total: the 4 valid partitions (Low, Medium, High, Ultra) and 1 invalid partition (readings <= 0). The test suite's values of 2 (Low), 10 (Medium), 30 (High), and 100 (Ultra) exercise all 4 valid partitions but never exercise the Invalid partition. Coverage = partitions exercised / total partitions identified = 4/5 = 80%. Per the syllabus, 100% equivalence partitioning coverage requires exercising all identified partitions, including invalid ones - so a single additional test case with any value from the Invalid partition (0, -1, -50, etc.) is enough to reach 100%, since any value in that partition counts as exercising it.", "option_notes": {"A": "Correct. 4 of 5 total partitions are exercised (80%); the missing partition is the single Invalid partition, so exactly one more test case (any value <= 0) completes coverage.", "B": "Wrong. This forgets that the Invalid partition (bandwidth <= 0) is also a partition that must be exercised for 100% coverage - the syllabus is explicit that invalid partitions count toward coverage just like valid ones. Only 4 of the 5 total partitions were tested.", "C": "Wrong. This undercounts the total number of partitions as 4 (treating only valid partitions as 'real' partitions and ignoring the Invalid partition entirely), which produces both an incorrect total (4 instead of 5) and an incorrect current coverage figure (3/4 instead of the correct 4/5).", "D": "Wrong. Because the values 0 and negative numbers both fall in the SAME invalid partition (bandwidth <= 0), a single test case using either value is sufficient to exercise that one partition - there is no need for two separate test cases. This treats one partition as if it were two."}, "distractor_note": "Option D is a realistic trap: test-takers sometimes assume every distinct 'kind' of invalid input (zero vs. negative) needs its own test, but equivalence partitioning theory says any single value from a partition is representative of the whole partition - one test per partition is sufficient by definition.", "alt_wording": "Given the same four quality tiers and reject-reading rule, if a tester wants to reach 100% equivalence partition coverage with the fewest possible test cases, how many test cases are needed in total, and what must the extra one(s) target?"}, {"id": "Q195", "chapter": "4.4", "topic": "Error Guessing (Fault Attacks) vs Checklist-Based vs Exploratory Testing", "type": "C", "difficulty": "green", "question": "Before testing a new document-upload feature, a tester recalls that on three previous projects, upload features consistently failed whenever users selected filenames containing special characters (e.g., '#', '&', emoji) or filenames longer than 255 characters. Based on this recollection, the tester writes a short list of these specific known problem patterns and deliberately designs test cases targeting them before testing begins. Which test technique is the tester applying, and what is this specific way of applying it called?", "options": {"A": "Error guessing, specifically a fault attack - a list of possible errors, defects, and failures is created in advance from experience, then used to design targeted tests", "B": "Exploratory testing, specifically session-based testing, where tests are designed, executed, and evaluated simultaneously while learning about the test object", "C": "Checklist-based testing, since the tester is working from a predefined list of items", "D": "Decision table testing, since multiple filename conditions are being combined to determine expected behavior"}, "correct": "A", "why_correct": "The syllabus describes error guessing as anticipating errors, defects, and failures based on the tester's knowledge, including 'how the application has worked in the past' and 'the types of failures that have occurred in other, similar applications.' It specifically names fault attacks as a way to implement error guessing: 'this test technique requires the tester to create or acquire a list of possible errors, defects and failures, and to design tests that will identify defects associated with the errors.' The tester's list of specific past-failure patterns (special characters, overlong filenames), built from direct experience on prior projects, matches this definition precisely.", "option_notes": {"A": "Correct - the tester is drawing on direct past-project experience to build a targeted list of anticipated failure patterns, which is the textbook definition of a fault attack within error guessing.", "B": "Wrong. Exploratory testing designs, executes, and evaluates tests SIMULTANEOUSLY while learning about the test object in real time. Here, the tester's list was compiled BEFORE testing began, based on prior knowledge - the defining trait of error guessing, not the concurrent discover-as-you-go nature of exploratory testing.", "C": "Wrong, though tempting since both techniques involve a 'list.' The syllabus describes checklist-based testing as using broad, often question-phrased, repeatable test conditions (e.g., about requirements, interface properties, or quality characteristics) intended for consistent reuse across testing efforts. The tester's list here is instead a targeted set of specific known defect patterns drawn from past failure experience - the defining trait of error guessing/fault attacks, not a general-purpose checklist.", "D": "Wrong. Decision table testing derives test cases from combinations of Boolean or multi-valued conditions producing defined outcomes (e.g., business rules). There is no combination-of-conditions logic being modeled here - just a list of specific input patterns known to have caused failures before."}, "distractor_note": "Option C is the trickiest distractor because checklist-based testing and error guessing/fault attacks both involve working from a pre-built list, and the syllabus discusses them in adjacent sections. The distinguishing factor is the SOURCE and PURPOSE of the list: checklists tend to be broad, reusable, question-style conditions for consistency across many test efforts, while a fault attack's list is a targeted set of specific anticipated defects drawn from the tester's own experience of what actually failed before.", "alt_wording": "A tester who has worked on several previous e-commerce sites recalls that discount codes have often failed to combine correctly with free-shipping promotions, and specifically designs a test case to try that exact combination. What is this approach called, and how would it differ from checklist-based testing applied to the same feature?"}, {"id": "Q205", "chapter": "5.2", "topic": "Risk Level - Equal Levels from Different Factor Combinations", "type": "H", "difficulty": "green", "question": "For a renewable-energy grid-monitoring dashboard, product risk analysis quantitatively assesses two risks:\n- Risk A: 'Incorrect solar-output readings displayed to operators' - likelihood 0.6, impact rated 4.\n- Risk B: 'Dashboard fails to alert on a grid-frequency deviation' - likelihood 0.3, impact rated 8.\n\nUsing the quantitative approach (risk level = risk likelihood x risk impact), what can be concluded?", "options": {"A": "Risk A has a higher risk level than Risk B, so it should be prioritized above Risk B", "B": "Risk B has a higher risk level than Risk A, so it should be prioritized above Risk A", "C": "Risk A and Risk B have the same risk level (2.4), so despite their very different likelihood/impact profiles, neither is automatically prioritized over the other on risk level alone", "D": "Risk level cannot be calculated here because likelihood and impact must be expressed on the same 0-to-1 scale"}, "correct": "C", "why_correct": "Risk A: 0.6 x 4 = 2.4. Risk B: 0.3 x 8 = 2.4. Both risks produce the identical risk level despite having very different individual likelihood and impact values. In the quantitative approach, risk level is the product of the two factors combined, not either factor considered alone - so a low-likelihood/high-impact risk can carry exactly the same risk level as a high-likelihood/low-impact risk.", "option_notes": {"A": "Incorrect. 0.6 x 4 = 2.4, which is not higher than Risk B's 2.4 - the two are equal.", "B": "Incorrect. 0.3 x 8 = 2.4, which is not higher than Risk A's 2.4 - the two are equal.", "C": "Correct - both calculations yield 2.4, illustrating that risk level combines likelihood and impact multiplicatively rather than being driven by one factor alone.", "D": "Incorrect. The syllabus defines risk likelihood as a probability strictly between 0 and 1, but risk impact is a separate severity-style rating (here, a scale where 4 and 8 are used) - the quantitative approach simply multiplies the two values as given; they are not required to share the same numeric scale."}, "distractor_note": "This question is designed to catch a reader who assumes 'higher impact automatically means higher risk level' (tempting toward B) or 'higher likelihood automatically means higher risk level' (tempting toward A). The syllabus's actual point is that risk level is the combined product of both attributes, so very different-looking risks can end up equally important.", "alt_wording": "Risk C has likelihood 0.8 and impact 3; Risk D has likelihood 0.4 and impact 6. Using the quantitative approach, compare their risk levels and explain what this means for prioritization."}]};
</script>
<script>
// ISTQB CTFL Mock Exam engine — self-contained, inlined by tools/render_exam.py.
// No questions are rendered into the visible DOM until the candidate clicks "Start Exam".
(function () {
  "use strict";

  var EXAM = window.__EXAM__;
  var STORAGE_KEY = "istqb-exam-state:" + EXAM.examId;
  var THEME_KEY = "istqb-exam-theme";
  var root = document.getElementById("app");
  var timerInterval = null;
  // Set once startOrResume() runs during THIS page load. Reloading the file always lands
  // back on the start/resume gate first — it never silently drops the candidate back into
  // a question — even if an earlier browser session had already clicked Start.
  var resumedThisSession = false;

  // ---------------------------------------------------------------- state
  function freshState() {
    return {
      phase: "not_started", // not_started | in_progress | cleanup_offer | cleanup | submitted
      answers: {},          // { questionId: "A" }
      flags: {},             // { questionId: true }
      notes: {},             // { questionId: "rough work typed while solving" }
      markers: {},           // { questionId: [{ id, term, note, source, selectedText, ... }] }
      currentIndex: 0,
      deadline: null,        // ms epoch timestamp — remaining time is derived from this, not decremented,
      startedAt: null,       // so the clock keeps real wall-clock time even if the tab is closed and reopened
      cleanupQuestionIds: [], // fixed list of flagged/unanswered questions offered after the main timer expires
      cleanupDeadline: null,
      cleanupStartedAt: null,
      cleanupOfferedAt: null,
      cleanupTimeUsedSeconds: null,
      cleanupUsed: false,
      submittedAt: null,
      timeUsedSeconds: null,
      exported: false     // whether "Export Results" has been clicked this attempt — used to warn before a retake discards an unexported score
    };
  }

  // Remaining seconds, computed from the stored deadline so it reflects real elapsed time
  // even across a closed tab / reloaded file, matching how a real proctored exam timer behaves.
  function computeRemaining() {
    if (state.phase === "cleanup") {
      if (!state.cleanupDeadline) return cleanupDurationSeconds();
      return Math.round((state.cleanupDeadline - Date.now()) / 1000);
    }
    if (!state.deadline) return EXAM.durationMinutes * 60;
    return Math.round((state.deadline - Date.now()) / 1000);
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      var parsed = JSON.parse(raw);
      return Object.assign(freshState(), parsed);
    } catch (e) {
      return freshState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage full / disabled — degrade silently */ }
  }

  var state = loadState();

  // ---------------------------------------------------------------- rough-notes panel position
  // A display preference, not exam progress — stored separately so it persists across
  // different exam sittings (unlike `state`, which is keyed per exam id).
  var NOTES_UI_KEY = "istqb-exam-notes-ui";

  function freshNotesUI() {
    return { position: "bottom", x: null, y: null, w: null, h: null }; // position: bottom | right | float
  }
  function loadNotesUI() {
    try {
      var raw = localStorage.getItem(NOTES_UI_KEY);
      if (!raw) return freshNotesUI();
      return Object.assign(freshNotesUI(), JSON.parse(raw));
    } catch (e) { return freshNotesUI(); }
  }
  function saveNotesUI() {
    try { localStorage.setItem(NOTES_UI_KEY, JSON.stringify(notesUI)); } catch (e) { /* ignore */ }
  }
  var notesUI = loadNotesUI();

  function setNotesPosition(pos) {
    if (notesUI.position === pos) return;
    notesUI.position = pos;
    saveNotesUI();
    render();
  }

  function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

  // Only relevant in float mode. Applies the last dragged coordinates, if any —
  // otherwise the CSS default (bottom-right corner) is left in place.
  function applyFloatPosition(panel) {
    if (notesUI.x === null || notesUI.y === null) return;
    var maxLeft = Math.max(4, window.innerWidth - 40);
    var maxTop = Math.max(4, window.innerHeight - 40);
    panel.style.left = clamp(notesUI.x, 4, maxLeft) + "px";
    panel.style.top = clamp(notesUI.y, 4, maxTop) + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
  }

  function makeDraggable(panel, handle) {
    var dragging = false;
    var startX = 0, startY = 0, startLeft = 0, startTop = 0;
    handle.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".postoggle-btn")) return; // let the dock/float buttons handle their own clicks
      dragging = true;
      handle.setPointerCapture(e.pointerId);
      var rect = panel.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left; startTop = rect.top;
      panel.classList.add("dragging");
    });
    handle.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var newLeft = clamp(startLeft + (e.clientX - startX), 4, window.innerWidth - panel.offsetWidth - 4);
      var newTop = clamp(startTop + (e.clientY - startY), 4, window.innerHeight - panel.offsetHeight - 4);
      panel.style.left = newLeft + "px";
      panel.style.top = newTop + "px";
      panel.style.right = "auto";
      panel.style.bottom = "auto";
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      panel.classList.remove("dragging");
      notesUI.x = parseInt(panel.style.left, 10);
      notesUI.y = parseInt(panel.style.top, 10);
      saveNotesUI();
    }
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  }

  // Applies the last manually-resized width/height, if any — otherwise the panel keeps
  // its CSS default size. The same saved size is reused across bottom/right/float, since
  // it's a general "how big do I like my notes box" preference, not a per-mode setting.
  function applyStoredSize(panel) {
    if (notesUI.w) panel.style.width = notesUI.w + "px";
    if (notesUI.h) panel.style.height = notesUI.h + "px";
  }

  // The panel is fully rebuilt on every question change, so a plain CSS `resize` drag
  // would otherwise be forgotten the moment the candidate clicks Next. There's no
  // resize-start/resize-end event for the native corner grip, so we arm a flag when a
  // mousedown lands in that ~18px corner hit-region, then compare the panel's size on
  // the next mouseup (wherever it ends) and persist it if it actually changed.
  var currentScratchPanel = null;
  var scratchResizeArmed = false;
  function scratchPanelMouseDown(e) {
    var rect = e.currentTarget.getBoundingClientRect();
    var nearRight = rect.right - e.clientX <= 18;
    var nearBottom = rect.bottom - e.clientY <= 18;
    scratchResizeArmed = nearRight && nearBottom;
  }
  document.addEventListener("mouseup", function () {
    if (!scratchResizeArmed) return;
    scratchResizeArmed = false;
    if (!currentScratchPanel || !currentScratchPanel.isConnected) return;
    var rect = currentScratchPanel.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    if (w !== notesUI.w || h !== notesUI.h) {
      notesUI.w = w;
      notesUI.h = h;
      saveNotesUI();
    }
  });

  // ---------------------------------------------------------------- theme
  function applyTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  }
  function toggleTheme() {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
  }
  applyTheme();

  // ---------------------------------------------------------------- utils
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return; // omit — do not stringify to "null"
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function formatTime(totalSeconds) {
    var s = Math.max(0, totalSeconds);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function timeLimitLabel() {
    var base = EXAM.durationMinutes + ":00";
    if (!state.cleanupQuestionIds || !state.cleanupQuestionIds.length) return base;
    return base + " + " + formatTime(cleanupDurationSeconds()) + " extra";
  }

  function chapterNum(chapterCode) {
    return chapterCode.split(".")[0];
  }

  var CHAPTER_NAMES = {
    "1": "Fundamentals of Testing",
    "2": "Testing Throughout the SDLC",
    "3": "Static Testing",
    "4": "Test Analysis and Design",
    "5": "Managing the Test Activities",
    "6": "Test Tools"
  };

  function answeredCount() { return Object.keys(state.answers).length; }
  function flaggedCount() { return Object.keys(state.flags).filter(function (k) { return state.flags[k]; }).length; }
  function markersFor(questionId) {
    return state.markers && Array.isArray(state.markers[questionId]) ? state.markers[questionId] : [];
  }
  function markerCount() {
    if (!state.markers) return 0;
    return Object.keys(state.markers).reduce(function (n, questionId) {
      return n + markersFor(questionId).length;
    }, 0);
  }
  function noteFor(questionId) {
    return state.notes && state.notes[questionId] ? state.notes[questionId] : "";
  }
  function questionById(questionId) {
    return EXAM.questions.find(function (q) { return q.id === questionId; }) || null;
  }
  function originalQuestionNumber(questionId) {
    var idx = EXAM.questions.findIndex(function (q) { return q.id === questionId; });
    return idx >= 0 ? idx + 1 : "?";
  }
  function remainingQuestionIds() {
    return EXAM.questions
      .filter(function (q) { return !state.answers[q.id] || !!state.flags[q.id]; })
      .map(function (q) { return q.id; });
  }
  function cleanupDurationSeconds() {
    return (state.cleanupQuestionIds || []).length * 60;
  }
  function activeQuestions() {
    if (state.phase !== "cleanup") return EXAM.questions;
    return (state.cleanupQuestionIds || []).map(questionById).filter(Boolean);
  }
  function activeQuestionCount() {
    return activeQuestions().length;
  }

  // ---------------------------------------------------------------- render dispatch
  function render() {
    root.innerHTML = "";
    if (state.phase === "submitted") { renderResults(); return; }
    if (state.phase === "cleanup_offer") { renderCleanupOffer(); return; }
    if ((state.phase === "in_progress" || state.phase === "cleanup") && resumedThisSession) { renderExam(); return; }
    renderStart(); // covers not_started, and in_progress before the candidate has clicked Resume
  }

  // ---------------------------------------------------------------- start screen
  function renderStart() {
    stopTimer();
    var inProgress = state.phase === "in_progress" || state.phase === "cleanup";
    var inCleanup = state.phase === "cleanup";

    var shell = el("div", { class: "center-shell" });
    var card = el("div", { class: "card" });

    if (inProgress) {
      var total = inCleanup ? activeQuestionCount() : EXAM.questions.length;
      var answered = inCleanup
        ? activeQuestions().filter(function (q) { return !!state.answers[q.id]; }).length
        : answeredCount();
      card.appendChild(el("div", { class: "resume-banner" }, [
        (inCleanup ? "A remaining-question round is already in progress (" : "An exam is already in progress (") +
        answered + "/" + total + " answered, " + formatTime(computeRemaining()) +
        " remaining). Starting over will discard that progress."
      ]));
    }

    card.appendChild(el("h1", { class: "start-title" }, [EXAM.title]));
    card.appendChild(el("p", { class: "start-sub" }, [
      "Generated " + EXAM.generated + " · Question bank v" + (EXAM.bankVersion || 1)
    ]));

    var meta = el("div", { class: "meta-grid" }, [
      metaTile(String(EXAM.questions.length), "Questions"),
      metaTile(EXAM.durationMinutes + " min", "Time Limit"),
      metaTile(EXAM.passMarkPct + "%", "Pass Mark"),
      metaTile(Math.round(EXAM.questions.length * EXAM.passMarkPct / 100) + "/" + EXAM.questions.length, "To Pass")
    ]);
    card.appendChild(meta);

    var rules = el("ul", { class: "rules-list" }, [
      el("li", {}, ["Every question has a single best answer. No answers or explanations are shown until you submit."]),
      el("li", {}, ["A countdown timer starts the moment you click Start and cannot be paused. When it reaches 00:00, the exam either submits or offers a remaining-question round."]),
      el("li", {}, ["If the main timer ends while questions are still unanswered or flagged, you can start a remaining-question round with 1 minute for each of those questions."]),
      el("li", {}, ["Use the question navigator to jump to any question in any order, and flag questions to revisit."]),
      el("li", {}, ["Use Learning Marker when a term, topic, option, or phrase feels unclear. Markers are exported with your results so they can be turned into a permanent A-Z review page after the exam."]),
      el("li", {}, ["Each question has a rough-notes area for scratch work; it auto-saves with your local exam progress. Use the small buttons above it to dock the notes to the bottom, dock them to the right, or float them anywhere on screen — and drag its bottom-right corner to resize it to whatever size you like."]),
      el("li", {}, ["Your progress is saved in this browser automatically — closing the tab and reopening this file will resume where you left off."]),
      el("li", {}, ["After submitting, you can review the full solutions with explanations and export your results as a file."])
    ]);
    card.appendChild(rules);

    card.appendChild(el("button", {
      class: "big-btn", onclick: function () { startOrResume(inProgress); }
    }, [inProgress ? (inCleanup ? "Resume Remaining Round" : "Resume Exam") : "Start Exam"]));

    if (inProgress) {
      card.appendChild(el("button", {
        class: "big-btn secondary", style: "margin-top:10px;", onclick: function () {
          if (confirm("Discard your in-progress exam and start a fresh attempt?")) {
            state = freshState();
            saveState();
            render();
          }
        }
      }, ["Start Over Instead"]));
    }

    shell.appendChild(card);
    root.appendChild(topbar(false));
    root.appendChild(shell);
  }

  function metaTile(num, label) {
    return el("div", { class: "meta-tile" }, [
      el("span", { class: "num" }, [num]),
      el("span", { class: "label" }, [label])
    ]);
  }

  function startOrResume(wasInProgress) {
    if (!wasInProgress) {
      state = freshState();
      state.phase = "in_progress";
      state.startedAt = Date.now();
      state.deadline = state.startedAt + EXAM.durationMinutes * 60000;
    }
    resumedThisSession = true;
    saveState();
    render();
  }

  // Replays this exact sitting (same 40 questions, same order) with a clean timer and
  // blank answers/flags/notes. Warns first, since an unexported attempt's score/answers
  // have no other record once cleared.
  function retakeExam() {
    var msg = state.exported
      ? "Retake this exam with the same 40 questions? Your answers, flags, and rough notes will be cleared and the timer will restart."
      : "You haven't exported this attempt's results yet, so retaking now will permanently lose your answers and score for it. Retake anyway?";
    if (!confirm(msg)) return;
    startOrResume(false);
  }

  // ---------------------------------------------------------------- top bar
  function topbar(showTimer) {
    var bar = el("div", { class: "exam-topbar" }, [
      el("span", { class: "exam-title" }, [EXAM.title])
    ]);
    bar.appendChild(el("span", { class: "spacer" }));
    if (showTimer) {
      bar.appendChild(el("span", { class: "q-counter", id: "qCounter" }, [
        (state.phase === "cleanup" ? "Remaining " : "Question ") + (state.currentIndex + 1) + " of " + activeQuestionCount()
      ]));
      bar.appendChild(el("span", { class: "timer", id: "timerEl" }, [formatTime(computeRemaining())]));
    }
    bar.appendChild(el("button", { class: "icon-btn", title: "Toggle theme", onclick: toggleTheme }, ["\u{1F319}"]));
    return bar;
  }

  // ---------------------------------------------------------------- rough-notes panel
  function renderScratchPanel(q) {
    function posBtn(pos, icon, title) {
      return el("button", {
        type: "button",
        class: "postoggle-btn" + (notesUI.position === pos ? " active" : ""),
        title: title,
        onclick: function () { setNotesPosition(pos); }
      }, [icon]);
    }

    var header = el("div", { class: "scratch-header" }, [
      el("span", { class: "scratch-label" }, ["Rough notes"]),
      el("div", { class: "scratch-postoggle" }, [
        posBtn("bottom", "⬇", "Dock to bottom"),
        posBtn("right", "▶", "Dock to right"),
        posBtn("float", "✦", "Float — drag anywhere")
      ])
    ]);

    var panel = el("section", {
      class: "scratch-panel pos-" + notesUI.position,
      onmousedown: scratchPanelMouseDown
    }, [
      header,
      el("textarea", {
        id: "scratch_" + q.id,
        class: "scratch-input",
        rows: "7",
        spellcheck: "false",
        placeholder: "Use this space for rough work, calculations, eliminations, or reminders. Auto-saved in this browser.",
        oninput: function (e) {
          if (!state.notes) state.notes = {};
          var value = e.target.value;
          if (value.trim()) state.notes[q.id] = value;
          else delete state.notes[q.id];
          saveState();
        }
      }, [noteFor(q.id)])
    ]);

    applyStoredSize(panel);
    currentScratchPanel = panel;

    if (notesUI.position === "float") {
      applyFloatPosition(panel);
      makeDraggable(panel, header);
    }
    return panel;
  }

  // ---------------------------------------------------------------- exam screen
  function renderExam() {
    var questions = activeQuestions();
    if (!questions.length) { submitExam(false); return; }
    if (state.currentIndex >= questions.length) state.currentIndex = questions.length - 1;
    if (state.currentIndex < 0) state.currentIndex = 0;
    var q = questions[state.currentIndex];
    var originalNum = originalQuestionNumber(q.id);
    var inCleanup = state.phase === "cleanup";

    var layout = el("div", { class: "exam-layout" });
    layout.appendChild(renderNavigator());

    var main = el("div", { class: "exam-main" });
    var pct = ((state.currentIndex + 1) / questions.length) * 100;
    main.appendChild(el("div", { class: "q-progress-bar" }, [
      el("div", { class: "q-progress-fill", style: "width:" + pct + "%" })
    ]));

    var headerRow = el("div", { class: "q-header-row" }, [
      el("span", { class: "q-num-badge" }, [inCleanup ? "Q" + originalNum + " · Remaining" : "Q" + (state.currentIndex + 1)])
    ]);
    var isFlagged = !!state.flags[q.id];
    var hasMarkers = markersFor(q.id).length > 0;
    headerRow.appendChild(el("button", {
      class: "learn-btn" + (hasMarkers ? " active" : ""),
      title: "Mark an unclear term or topic for post-exam learning",
      onclick: function () { openMarkerModal(q); }
    }, [hasMarkers ? "Learning gap marked" : "Mark learning gap"]));
    headerRow.appendChild(el("button", {
      class: "flag-btn" + (isFlagged ? " active" : ""),
      onclick: function () {
        if (state.flags[q.id]) delete state.flags[q.id];
        else state.flags[q.id] = true;
        saveState();
        render();
      }
    }, [(isFlagged ? "\u{1F6A9} Flagged" : "\u{1F6A9} Flag for review")]));
    main.appendChild(headerRow);

    var questionArea = el("div", { class: "question-area", id: "questionArea" });
    questionArea.appendChild(el("p", { class: "q-text" }, [q.question]));

    var optionsWrap = el("div", { class: "options" });
    ["A", "B", "C", "D"].forEach(function (letter) {
      if (!q.options[letter]) return;
      var selected = state.answers[q.id] === letter;
      var row = el("label", { class: "option-row" + (selected ? " selected" : "") }, [
        el("input", {
          type: "radio", name: "q_" + q.id, checked: selected ? "checked" : null,
          onchange: function () {
            state.answers[q.id] = letter;
            saveState();
            render();
          }
        }),
        el("span", { class: "option-letter" }, [letter + "."]),
        el("span", { class: "option-text" }, [q.options[letter]])
      ]);
      optionsWrap.appendChild(row);
    });
    questionArea.appendChild(optionsWrap);
    main.appendChild(questionArea);
    main.appendChild(renderMarkerPanel(q));

    var notesDocked = notesUI.position === "bottom";
    if (notesDocked) main.appendChild(renderScratchPanel(q));
    layout.className = "exam-layout" + (notesUI.position === "right" ? " notes-right-open" : "");
    layout.appendChild(main);

    var footer = el("div", { class: "exam-footer" + (notesUI.position === "right" ? " notes-right-open" : "") }, [
      el("button", {
        class: "nav-action-btn", disabled: state.currentIndex === 0 ? "disabled" : null,
        onclick: function () { state.currentIndex = Math.max(0, state.currentIndex - 1); saveState(); render(); }
      }, ["← Previous"]),
      el("button", {
        class: "nav-action-btn", disabled: state.currentIndex === questions.length - 1 ? "disabled" : null,
        onclick: function () { state.currentIndex = Math.min(questions.length - 1, state.currentIndex + 1); saveState(); render(); }
      }, ["Next →"]),
      el("button", { class: "submit-btn", onclick: openSubmitModal }, ["Submit Exam"])
    ]);

    root.appendChild(topbar(true));
    root.appendChild(layout);
    root.appendChild(footer);
    if (!notesDocked) {
      var notesPanel = renderScratchPanel(q);
      root.appendChild(notesPanel);
      // The right-docked panel is user-resizable, so its width can no longer be assumed
      // to match the CSS default (340px) reserved on .exam-main — keep the reserved space
      // in sync with its live width so a wide panel never covers the question content.
      if (notesUI.position === "right" && window.ResizeObserver) {
        var syncRightPadding = function () {
          main.style.paddingRight = Math.round(notesPanel.getBoundingClientRect().width + 20) + "px";
        };
        syncRightPadding();
        new ResizeObserver(syncRightPadding).observe(notesPanel);
      }
    }
    startTimer();
    updateTimerDisplay();
  }

  function renderNavigator() {
    var questions = activeQuestions();
    var inCleanup = state.phase === "cleanup";
    var nav = el("div", { class: "navigator" });
    nav.appendChild(el("h4", {}, [inCleanup ? "Remaining" : "Questions"]));
    var grid = el("div", { class: "nav-grid" });
    questions.forEach(function (q, i) {
      var classes = ["nav-btn"];
      if (state.answers[q.id]) classes.push("answered");
      if (state.flags[q.id]) classes.push("flagged");
      if (markersFor(q.id).length) classes.push("marked");
      if (i === state.currentIndex) classes.push("current");
      grid.appendChild(el("button", {
        class: classes.join(" "),
        onclick: function () { state.currentIndex = i; saveState(); render(); }
      }, [String(inCleanup ? originalQuestionNumber(q.id) : i + 1)]));
    });
    nav.appendChild(grid);
    nav.appendChild(el("div", { class: "nav-legend" }, [
      el("div", {}, [el("span", { class: "dot answered" }), "Answered"]),
      el("div", {}, [el("span", { class: "dot flagged" }), "Flagged"]),
      el("div", {}, [el("span", { class: "dot marked" }), "Learning marker"]),
      el("div", {}, [el("span", { class: "dot unanswered" }), "Unanswered"])
    ]));
    return nav;
  }

  // ---------------------------------------------------------------- learning markers
  function selectedExamText() {
    var area = document.getElementById("questionArea");
    var sel = window.getSelection && window.getSelection();
    if (!area || !sel || sel.isCollapsed || sel.rangeCount === 0) return "";
    var range = sel.getRangeAt(0);
    var common = range.commonAncestorContainer.nodeType === 1
      ? range.commonAncestorContainer
      : range.commonAncestorContainer.parentElement;
    if (!common || !area.contains(common)) return "";
    return sel.toString().replace(/\s+/g, " ").trim().slice(0, 120);
  }

  function normalizeMarkerTerm(term) {
    return String(term || "").replace(/\s+/g, " ").trim();
  }

  function renderMarkerPanel(q) {
    var items = markersFor(q.id);
    var panel = el("section", { class: "marker-panel" + (items.length ? " has-items" : "") });
    var head = el("div", { class: "marker-head" }, [
      el("div", {}, [
        el("span", { class: "marker-title" }, ["Learning markers"]),
        el("span", { class: "marker-sub" }, [items.length ? items.length + " saved for this question" : "Save unclear terms for later explanation"])
      ]),
      el("button", {
        type: "button",
        class: "marker-add-btn",
        onclick: function () { openMarkerModal(q); }
      }, ["+ Add"])
    ]);
    panel.appendChild(head);
    if (items.length) {
      var list = el("div", { class: "marker-list" });
      items.forEach(function (m) {
        list.appendChild(el("div", { class: "marker-chip" }, [
          el("div", { class: "marker-chip-text" }, [
            el("strong", {}, [m.term || "Unnamed marker"]),
            el("span", {}, [m.note ? m.note : ((m.source || "Topic") + " marker")])
          ]),
          el("button", {
            type: "button",
            class: "marker-mini-btn",
            title: "Edit marker",
            onclick: function () { openMarkerModal(q, m); }
          }, ["Edit"]),
          el("button", {
            type: "button",
            class: "marker-mini-btn danger",
            title: "Delete marker",
            onclick: function () { deleteMarker(q.id, m.id); }
          }, ["Delete"])
        ]));
      });
      panel.appendChild(list);
    }
    return panel;
  }

  function openMarkerModal(q, existing) {
    var selected = selectedExamText();
    var isEdit = !!existing;
    var overlay = el("div", { class: "modal-overlay", onclick: function (e) { if (e.target === overlay) overlay.remove(); } });
    var termInput = el("input", {
      class: "marker-field",
      type: "text",
      maxlength: "80",
      placeholder: "Term or topic, e.g. confirmation testing",
      value: isEdit ? existing.term : (selected || q.topic || "")
    });
    var sourceSelect = el("select", { class: "marker-field" }, [
      el("option", { value: "term" }, ["Term"]),
      el("option", { value: "concept" }, ["Concept"]),
      el("option", { value: "question wording" }, ["Question wording"]),
      el("option", { value: "option wording" }, ["Option wording"]),
      el("option", { value: "other" }, ["Other"])
    ]);
    sourceSelect.value = isEdit ? (existing.source || "term") : (selected ? "question wording" : "concept");
    var noteInput = el("textarea", {
      class: "marker-textarea",
      rows: "4",
      placeholder: "What exactly felt unclear? A short note helps the later explanation target the confusion."
    }, [isEdit ? (existing.note || "") : ""]);

    var modal = el("div", { class: "modal marker-modal" }, [
      el("h3", {}, [isEdit ? "Edit learning marker" : "Add learning marker"]),
      el("p", {}, ["Use this for anything you want explained after the exam. It will be exported with your result file."]),
      el("label", { class: "marker-label" }, ["Term or topic", termInput]),
      el("label", { class: "marker-label" }, ["Marker type", sourceSelect]),
      el("label", { class: "marker-label" }, ["What was unclear?", noteInput]),
      selected && !isEdit ? el("p", { class: "marker-selected" }, ["Selected text: " + selected]) : null,
      el("div", { class: "modal-actions" }, [
        el("button", { class: "nav-action-btn", onclick: function () { overlay.remove(); } }, ["Cancel"]),
        el("button", {
          class: "submit-btn",
          onclick: function () {
            if (saveMarker(q, existing, termInput.value, sourceSelect.value, noteInput.value, selected)) {
              overlay.remove();
            }
          }
        }, [isEdit ? "Save Marker" : "Add Marker"])
      ])
    ]);
    overlay.appendChild(modal);
    root.appendChild(overlay);
    termInput.focus();
    termInput.select();
  }

  function saveMarker(q, existing, term, source, note, selected) {
    var cleanTerm = normalizeMarkerTerm(term);
    if (!cleanTerm) {
      alert("Add a term or topic before saving the marker.");
      return false;
    }
    if (!state.markers) state.markers = {};
    var list = markersFor(q.id).slice();
    var now = new Date().toISOString();
    if (existing) {
      list = list.map(function (m) {
        if (m.id !== existing.id) return m;
        return Object.assign({}, m, {
          term: cleanTerm,
          source: source,
          note: note.trim(),
          updatedAt: now
        });
      });
    } else {
      list.push({
        id: "mk_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        term: cleanTerm,
        source: source,
        note: note.trim(),
        selectedText: selected || "",
        questionId: q.id,
        chapter: q.chapter,
        topic: q.topic,
        question: q.question,
        createdAt: now
      });
    }
    state.markers[q.id] = list;
    saveState();
    render();
    return true;
  }

  function deleteMarker(questionId, markerId) {
    if (!confirm("Delete this learning marker?")) return;
    if (!state.markers) return;
    var list = markersFor(questionId).filter(function (m) { return m.id !== markerId; });
    if (list.length) state.markers[questionId] = list;
    else delete state.markers[questionId];
    saveState();
    render();
  }

  // ---------------------------------------------------------------- remaining-question round
  function handleTimerExpired() {
    if (state.phase === "cleanup") {
      submitExam(true);
      return;
    }
    if (state.phase !== "in_progress") return;

    var ids = remainingQuestionIds();
    if (!ids.length || state.cleanupUsed) {
      submitExam(true);
      return;
    }

    stopTimer();
    state.phase = "cleanup_offer";
    state.cleanupQuestionIds = ids;
    state.cleanupOfferedAt = Date.now();
    state.currentIndex = 0;
    saveState();
    render();
  }

  function startCleanupRound() {
    var ids = (state.cleanupQuestionIds && state.cleanupQuestionIds.length)
      ? state.cleanupQuestionIds
      : remainingQuestionIds();
    if (!ids.length) {
      submitExam(false);
      return;
    }
    state.phase = "cleanup";
    state.cleanupUsed = true;
