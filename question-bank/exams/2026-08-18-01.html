med afterward, not a standard field logged on the initial defect report itself.", "option_notes": {"A": "This IS a typical defect report field \u2014 not the answer.", "B": "This IS a typical defect report field \u2014 not the answer.", "C": "This IS a typical defect report field \u2014 not the answer.", "D": "Correct answer \u2014 not part of the syllabus's listed defect report content."}, "distractor_note": null, "alt_wording": "May instead list 'unique identifier', 'context of the defect', or 'references (e.g., to the test case)' among the options and ask you to spot a fabricated field instead."}, {"id": "Q048", "chapter": "5.1", "topic": "Estimation Based on Ratios", "type": "H", "difficulty": "yellow", "question": "An organization has historical data showing a development-to-test effort ratio of 5:2 for similar projects. The new project is estimated at 750 person-days of development effort. Using estimation based on ratios, what is the estimated test effort?", "options": {"A": "150 person-days", "B": "300 person-days", "C": "375 person-days", "D": "1,875 person-days"}, "correct": "B", "why_correct": "A development-to-test ratio of 5:2 means test effort is 2/5 of development effort. 750 x 2/5 = 300 person-days. This matches the syllabus example pattern for ratio-based estimation using historical organizational data.", "option_notes": {"A": "Incorrect - this uses 1/5 rather than 2/5.", "B": "Correct.", "C": "Incorrect - this uses 1/2 of development effort, not the 5:2 ratio.", "D": "Incorrect - this multiplies by 5/2 instead of 2/5."}, "distractor_note": null, "alt_wording": "May phrase the ratio as 'for every 5 days of development, 2 days of testing were needed' or use a different historical development-to-test ratio."}, {"id": "Q005", "chapter": "1.4", "topic": "Traceability", "type": "A", "difficulty": "green", "question": "A test manager wants to know, for every requirement in the specification, whether it is covered by at least one test case, and wants to know the residual risk remaining in the product before release. Which testware property is she relying on?", "options": {"A": "Traceability between the test basis, testware, and test results", "B": "The whole team approach", "C": "Static analysis", "D": "Test case prioritization"}, "correct": "A", "why_correct": "The syllabus states that traceability of test cases to requirements can verify that requirements are covered by test cases, and traceability of test results to risks can be used to evaluate the level of residual risk in a test object \u2014 exactly the two things described.", "option_notes": {"A": "Correct.", "B": "Incorrect \u2014 a team collaboration practice, unrelated to coverage/risk tracing.", "C": "Incorrect \u2014 a static-testing technique using tools, not a coverage/traceability mechanism.", "D": "Incorrect \u2014 about ordering test execution, not about measuring coverage or residual risk."}, "distractor_note": null, "alt_wording": "May describe traceability indirectly as 'being able to show which requirement each test case belongs to' or 'assessing product quality, process capability and project progress against business goals'."}, {"id": "Q030", "chapter": "5.1", "topic": "Three-Point Estimation", "type": "H", "difficulty": "red", "question": "Three experts estimate the effort for a test task using three-point estimation: optimistic (a) = 5 person-days, most likely (m) = 8 person-days, pessimistic (b) = 17 person-days. Using E = (a + 4m + b) / 6 and SD = (b - a) / 6, what is the final estimate and its range?", "options": {"A": "E = 10 person-days, range 8\u201312", "B": "E = 9 person-days, range 7\u201311", "C": "E = 8 person-days, range 5\u201317", "D": "E = 30 person-days, range 12\u201348"}, "correct": "B", "why_correct": "E = (5 + 4x8 + 17) / 6 = (5 + 32 + 17) / 6 = 54 / 6 = 9. SD = (17 - 5) / 6 = 12 / 6 = 2. So the estimate is 9 +/- 2 person-days, i.e., a range of 7 to 11 person-days.", "option_notes": {"A": "Incorrect \u2014 arithmetic error; recompute (5+32+17)/6 = 9, not 10.", "B": "Correct.", "C": "Incorrect \u2014 confuses the estimate with 'm' and the range with the raw (a, b) values instead of applying the SD formula.", "D": "Incorrect \u2014 forgets to divide by 6 in one or both formulas."}, "distractor_note": null, "alt_wording": "May give different a/m/b numbers, ask only for E, or ask only for SD/the range \u2014 always apply E = (a+4m+b)/6 and SD = (b-a)/6 carefully with the given numbers."}, {"id": "Q006", "chapter": "1.5", "topic": "Whole Team Approach vs. Independence of Testing", "type": "C", "difficulty": "yellow", "question": "A payments company is building a new internal admin dashboard, and separately, the flight-control software for a medical infusion pump. Which statement BEST reflects appropriate use of the whole team approach versus test independence for these two projects?", "options": {"A": "Both projects should use the whole team approach, since it always produces the highest-quality software", "B": "The admin dashboard can reasonably use the whole team approach for shared quality ownership; the infusion pump, being safety-critical, likely needs a high degree of independent testing instead", "C": "The infusion pump should use the whole team approach, since developers understand their own code best; the dashboard needs independent testers because it is customer-facing", "D": "Independence of testing and the whole team approach are the same practice applied at different test levels"}, "correct": "B", "why_correct": "The syllabus notes the whole team approach may not always be appropriate \u2014 for instance in safety-critical situations, where a high level of test independence may be needed instead. A low-risk internal dashboard is a reasonable fit for the whole team approach (shared ownership, co-location, synergy); a safety-critical medical device is exactly the kind of context where independent testing's benefit (recognizing different kinds of failures/defects due to a different background and less author bias) matters most.", "option_notes": {"A": "Incorrect \u2014 the syllabus explicitly says the whole team approach is not always appropriate, e.g., in safety-critical contexts.", "B": "Correct.", "C": "Incorrect \u2014 reverses the two projects' appropriate approaches.", "D": "Incorrect \u2014 they are two different, sometimes competing, practices; independence is about who tests, the whole team approach is about shared responsibility for quality."}, "distractor_note": null, "alt_wording": "May ask you to pick the project type that most needs 'a high level of independence' or to identify a drawback of the whole team approach in a safety-critical context."}, {"id": "Q051", "chapter": "5.1", "topic": "Entry Criteria vs. Exit Criteria", "type": "F", "difficulty": "yellow", "question": "Consider the following statements:\n\nI. Availability of test data and a configured test environment are typical entry criteria.\nII. Achieved coverage level and number of unresolved defects are typical exit criteria.\nIII. Running out of time or budget can never be treated as an exit criterion.\n\nWhich statements are correct?", "options": {"A": "I and II only", "B": "I and III only", "C": "II and III only", "D": "I, II, and III"}, "correct": "A", "why_correct": "Entry criteria define preconditions for starting an activity, such as availability of resources, environments, test data, budget, and testware. Exit criteria define what must be achieved to declare completion, such as achieved coverage, unresolved defect levels, or failed test counts. Statement III is false because the syllabus says running out of time or budget can also be viewed as valid exit criteria if stakeholders review and accept the release risk.", "option_notes": {"A": "Correct - I and II are true; III is false.", "B": "Incorrect - III is false.", "C": "Incorrect - I is true and III is false.", "D": "Incorrect - III is false."}, "distractor_note": "Statement III sounds like a quality-first rule, but CTFL recognizes business constraints. Ending due to time or budget is acceptable only with stakeholder risk acceptance.", "alt_wording": "May use Agile terms: Definition of Ready aligns with entry criteria, while Definition of Done aligns with exit criteria."}, {"id": "Q007", "chapter": "2.1", "topic": "DevOps and Testing", "type": "A", "difficulty": "green", "question": "Which of the following is a benefit of DevOps FROM THE TESTING PERSPECTIVE, according to the syllabus?", "options": {"A": "It removes the need for a dedicated test environment", "B": "Continuous integration promotes shift left by encouraging developers to submit code accompanied by component tests and static analysis", "C": "It guarantees zero regression defects in production", "D": "It eliminates the need for manual, user-perspective testing entirely"}, "correct": "B", "why_correct": "This is one of the syllabus's explicitly listed testing-perspective DevOps benefits: CI promotes shift left in testing by encouraging developers to submit high-quality code accompanied by component tests and static analysis.", "option_notes": {"A": "Incorrect \u2014 DevOps helps establish stable test environments through automation; it doesn't remove the need for one.", "B": "Correct.", "C": "Incorrect \u2014 DevOps minimizes regression risk through automated regression tests at scale; it never 'guarantees' zero defects, which would also contradict the absence-of-defects fallacy principle.", "D": "Incorrect \u2014 the syllabus explicitly says manual testing, especially from the user's perspective, will still be needed even with a high level of automated testing."}, "distractor_note": null, "alt_wording": "May ask to identify a DevOps risk instead (e.g., 'the pipeline must be defined and maintained', 'test automation requires additional resources') \u2014 read carefully whether the question asks for a benefit or a risk."}, {"id": "Q009", "chapter": "2.2", "topic": "Test Levels", "type": "B", "difficulty": "yellow", "question": "A team has finished testing each microservice in isolation. They now want to verify that Service A correctly calls Service B's API and correctly interprets its response, without yet involving any external third-party services. Which test level are they performing?", "options": {"A": "Component testing", "B": "Component integration testing", "C": "System integration testing", "D": "Acceptance testing"}, "correct": "B", "why_correct": "Component integration testing (also known as unit integration testing) focuses on testing the interfaces and interactions between components \u2014 exactly Service A calling Service B within the same system, before any external/third-party systems are involved.", "option_notes": {"A": "Incorrect \u2014 that's testing each component/microservice in isolation, which is described as already finished in the scenario.", "B": "Correct.", "C": "Incorrect \u2014 system integration testing is about interfaces between the system under test and OTHER systems/external services, not between two internal components.", "D": "Incorrect \u2014 acceptance testing is about validating the whole system meets user/business needs, unrelated to inter-component API calls."}, "distractor_note": "System integration testing is the classic distractor here because it also involves 'interfaces' \u2014 the distinguishing detail is whether the interacting parties are internal components of the same system (component integration testing) or the system under test and an external system/service (system integration testing).", "alt_wording": "May describe this as 'checking two internal modules talk to each other correctly' vs. 'checking the system talks correctly to an external payment gateway' (the latter is system integration testing)."}, {"id": "Q052", "chapter": "4.3", "topic": "Branch Coverage Calculation", "type": "H", "difficulty": "red", "question": "A small function has 10 executable statements and 6 branches. A test suite executes all 10 statements and 4 of the 6 branches. What can be concluded?", "options": {"A": "Statement coverage is 100% and branch coverage is approximately 67%.", "B": "Statement coverage is approximately 67% and branch coverage is 100%.", "C": "Both statement coverage and branch coverage are 100%.", "D": "Branch coverage cannot be measured unless statement coverage is below 100%."}, "correct": "A", "why_correct": "Statement coverage is the number of executed statements divided by the total executable statements: 10/10 = 100%. Branch coverage is the number of executed branches divided by the total branches: 4/6 = 66.7%, approximately 67%. Achieving 100% statement coverage does not necessarily mean 100% branch coverage.", "option_notes": {"A": "Correct.", "B": "Incorrect - the two coverage measures are reversed.", "C": "Incorrect - branch coverage is not 100% because only 4 of 6 branches were exercised.", "D": "Incorrect - branch coverage can be measured independently and is stronger than statement coverage."}, "distractor_note": "The key trap is assuming that executing every statement automatically exercises every branch outcome. CTFL expects you to keep statement and branch coverage separate.", "alt_wording": "May ask whether 100% branch coverage implies 100% statement coverage. In the syllabus, 100% branch coverage implies 100% statement coverage, but not the other way around."}, {"id": "Q043", "chapter": "4.2", "topic": "State Transition Testing - All Transitions Coverage", "type": "F", "difficulty": "red", "question": "Consider the following statements about state transition testing:\n\nI. All transitions coverage requires test cases to exercise all valid transitions and attempt invalid transitions shown in a state table.\nII. Testing several invalid transitions in one test case is preferred because it reduces defect masking.\n\nWhich is correct?", "options": {"A": "Only I is correct", "B": "Only II is correct", "C": "Both I and II are correct", "D": "Neither I nor II is correct"}, "correct": "A", "why_correct": "Statement I matches the syllabus: all transitions coverage covers both valid and invalid transitions. Statement II is false because the syllabus recommends testing only one invalid transition in a single test case to help avoid defect masking, where one defect prevents detection of another.", "option_notes": {"A": "Correct - I is true and II is false.", "B": "Incorrect - II reverses the syllabus guidance on invalid transitions.", "C": "Incorrect - II is false.", "D": "Incorrect - I is true."}, "distractor_note": "Combining invalid transitions can sound efficient, but CTFL cares about diagnostic clarity. One invalid transition per test case makes it easier to see which transition caused the observed behavior.", "alt_wording": "May ask about all states coverage, valid transitions coverage (0-switch), or all transitions coverage; read whether invalid transitions are included."}, {"id": "Q042", "chapter": "6.1", "topic": "What Counts as a Test Tool", "type": "E", "difficulty": "yellow", "question": "Which statement is FALSE according to the syllabus section on tool support for testing?", "options": {"A": "Test management tools can facilitate management of requirements, tests, defects, and configuration.", "B": "DevOps tools can support the delivery pipeline, workflow tracking, automated build processes, and CI/CD.", "C": "A spreadsheet cannot be considered a test tool because it is not a dedicated testing product.", "D": "Test design and test implementation tools can facilitate generation of test cases, test data, and test procedures."}, "correct": "C", "why_correct": "The syllabus explicitly allows a broad definition: any tool that assists in testing can be considered a test tool, and it gives a spreadsheet as an example in the testing context. A tool does not need to be a dedicated commercial testing product to support testing.", "option_notes": {"A": "True - this matches the syllabus description of test management tools.", "B": "True - this matches the syllabus description of DevOps tools.", "C": "Correct answer - this statement is false.", "D": "True - this matches the syllabus description of test design and implementation tools."}, "distractor_note": "The tempting mistake is to interpret 'test tool' too narrowly. CTFL uses a functional definition: if it assists testing, it can count in that context.", "alt_wording": "May be phrased as 'which of these could be a test tool in context?' with spreadsheet, checklist, collaboration board, or pipeline tool as possible examples."}, {"id": "Q045", "chapter": "4.2", "topic": "Decision Table Coverage", "type": "H", "difficulty": "yellow", "question": "A minimized decision table has 8 feasible decision rules. During testing, test cases exercise 6 of those feasible rules. What is the decision table coverage?", "options": {"A": "6%", "B": "25%", "C": "75%", "D": "100%"}, "correct": "C", "why_correct": "In decision table testing, the coverage items are the columns containing feasible combinations of conditions. Coverage is the number of exercised feasible columns divided by the total number of feasible columns. Here, 6 / 8 = 0.75 = 75%.", "option_notes": {"A": "Incorrect - this treats the number of exercised rules as the percentage.", "B": "Incorrect - this is the uncovered portion, 2 out of 8, not the exercised coverage.", "C": "Correct.", "D": "Incorrect - 100% would require exercising all 8 feasible rules."}, "distractor_note": null, "alt_wording": "May ask how many additional test cases or rules are needed to reach 100% coverage, or may mention feasible columns instead of decision rules."}, {"id": "Q013", "chapter": "3.2", "topic": "Review Roles", "type": "B", "difficulty": "yellow", "question": "During a formal review meeting, one participant is responsible for collating anomalies raised by each reviewer and logging the decisions made about them, while a different participant manages the meeting's timing and ensures everyone can speak freely. What are these two roles called, respectively?", "options": {"A": "Reviewer, then Author", "B": "Scribe, then Moderator", "C": "Review leader, then Manager", "D": "Moderator, then Scribe"}, "correct": "B", "why_correct": "The scribe (recorder) collates anomalies from reviewers and records review information such as decisions and new anomalies. The moderator (facilitator) ensures the effective running of review meetings, including mediation, time management, and a safe environment for open discussion.", "option_notes": {"A": "Incorrect \u2014 neither description matches a reviewer (who just performs reviews) or the author (who created and fixes the work product).", "B": "Correct.", "C": "Incorrect \u2014 the review leader takes overall responsibility for organizing the review (who/when/where); the manager decides what is reviewed and provides resources \u2014 neither matches the two descriptions given.", "D": "Incorrect \u2014 the two roles are swapped relative to their descriptions."}, "distractor_note": null, "alt_wording": "May instead describe the manager ('decides what is to be reviewed and provides resources') or the author ('creates and fixes the work product') and ask you to name the role."}, {"id": "Q047", "chapter": "4.5", "topic": "ATDD Test Case Scope", "type": "D", "difficulty": "red", "question": "A team uses ATDD for a user story about applying a discount code at checkout. Which test case is LEAST appropriate to include for that story?", "options": {"A": "A positive test showing a valid discount code reduces the order total.", "B": "A negative test showing an expired discount code is rejected with a clear message.", "C": "A usability-related acceptance test checking that the discount error message is understandable to the shopper.", "D": "An end-to-end test of the warehouse picking workflow after the order is shipped."}, "correct": "D", "why_correct": "ATDD test cases are based on the acceptance criteria, should cover all characteristics of the user story, and should not go beyond the story. Positive, negative, and relevant non-functional characteristics may be included. A warehouse picking workflow after shipment is outside the discount-code checkout story.", "option_notes": {"A": "Appropriate - ATDD typically starts with positive tests for expected behavior.", "B": "Appropriate - after positive tests, the team should perform negative testing.", "C": "Appropriate if message understandability is part of the story or acceptance criteria; the syllabus allows relevant non-functional characteristics such as usability.", "D": "Correct answer - least appropriate because it goes beyond the user story's scope."}, "distractor_note": null, "alt_wording": "May ask which ATDD test case goes beyond the story, duplicates another characteristic, or is not understandable to stakeholders."}, {"id": "Q046", "chapter": "4.5", "topic": "Acceptance Criteria Formats", "type": "C", "difficulty": "yellow", "question": "A user story's acceptance criteria are written as a table mapping account status and payment status to whether access should be granted. Which acceptance-criteria format is this, and how does it differ from Given/When/Then?", "options": {"A": "Scenario-oriented; Given/When/Then is rule-oriented", "B": "Rule-oriented; Given/When/Then is scenario-oriented", "C": "Exploratory; Given/When/Then is checklist-based", "D": "Static analysis; Given/When/Then is dynamic testing"}, "correct": "B", "why_correct": "The syllabus gives two common acceptance criteria formats: scenario-oriented, such as Given/When/Then, and rule-oriented, such as a bullet point verification list or a tabulated input-output mapping. A table mapping inputs to expected outputs is rule-oriented.", "option_notes": {"A": "Incorrect - the two formats are reversed.", "B": "Correct.", "C": "Incorrect - exploratory and checklist-based testing are experience-based test techniques, not the two acceptance-criteria formats named here.", "D": "Incorrect - these are not acceptance-criteria formats."}, "distractor_note": "Given/When/Then often gets associated with BDD and scenarios. A table of rules may still be excellent acceptance criteria, but it is rule-oriented rather than scenario-oriented.", "alt_wording": "May describe rule-oriented criteria as a verification list, decision table-like mapping, or input-output table."}, {"id": "Q038", "chapter": "5.4", "topic": "Configuration Management", "type": "A", "difficulty": "green", "question": "A team needs to reproduce a defect that was only observed against last month's version of the test environment. Which practice makes this possible?", "options": {"A": "Risk-based testing", "B": "Configuration management, which allows reverting to a previous approved baseline", "C": "Test case prioritization", "D": "Checklist-based testing"}, "correct": "B", "why_correct": "Configuration management (CM) provides a discipline for identifying, controlling, and tracking work products as configuration items, recording changed items when a new baseline is created; it is explicitly possible to revert to a previous baseline to reproduce previous test results.", "option_notes": {"A": "Incorrect \u2014 risk-based testing is about prioritizing test effort by risk, unrelated to reverting environment versions.", "B": "Correct.", "C": "Incorrect \u2014 test case prioritization is about execution order, not environment version control.", "D": "Incorrect \u2014 checklist-based testing is an experience-based test design technique, unrelated to configuration/version tracking."}, "distractor_note": null, "alt_wording": "May describe CM's role as ensuring 'configuration items are uniquely identified, version controlled, tracked for changes, and related to other configuration items' for traceability instead of the reproduction angle."}, {"id": "Q041", "chapter": "6.1", "topic": "Tool Support for Non-Functional Testing", "type": "B", "difficulty": "green", "question": "A team needs to simulate 20,000 concurrent users placing orders through an e-commerce checkout. The behavior would be difficult and unreliable to perform manually. Which type of test tool support BEST fits this need?", "options": {"A": "Static testing tools", "B": "Non-functional testing tools", "C": "Collaboration tools", "D": "Test management tools"}, "correct": "B", "why_correct": "The syllabus lists non-functional testing tools as tools that allow testers to perform non-functional testing that is difficult or impossible to perform manually. Simulating many concurrent users is a typical performance/load-testing situation, so non-functional test tool support is the best fit.", "option_notes": {"A": "Incorrect - static testing tools support reviews and static analysis, not dynamic load simulation.", "B": "Correct.", "C": "Incorrect - collaboration tools facilitate communication; they do not generate load or measure performance behavior.", "D": "Incorrect - test management tools help manage requirements, tests, defects, configuration, and related test process information, but they are not the direct tool type for load simulation."}, "distractor_note": null, "alt_wording": "May ask which tool type supports performance, security, reliability, or other non-functional testing that would be hard to do manually."}, {"id": "Q017", "chapter": "4.2", "topic": "Boundary Value Analysis (2-value vs. 3-value)", "type": "H", "difficulty": "red", "question": "A shipping system should apply free shipping when orderValue <= 500. A developer accidentally implements this as 'if (orderValue == 500) applyFreeShipping()'. A tester derives 2-value BVA test data for this boundary: {500, 501}. Both tests pass their expected-vs-actual comparison despite the bug. Why did 2-value BVA fail to catch this defect, and what would catch it?", "options": {"A": "2-value BVA is fundamentally broken and should never be used; only exploratory testing could catch this", "B": "The defect requires White-box statement coverage, since BVA cannot be used for this kind of boundary at all", "C": "2-value BVA only exercises the boundary (500, correctly free under the bug) and its one adjacent neighbor (501, correctly not free under the bug); 3-value BVA would add the boundary's other neighbor (499), which SHOULD get free shipping per spec but wouldn't under the buggy '==' check, exposing the defect", "D": "The defect cannot be found by any black-box technique because it is a coding-level mistake"}, "correct": "C", "why_correct": "This mirrors the syllabus's own worked example almost exactly: for the boundary 'x <= 10' buggy-implemented as 'x = 10', 2-value BVA test data {10, 11} both accidentally pass under the bug, but 3-value BVA test data {9, 10, 11} adds 9, which exposes the defect since the buggy code incorrectly rejects it. Here, 499 is the value that should get free shipping (499 <= 500) but wouldn't under the '==' bug, exposing the mismatch between expected and actual results.", "option_notes": {"A": "Incorrect \u2014 overreaching conclusion; 2-value BVA is a valid, useful technique, it simply has lower fault-detection power than 3-value BVA for this specific defect pattern.", "B": "Incorrect \u2014 BVA is precisely applicable to this ordered numeric boundary; white-box coverage is a different (structure-based) technique category and isn't required to catch this.", "C": "Correct.", "D": "Incorrect \u2014 this is exactly the kind of coding-level boundary defect black-box BVA is designed to expose from the outside, without knowledge of the implementation."}, "distractor_note": null, "alt_wording": "May give you the buggy condition directly (e.g., 'if (x = 10)' instead of 'if (x <= 10)') and ask which BVA variant, or which specific input value, would detect the defect."}, {"id": "Q008", "chapter": "2.1", "topic": "Test-First Approaches: TDD, ATDD, BDD", "type": "C", "difficulty": "yellow", "question": "A cross-functional team wants acceptance criteria expressed in a natural-language Given/When/Then format that non-technical stakeholders can read and that can be automatically translated into executable tests. Which test-first approach are they using?", "options": {"A": "Test-Driven Development (TDD)", "B": "Acceptance Test-Driven Development (ATDD)", "C": "Behavior-Driven Development (BDD)", "D": "Exploratory testing"}, "correct": "C", "why_correct": "BDD specifically expresses the desired behavior of an application using test cases written in a simple natural-language form \u2014 usually the Given/When/Then format \u2014 that stakeholders can understand, and these are then translated into executable tests.", "option_notes": {"A": "Incorrect \u2014 TDD directs coding through developer-written test cases before the code; it's not about natural-language stakeholder-readable acceptance criteria.", "B": "Incorrect \u2014 ATDD derives tests from acceptance criteria as part of system design; Given/When/Then specifically is the hallmark of BDD, not ATDD generically.", "C": "Correct.", "D": "Incorrect \u2014 exploratory testing is an experience-based technique with no test-first, natural-language specification involved."}, "distractor_note": "ATDD is a tempting choice because it's also a test-first, acceptance-criteria-driven approach \u2014 but the specific Given/When/Then natural-language format called out by name in the syllabus belongs to BDD.", "alt_wording": "May instead ask you to match TDD/ATDD/BDD to a one-line description without naming the technique, or ask which one 'directs the coding through test cases instead of extensive software design' (that one is TDD)."}, {"id": "Q004", "chapter": "1.3", "topic": "Testing Principles", "type": "E", "difficulty": "yellow", "question": "All of the following are among the seven testing principles described in the syllabus EXCEPT:", "options": {"A": "Early testing saves time and money", "B": "Testing is context dependent", "C": "Automating all test cases eliminates the need for further manual testing", "D": "Exhaustive testing is impossible"}, "correct": "C", "why_correct": "There is no such principle. The seven principles are: (1) testing shows the presence, not the absence, of defects; (2) exhaustive testing is impossible; (3) early testing saves time and money; (4) defects cluster together; (5) tests wear out; (6) testing is context dependent; (7) absence-of-defects fallacy. None of them claim automation removes the need for manual testing \u2014 in fact this contradicts the syllabus's general position (see chapter 6) that manual testing, especially from the user's perspective, is still needed even with high automation.", "option_notes": {"A": "This IS a real principle \u2014 not the answer to this EXCEPT question.", "B": "This IS a real principle \u2014 not the answer.", "C": "Correct answer \u2014 this is not one of the seven principles, and it's actually a misconception the syllabus argues against elsewhere.", "D": "This IS a real principle \u2014 not the answer."}, "distractor_note": "This option is tempting because it sounds like something the syllabus's automation section could say, but it inverts chapter 6's actual message: automation reduces repetitive manual work but does not eliminate the need for manual testing.", "alt_wording": "May ask 'which of the following is NOT one of the seven testing principles' with different wrong-principle wording each time \u2014 always re-check against the canonical list of seven."}, {"id": "Q027", "chapter": "4.5", "topic": "Acceptance Test-Driven Development (ATDD)", "type": "B", "difficulty": "yellow", "question": "A team practicing ATDD has just finished a specification workshop resolving ambiguities in a new user story. What should they do NEXT, in the order the syllabus describes?", "options": {"A": "Immediately write non-functional performance tests, since those matter most for production readiness", "B": "Create the test cases based on the acceptance criteria \u2014 typically positive tests first (expected behavior with no errors), then negative tests, then non-functional characteristics", "C": "Automate every test case before any of them have been reviewed by the team", "D": "Skip straight to development, since the specification workshop already resolved all necessary ambiguity"}, "correct": "B", "why_correct": "After the specification workshop resolves incompleteness/ambiguity/defects in the user story, the next step is creating test cases from the acceptance criteria. The syllabus specifies the typical order: positive test cases first (confirming correct behavior without exceptions), then negative testing, and finally covering non-functional quality characteristics.", "option_notes": {"A": "Incorrect \u2014 non-functional characteristics are covered last, after positive and negative functional test cases, per the syllabus's stated order.", "B": "Correct.", "C": "Incorrect \u2014 automation happens as developers implement the feature and write supporting code, not necessarily before any team review, and isn't the immediate next step after the workshop.", "D": "Incorrect \u2014 test case creation from the acceptance criteria still needs to happen before/alongside development; skipping it defeats the purpose of ATDD as a test-first approach."}, "distractor_note": null, "alt_wording": "May ask you to put ATDD steps in order (specification workshop \u2192 test case creation \u2192 positive tests \u2192 negative tests \u2192 non-functional \u2192 automation as code is implemented) or ask which team members participate in creating the initial test cases (customers, developers, testers)."}, {"id": "Q011", "chapter": "2.3", "topic": "Maintenance Testing Triggers", "type": "A", "difficulty": "green", "question": "A company migrates its production database from an on-premises server to a cloud platform, with no functional changes to the application itself. According to the syllabus's classification of maintenance testing triggers, this is BEST classified as:", "options": {"A": "A modification, specifically a planned enhancement", "B": "An upgrade or migration of the operational environment", "C": "A retirement trigger", "D": "Not a maintenance testing trigger, since no application code changed"}, "correct": "B", "why_correct": "The syllabus classifies maintenance testing triggers into modifications (planned enhancements, corrective changes, hot fixes), upgrades or migrations of the operational environment (e.g., platform changes, which can require tests of the new environment and of data conversion), and retirement. Moving to a new cloud platform is exactly an upgrade/migration of the operational environment.", "option_notes": {"A": "Incorrect \u2014 modifications are about changes to the software itself (features/fixes), not a platform migration.", "B": "Correct.", "C": "Incorrect \u2014 retirement is about an application reaching end-of-life, not a platform move.", "D": "Incorrect \u2014 environment migrations are explicitly one of the three trigger categories and still require testing (of the new environment and of data conversion)."}, "distractor_note": null, "alt_wording": "May describe 'data conversion testing when migrating from one application to another' or 'testing restore/retrieval after long-term archiving' (both also maintenance-testing scenarios, the latter under retirement)."}, {"id": "Q029", "chapter": "5.1", "topic": "Entry/Exit Criteria vs. Definition of Ready/Done", "type": "C", "difficulty": "yellow", "question": "In an Agile team, a user story must have clear acceptance criteria and available test data before development starts, and is only considered finished once all automated tests pass and the code has been reviewed. What are these two sets of conditions called, respectively, and which general concepts do they map to?", "options": {"A": "Definition of Ready maps to exit criteria; Definition of Done maps to entry criteria", "B": "Definition of Ready maps to entry criteria; Definition of Done maps to exit criteria", "C": "Both map to entry criteria; Agile has no equivalent of exit criteria", "D": "Both are informal terms with no relationship to entry/exit criteria at all"}, "correct": "B", "why_correct": "The syllabus explicitly states that in Agile software development, exit criteria are often called Definition of Done, and entry criteria that a user story must fulfill to start development/testing are called Definition of Ready. The 'must have criteria before starting' description matches entry criteria/Definition of Ready; the 'considered finished when' description matches exit criteria/Definition of Done.", "option_notes": {"A": "Incorrect \u2014 swapped; Ready is entry, Done is exit.", "B": "Correct.", "C": "Incorrect \u2014 Agile does have an equivalent of exit criteria (Definition of Done).", "D": "Incorrect \u2014 the syllabus directly equates these terms with entry/exit criteria."}, "distractor_note": null, "alt_wording": "May ask 'what happens if entry criteria are not met' (the activity is likely to prove more difficult, time-consuming, costly and riskier) as a related follow-up angle."}, {"id": "Q001", "chapter": "1.1", "topic": "Testing and Debugging", "type": "F", "difficulty": "yellow", "question": "Consider the following two statements:\n\nI. When static testing identifies a defect, debugging still requires a reproduction step before the defect can be fixed.\nII. Confirmation testing that follows debugging after a dynamic-testing failure is preferably performed by the same person who ran the original failing test.\n\nWhich is correct?", "options": {"A": "Only I is correct", "B": "Only II is correct", "C": "Both I and II are correct", "D": "Neither I nor II is correct"}, "correct": "B", "why_correct": "The syllabus explicitly states that when static testing finds a defect, there is no need for reproduction or diagnosis, since static testing finds the defect directly without ever causing a failure. Reproduction is only needed for defects behind a dynamic-testing failure. It also explicitly recommends the same person who performed the initial test preferably do the confirmation testing.", "option_notes": {"A": "Incorrect \u2014 I is false, not true.", "B": "Correct \u2014 I is false (static testing needs no reproduction step), II is true.", "C": "Incorrect \u2014 I is false.", "D": "Incorrect \u2014 II is true."}, "distractor_note": "Statement I is built to sound reasonable because 'debugging' is generically associated with reproduce-diagnose-fix, but that three-step process is specifically the *dynamic*-testing-triggered debugging process. Static testing skips reproduction/diagnosis entirely because it finds the defect directly.", "alt_wording": "Exam may phrase this as 'what must happen before a defect found by a review can be fixed' (answer: nothing extra \u2014 no reproduction needed) or 'who should ideally re-run a previously failed test after a fix'."}, {"id": "Q034", "chapter": "5.2", "topic": "Project Risks vs. Product Risks", "type": "B", "difficulty": "yellow", "question": "A test manager identifies two concerns: (1) the third-party analytics vendor may go out of business before launch, and (2) the search feature sometimes returns incorrect results for queries containing special characters. How should these be classified?", "options": {"A": "Both are product risks, since both could affect the release", "B": "(1) is a project risk (supplier issue); (2) is a product risk (incorrect functionality)", "C": "(1) is a product risk; (2) is a project risk", "D": "Both are project risks, since a manager identified them"}, "correct": "B", "why_correct": "Project risks relate to management/control of the project, including supplier issues such as third-party delivery failure or vendor bankruptcy \u2014 matching concern (1) exactly. Product risks relate to product quality characteristics, including missing/wrong functionality \u2014 matching concern (2), the search feature returning incorrect results.", "option_notes": {"A": "Incorrect \u2014 conflates two categories with different natures; a vendor going out of business is a project-management concern, not a product quality characteristic.", "B": "Correct.", "C": "Incorrect \u2014 reversed.", "D": "Incorrect \u2014 who identifies a risk has no bearing on its classification; classification depends on whether the risk concerns project management/control or the product's own quality characteristics."}, "distractor_note": null, "alt_wording": "May list other project-risk examples (insufficient skills, scope creep, cost cutting) or product-risk examples (poor architecture, inadequate response time, security vulnerabilities) and ask you to sort them."}, {"id": "Q014", "chapter": "3.2", "topic": "Review Types", "type": "C", "difficulty": "red", "question": "In which review type does the syllabus explicitly state that the author cannot act as the review leader or the scribe?", "options": {"A": "Informal review", "B": "Walkthrough", "C": "Technical review", "D": "Inspection"}, "correct": "D", "why_correct": "Inspections are the most formal review type and follow the complete generic review process; the syllabus explicitly states that in inspections, the author cannot act as the review leader or scribe \u2014 a restriction unique to inspections among the four listed review types.", "option_notes": {"A": "Incorrect \u2014 informal reviews have no defined process or formal output at all, so no such role restriction is specified.", "B": "Incorrect \u2014 a walkthrough is actually LED BY THE AUTHOR, the opposite constraint.", "C": "Incorrect \u2014 a technical review is led by a moderator, but the syllabus does not state this author restriction for it.", "D": "Correct."}, "distractor_note": "Walkthrough is a strong distractor precisely because it also involves the author closely \u2014 but there the author actively LEADS the session, which is the opposite of being barred from a leadership/recording role, as in inspections.", "alt_wording": "May instead ask which review type is 'led by the author' (walkthrough) or which has 'finding the maximum number of anomalies' as its main objective (inspection)."}, {"id": "Q002", "chapter": "1.2", "topic": "Errors, Defects, Failures, Root Causes", "type": "B", "difficulty": "green", "question": "Under deadline pressure, a developer copy-pastes a validation function but forgets to update a variable reference. The resulting source code now contains an incorrect boundary check. Months later, in production, a customer enters a value at exactly that boundary and the checkout page crashes. What is the correct mapping of terms, in order of occurrence?", "options": {"A": "Root cause = time pressure; Error = the mistaken copy-paste edit; Defect = the incorrect code; Failure = the checkout page crashing", "B": "Error = time pressure; Defect = the mistaken copy-paste edit; Failure = the incorrect code; Root cause = the checkout page crashing", "C": "Defect = time pressure; Error = the incorrect code; Root cause = the mistaken copy-paste edit; Failure = the checkout page crashing", "D": "Failure = time pressure; Root cause = the incorrect code; Error = the checkout page crashing; Defect = the mistaken copy-paste edit"}, "correct": "A", "why_correct": "The syllabus chain is: humans make errors (mistakes) \u2192 which produce defects (faults, bugs) \u2192 which may result in failures when executed. Time pressure is a typical example of a root cause behind the human error. So: root cause (time pressure) causes the error (the mistaken edit), which produces the defect (the wrong code), which results in the failure (the crash) once executed with the triggering input.", "option_notes": {"A": "Correct \u2014 matches the syllabus's error \u2192 defect \u2192 failure chain with time pressure as the root cause behind the error.", "B": "Incorrect \u2014 shuffles every term one step out of place; time pressure is a root cause, not an error itself.", "C": "Incorrect \u2014 reverses defect and root cause entirely.", "D": "Incorrect \u2014 places the observable failure (the crash) as if it were an error, and the root cause as if it were the code defect."}, "distractor_note": null, "alt_wording": "May appear as 'which of these is the root cause vs. the defect' in a short narrative, or ask you to identify only one of the four terms from a scenario."}, {"id": "Q010", "chapter": "2.2", "topic": "Confirmation Testing vs. Regression Testing", "type": "F", "difficulty": "red", "question": "Consider the following two statements about a defect fix:\n\nI. Regression testing confirms that the specific reported defect no longer occurs.\nII. Confirmation testing may be restricted, under time or budget pressure, to just re-exercising the steps that reproduced the original failure and checking it no longer occurs.\n\nWhich is correct?", "options": {"A": "Only I is correct", "B": "Only II is correct", "C": "Both I and II are correct", "D": "Neither I nor II is correct"}, "correct": "B", "why_correct": "Statement I reverses the two concepts: confirming the specific reported defect no longer occurs is confirmation testing's job, not regression testing's (regression testing checks that the change hasn't caused adverse consequences ELSEWHERE). Statement II is directly from the syllabus: when time or money is short, confirmation testing might be restricted to simply exercising the steps that reproduce the failure and checking it does not occur.", "option_notes": {"A": "Incorrect \u2014 I incorrectly swaps confirmation testing's job onto regression testing.", "B": "Correct.", "C": "Incorrect \u2014 I is false.", "D": "Incorrect \u2014 II is true."}, "distractor_note": "This is one of the most common ISTQB exam traps: confirmation testing = 'did THIS defect get fixed?'; regression testing = 'did fixing it break something else?'. Statement I is written to sound plausible by using the word 'confirms', priming you toward confirmation testing's actual definition.", "alt_wording": "Often appears as a direct definition-swap question: 'which testing type re-runs a previously failed test to check a specific fix?' (confirmation) vs. 'which testing type checks that unrelated areas still work after a change?' (regression)."}, {"id": "Q019", "chapter": "4.2", "topic": "State Transition Testing \u2014 Coverage Criteria", "type": "H", "difficulty": "yellow", "question": "A document workflow has 3 states \u2014 Draft, Submitted, Approved \u2014 with 3 valid transitions: Draft->Submitted (submit), Submitted->Approved (approve), Submitted->Draft (reject). To achieve 100% valid transitions coverage (0-switch coverage), what is required, and how does it compare to 100% all states coverage?", "options": {"A": "Only the 3 states must each be visited at least once; visiting all states automatically guarantees all valid transitions have also been exercised", "B": "All 3 valid transitions must each be exercised at least once; achieving this guarantees full all states coverage is achieved too, but not vice versa", "C": "Only 1 test case is ever sufficient for both criteria, regardless of how many states or transitions exist", "D": "Valid transitions coverage additionally requires attempting invalid transitions such as Draft->Approved"}, "correct": "B", "why_correct": "Valid transitions (0-switch) coverage requires exercising all valid transitions (here, all 3). The syllabus states achieving full valid transitions coverage guarantees full all states coverage, but the reverse is not true \u2014 all states coverage is weaker and can typically be achieved without exercising every transition.", "option_notes": {"A": "Incorrect \u2014 reverses the guarantee direction; visiting all states does NOT guarantee all transitions were exercised (e.g., you could reach Approved without ever exercising the Submitted->Draft reject transition).", "B": "Correct.", "C": "Incorrect \u2014 while one well-designed test case sequence could coincidentally cover multiple transitions, this isn't guaranteed 'regardless of how many states or transitions exist', and is not a coverage rule from the syllabus.", "D": "Incorrect \u2014 attempting invalid transitions is a requirement of ALL TRANSITIONS coverage, a stricter/different criterion, not valid transitions (0-switch) coverage."}, "distractor_note": "Option D deliberately blends 'all transitions coverage' (which does include attempted invalid transitions) into the definition of 'valid transitions coverage' (which only concerns the valid ones) \u2014 a realistic exam mix-up between the three named coverage criteria.", "alt_wording": "May ask which coverage criterion 'should be a minimum requirement for mission and safety-critical software' (all transitions coverage, since it subsumes the other two)."}, {"id": "Q036", "chapter": "5.3", "topic": "Test Metrics", "type": "C", "difficulty": "yellow", "question": "'Mean time to failure' and 'availability' are examples of which category of test metric, and how does that differ from 'number of test cases run/not run, passed/failed'?", "options": {"A": "Both are the same category: defect metrics", "B": "'Mean time to failure'/'availability' are product quality metrics; 'test cases run/passed/failed' are test progress metrics", "C": "'Mean time to failure'/'availability' are test progress metrics; 'test cases run/passed/failed' are product quality metrics", "D": "Both are coverage metrics, just measured differently"}, "correct": "B", "why_correct": "The syllabus lists product quality metrics (e.g., availability, response time, mean time to failure) as a distinct category from test progress metrics (e.g., test case implementation progress, number of test cases run/not run, passed/failed, test execution time).", "option_notes": {"A": "Incorrect \u2014 defect metrics are yet another distinct category (e.g., number/priority of defects found/fixed, defect density).", "B": "Correct.", "C": "Incorrect \u2014 reversed.", "D": "Incorrect \u2014 coverage metrics are a separate category (e.g., requirements coverage, code coverage), matching neither example given."}, "distractor_note": null, "alt_wording": "May list a metric from a different category (e.g., 'cost of testing' = cost metric, or 'residual risk level' = risk metric) and ask you to classify it."}, {"id": "Q020", "chapter": "4.2", "topic": "Equivalence Partitioning vs. Boundary Value Analysis", "type": "C", "difficulty": "yellow", "question": "Which statement correctly distinguishes Equivalence Partitioning (EP) from Boundary Value Analysis (BVA)?", "options": {"A": "EP can be applied to unordered, discrete partitions (e.g., a set of country codes), while BVA can only be used for ordered partitions since it needs a notion of 'boundary' and 'neighbor'", "B": "BVA is a black-box technique while EP is a white-box technique", "C": "EP always requires more test cases than BVA for the same input field", "D": "BVA can only be applied to numeric fields, while EP can only be applied to text fields"}, "correct": "A", "why_correct": "The syllabus explicitly states BVA can only be used for ordered partitions, because it exercises boundaries (minimum/maximum values) and requires the property that elements between two same-partition elements also belong to that partition \u2014 a notion that requires order. EP has no such restriction and applies to continuous or discrete, ordered or unordered partitions.", "option_notes": {"A": "Correct.", "B": "Incorrect \u2014 both EP and BVA are black-box (specification-based) test techniques.", "C": "Incorrect \u2014 there's no such general rule; the number of test cases depends on the number of partitions/boundaries in each specific case, not a fixed relationship between the two techniques.", "D": "Incorrect \u2014 neither technique is restricted to only numeric or only text fields; partitions can be defined for many kinds of data elements, including inputs, outputs, configuration items and time-related values."}, "distractor_note": null, "alt_wording": "May ask 'for which of the following fields could BVA NOT be meaningfully applied' and give an unordered set (e.g., a dropdown of unrelated category names) as the correct EXCEPT-style answer."}, {"id": "Q016", "chapter": "4.2", "topic": "Equivalence Partitioning", "type": "H", "difficulty": "yellow", "question": "A loyalty-tier field accepts an integer number of points and classifies customers as: Bronze (0\u2013999), Silver (1000\u20134999), Gold (5000 or more). Negative numbers are rejected as invalid input. Using Equivalence Partitioning with Each Choice coverage, what is the MINIMUM number of test cases needed to achieve 100% coverage of all identified partitions?", "options": {"A": "2 test cases", "B": "3 test cases", "C": "4 test cases", "D": "6 test cases"}, "correct": "C", "why_correct": "There are 4 partitions here: 3 valid (Bronze 0\u2013999, Silver 1000\u20134999, Gold >=5000) and 1 invalid (negative numbers). In EP, coverage is the number of partitions exercised by at least one test case divided by the total number of partitions; one test case per partition is sufficient (a value from one partition is assumed to be handled the same way as any other value in that partition). So the minimum is one test value per partition = 4 test cases.", "option_notes": {"A": "Incorrect \u2014 undercounts the partitions; there are 4, not 2.", "B": "Incorrect \u2014 covers only the 3 valid partitions and forgets the invalid (negative) partition, which must also be exercised for 100% coverage.", "C": "Correct \u2014 one test value from each of the 4 partitions (e.g., 500, 2500, 6000, -1).", "D": "Incorrect \u2014 overcounts; EP requires one test per partition, not e.g. testing both ends of each range (that would be Boundary Value Analysis, a different technique)."}, "distractor_note": "Option D is a common trap for readers who mentally blend EP with BVA \u2014 EP's coverage claim is 'one value per partition is enough because the whole partition behaves the same', not 'test every boundary'.", "alt_wording": "May instead ask you to identify how many partitions exist without asking for a test-case count, or ask you to pick which single test value set achieves 100% partition coverage."}, {"id": "Q012", "chapter": "3.1", "topic": "Static vs. Dynamic Testing", "type": "E", "difficulty": "yellow", "question": "All of the following are genuine differences between static testing and dynamic testing EXCEPT:", "options": {"A": "Static testing can be applied to non-executable work products, while dynamic testing can only be applied to executable ones", "B": "Static testing finds defects directly, while dynamic testing causes failures whose defects are found through subsequent analysis", "C": "Static testing can measure quality characteristics not dependent on code execution (e.g., maintainability), while dynamic testing measures characteristics that depend on execution (e.g., performance efficiency)", "D": "Static testing and dynamic testing can never both detect the same underlying defect type"}, "correct": "D", "why_correct": "The syllabus says static and dynamic testing 'can both lead to the detection of defects', with some defect types findable only by one or the other \u2014 it never claims their defect-finding coverage is fully disjoint. The other three options are direct, accurate syllabus statements about their differences.", "option_notes": {"A": "This IS a genuine, syllabus-stated difference \u2014 not the answer.", "B": "This IS a genuine, syllabus-stated difference \u2014 not the answer.", "C": "This IS a genuine, syllabus-stated difference \u2014 not the answer.", "D": "Correct answer \u2014 overstates the actual relationship; some defect types can be found by either approach."}, "distractor_note": null, "alt_wording": "May ask 'which statement about static vs. dynamic testing is FALSE' instead of using EXCEPT \u2014 same trap, watch for the negation."}, {"id": "Q024", "chapter": "4.4", "topic": "Error Guessing vs. Exploratory Testing", "type": "C", "difficulty": "yellow", "question": "Which statement correctly distinguishes error guessing from exploratory testing?", "options": {"A": "Error guessing anticipates specific errors/defects/failures using prior knowledge (e.g., how the app failed before, common developer mistakes) to design targeted tests upfront; exploratory testing simultaneously designs, executes and evaluates tests while learning about the test object, often structured with test charters and time-boxed sessions", "B": "Error guessing and exploratory testing are two names for exactly the same technique", "C": "Exploratory testing always requires a fully detailed, pre-written test case for every test performed", "D": "Error guessing is a white-box technique, while exploratory testing is a black-box technique"}, "correct": "A", "why_correct": "Error guessing is anticipating errors/defects/failures based on the tester's knowledge (past application behavior, typical developer mistakes, failures in similar applications) to design targeted tests, often via 'fault attacks'. Exploratory testing instead simultaneously designs, executes, and evaluates tests while learning about the test object, frequently structured with session-based testing using test charters within a time box.", "option_notes": {"A": "Correct.", "B": "Incorrect \u2014 they are two distinct experience-based techniques with different processes, though both rely on tester knowledge/skill.", "C": "Incorrect \u2014 the defining feature of exploratory testing is the ABSENCE of fully pre-written test cases; tests are designed and executed together, in the moment.", "D": "Incorrect \u2014 both are experience-based techniques, not white-box or black-box."}, "distractor_note": null, "alt_wording": "May instead describe a 'fault attack' and ask which technique it belongs to (error guessing), or describe a 'test charter' and 'debriefing' and ask which technique that is (exploratory, session-based)."}, {"id": "Q049", "chapter": "5.1", "topic": "Prioritization with Dependencies and Resources", "type": "B", "difficulty": "red", "question": "A high-priority end-to-end payment test depends on a lower-priority account setup test because the payment cannot be attempted until a verified account exists. What should the test execution schedule do?", "options": {"A": "Run the high-priority payment test first because priority always overrides dependencies.", "B": "Run the lower-priority setup test first because the higher-priority test depends on it.", "C": "Skip the setup test because it is lower priority.", "D": "Run both tests randomly because dependencies are not considered in prioritization."}, "correct": "B", "why_correct": "The syllabus states that ideal priority ordering may not work when test cases or features have dependencies. If a higher-priority test case depends on a lower-priority test case, the lower-priority test case must be executed first.", "option_notes": {"A": "Incorrect - priority matters, but dependencies can constrain execution order.", "B": "Correct.", "C": "Incorrect - skipping the prerequisite would prevent the dependent test from being executed meaningfully.", "D": "Incorrect - dependencies and resource availability are explicitly considered when arranging the test execution schedule."}, "distractor_note": "This question checks whether you treat prioritization as a real schedule, not just a sorted list. Dependencies can force a lower-priority test to run earlier.", "alt_wording": "May mention resource availability instead of dependencies, such as an environment or specialist tester available only during a specific time window."}, {"id": "Q044", "chapter": "4.2", "topic": "3-Value Boundary Value Analysis", "type": "H", "difficulty": "red", "question": "An input field accepts whole-number quantities from 1 through 10 inclusive. Using 3-value boundary value analysis, which set of values gives 100% boundary coverage for this single valid range and its adjacent invalid partitions?", "options": {"A": "1, 10", "B": "0, 1, 10, 11", "C": "0, 1, 2, 9, 10, 11", "D": "1, 2, 9, 10"}, "correct": "C", "why_correct": "In 3-value BVA, each boundary has three coverage items: the boundary value and both of its closest neighbors. For the lower boundary 1, the values are 0, 1, and 2. For the upper boundary 10, the values are 9, 10, and 11. Together this gives 0, 1, 2, 9, 10, and 11.", "option_notes": {"A": "Incorrect - this exercises only the exact boundary values, not their neighbors.", "B": "Incorrect - this is closer to 2-value BVA, not 3-value BVA.", "C": "Correct.", "D": "Incorrect - it omits the adjacent invalid neighbors 0 and 11."}, "distractor_note": null, "alt_wording": "May ask for 2-value BVA instead; for this same range, 2-value BVA would use the boundary values and the closest neighbors in adjacent partitions: 0, 1, 10, and 11."}, {"id": "Q022", "chapter": "4.3", "topic": "Branch Coverage vs. Statement Coverage", "type": "F", "difficulty": "yellow", "question": "Consider the following two statements:\n\nI. Any test suite that achieves 100% branch coverage also achieves 100% statement coverage.\nII. Any test suite that achieves 100% statement coverage also achieves 100% branch coverage.\n\nWhich is correct?", "options": {"A": "Only I is correct", "B": "Only II is correct", "C": "Both I and II are correct", "D": "Neither I nor II is correct"}, "correct": "A", "why_correct": "The syllabus states branch coverage subsumes statement coverage: achieving 100% branch coverage also achieves 100% statement coverage, but not vice versa. So statement I is true and statement II is false \u2014 you can reach every statement without having exercised both outcomes of every decision (e.g., an 'if' with no 'else' branch containing no unique statements).", "option_notes": {"A": "Correct \u2014 branch coverage is the stronger criterion and subsumes statement coverage, but the reverse doesn't hold.", "B": "Incorrect \u2014 II is false; 100% statement coverage does not guarantee every branch (e.g., both true and false outcomes) was exercised.", "C": "Incorrect \u2014 II is false.", "D": "Incorrect \u2014 I is true."}, "distractor_note": null, "alt_wording": "May ask directly: 'which coverage criterion is stronger/subsumes the other' or give a small code snippet and ask which coverage level a given test suite achieves."}, {"id": "Q015", "chapter": "4.1", "topic": "Test Technique Categories", "type": "A", "difficulty": "green", "question": "A tester designs a test case purely from a requirements document, with no knowledge of how the feature is implemented internally. If the implementation changes later but the required behavior stays the same, the test case remains valid. Which category of test technique does this describe?", "options": {"A": "White-box (structure-based) test technique", "B": "Black-box (specification-based) test technique", "C": "Experience-based test technique", "D": "Static test technique"}, "correct": "B", "why_correct": "Black-box test techniques are based on an analysis of the specified behavior of the test object without reference to its internal structure, so test cases are independent of implementation \u2014 if the implementation changes but required behavior stays the same, the test cases remain useful. This is stated almost verbatim in the syllabus.", "option_notes": {"A": "Incorrect \u2014 white-box techniques are based on internal structure, so they can only be created after (and are dependent on) the design/implementation.", "B": "Correct.", "C": "Incorrect \u2014 experience-based techniques rely on tester knowledge/experience, not purely on a specification document.", "D": "Incorrect \u2014 'static' is a testing category (execution vs. no execution), not one of the three test-technique categories (black-box/white-box/experience-based)."}, "distractor_note": null, "alt_wording": "May instead ask you to distinguish the three technique categories directly, e.g., 'which technique category's effectiveness depends heavily on the tester's skill' (experience-based)."}]};
</script>
<script>
// ISTQB CTFL Mock Exam engine — self-contained, inlined by tools/render_exam.py.
// No questions are rendered into the visible DOM until the candidate clicks "Start Exam".
(function () {
  "use strict";

  var EXAM = window.__EXAM__;
  var STORAGE_KEY = "istqb-exam-state:" + EXAM.examId;
  var THEME_KEY = "istqb-exam-theme";
  var root = document.getElementById("app");
  var timerInterval = null;
  // Set once startOrResume() runs during THIS page load. Reloading the file always lands
  // back on the start/resume gate first — it never silently drops the candidate back into
  // a question — even if an earlier browser session had already clicked Start.
  var resumedThisSession = false;

  // ---------------------------------------------------------------- state
  function freshState() {
    return {
      phase: "not_started", // not_started | in_progress | submitted
      answers: {},          // { questionId: "A" }
      flags: {},             // { questionId: true }
      currentIndex: 0,
      deadline: null,        // ms epoch timestamp — remaining time is derived from this, not decremented,
      startedAt: null,       // so the clock keeps real wall-clock time even if the tab is closed and reopened
      submittedAt: null,
      timeUsedSeconds: null
    };
  }

  // Remaining seconds, computed from the stored deadline so it reflects real elapsed time
  // even across a closed tab / reloaded file, matching how a real proctored exam timer behaves.
  function computeRemaining() {
    if (!state.deadline) return EXAM.durationMinutes * 60;
    return Math.round((state.deadline - Date.now()) / 1000);
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      var parsed = JSON.parse(raw);
      return Object.assign(freshState(), parsed);
    } catch (e) {
      return freshState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage full / disabled — degrade silently */ }
  }

  var state = loadState();

  // ---------------------------------------------------------------- theme
  function applyTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  }
  function toggleTheme() {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
  }
  applyTheme();

  // ---------------------------------------------------------------- utils
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return; // omit — do not stringify to "null"
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function formatTime(totalSeconds) {
    var s = Math.max(0, totalSeconds);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function chapterNum(chapterCode) {
    return chapterCode.split(".")[0];
  }

  var CHAPTER_NAMES = {
    "1": "Fundamentals of Testing",
    "2": "Testing Throughout the SDLC",
    "3": "Static Testing",
    "4": "Test Analysis and Design",
    "5": "Managing the Test Activities",
    "6": "Test Tools"
  };

  function answeredCount() { return Object.keys(state.answers).length; }
  function flaggedCount() { return Object.keys(state.flags).filter(function (k) { return state.flags[k]; }).length; }

  // ---------------------------------------------------------------- render dispatch
  function render() {
    root.innerHTML = "";
    if (state.phase === "submitted") { renderResults(); return; }
    if (state.phase === "in_progress" && resumedThisSession) { renderExam(); return; }
    renderStart(); // covers not_started, and in_progress before the candidate has clicked Resume
  }

  // ---------------------------------------------------------------- start screen
  function renderStart() {
    stopTimer();
    var inProgress = state.phase === "in_progress";

    var shell = el("div", { class: "center-shell" });
    var card = el("div", { class: "card" });

    if (inProgress) {
      card.appendChild(el("div", { class: "resume-banner" }, [
        "An exam is already in progress (" + answeredCount() + "/" + EXAM.questions.length + " answered, " +
        formatTime(computeRemaining()) + " remaining). Starting over will discard that progress."
      ]));
    }

    card.appendChild(el("h1", { class: "start-title" }, [EXAM.title]));
    card.appendChild(el("p", { class: "start-sub" }, [
      "Generated " + EXAM.generated + " · Question bank v" + (EXAM.bankVersion || 1)
    ]));

    var meta = el("div", { class: "meta-grid" }, [
      metaTile(String(EXAM.questions.length), "Questions"),
      metaTile(EXAM.durationMinutes + " min", "Time Limit"),
      metaTile(EXAM.passMarkPct + "%", "Pass Mark"),
      metaTile(Math.round(EXAM.questions.length * EXAM.passMarkPct / 100) + "/" + EXAM.questions.length, "To Pass")
    ]);
    card.appendChild(meta);

    var rules = el("ul", { class: "rules-list" }, [
      el("li", {}, ["Every question has a single best answer. No answers or explanations are shown until you submit."]),
      el("li", {}, ["A countdown timer starts the moment you click Start and cannot be paused. The exam auto-submits at 00:00."]),
      el("li", {}, ["Use the question navigator to jump to any question in any order, and flag questions to revisit."]),
      el("li", {}, ["Your progress is saved in this browser automatically — closing the tab and reopening this file will resume where you left off."]),
      el("li", {}, ["After submitting, you can review the full solutions with explanations and export your results as a file."])
    ]);
    card.appendChild(rules);

    card.appendChild(el("button", {
      class: "big-btn", onclick: function () { startOrResume(inProgress); }
    }, [inProgress ? "Resume Exam" : "Start Exam"]));

    if (inProgress) {
      card.appendChild(el("button", {
        class: "big-btn secondary", style: "margin-top:10px;", onclick: function () {
          if (confirm("Discard your in-progress exam and start a fresh attempt?")) {
            state = freshState();
            saveState();
            render();
          }
        }
      }, ["Start Over Instead"]));
    }

    shell.appendChild(card);
    root.appendChild(topbar(false));
    root.appendChild(shell);
  }

  function metaTile(num, label) {
    return el("div", { class: "meta-tile" }, [
      el("span", { class: "num" }, [num]),
      el("span", { class: "label" }, [label])
    ]);
  }

  function startOrResume(wasInProgress) {
    if (!wasInProgress) {
      state = freshState();
      state.phase = "in_progress";
      state.startedAt = Date.now();
      state.deadline = state.startedAt + EXAM.durationMinutes * 60000;
    }
    resumedThisSession = true;
    saveState();
    render();
  }

  // ---------------------------------------------------------------- top bar
  function topbar(showTimer) {
    var bar = el("div", { class: "exam-topbar" }, [
      el("span", { class: "exam-title" }, [EXAM.title])
    ]);
    bar.appendChild(el("span", { class: "spacer" }));
    if (showTimer) {
      bar.appendChild(el("span", { class: "q-counter", id: "qCounter" }, [
        "Question " + (state.currentIndex + 1) + " of " + EXAM.questions.length
      ]));
      bar.appendChild(el("span", { class: "timer", id: "timerEl" }, [formatTime(computeRemaining())]));
    }
    bar.appendChild(el("button", { class: "icon-btn", title: "Toggle theme", onclick: toggleTheme }, ["\u{1F319}"]));
    return bar;
  }

  // ---------------------------------------------------------------- exam screen
  function renderExam() {
    var q = EXAM.questions[state.currentIndex];

    var layout = el("div", { class: "exam-layout" });
    layout.appendChild(renderNavigator());

    var main = el("div", { class: "exam-main" });
    var pct = ((state.currentIndex + 1) / EXAM.questions.length) * 100;
    main.appendChild(el("div", { class: "q-progress-bar" }, [
      el("div", { class: "q-progress-fill", style: "width:" + pct + "%" })
    ]));

    var headerRow = el("div", { class: "q-header-row" }, [
      el("span", { class: "q-num-badge" }, ["Q" + (state.currentIndex + 1)])
    ]);
    var isFlagged = !!state.flags[q.id];
    headerRow.appendChild(el("button", {
      class: "flag-btn" + (isFlagged ? " active" : ""),
      onclick: function () {
        if (state.flags[q.id]) delete state.flags[q.id];
        else state.flags[q.id] = true;
        saveState();
        render();
      }
    }, [(isFlagged ? "\u{1F6A9} Flagged" : "\u{1F6A9} Flag for review")]));
    main.appendChild(headerRow);

    main.appendChild(el("p", { class: "q-text" }, [q.question]));

    var optionsWrap = el("div", { class: "options" });
    ["A", "B", "C", "D"].forEach(function (letter) {
      if (!q.options[letter]) return;
      var selected = state.answers[q.id] === letter;
      var row = el("label", { class: "option-row" + (selected ? " selected" : "") }, [
        el("input", {
          type: "radio", name: "q_" + q.id, checked: selected ? "checked" : null,
          onchange: function () {
            state.answers[q.id] = letter;
            saveState();
            render();
          }
        }),
        el("span", { class: "option-letter" }, [letter + "."]),
        el("span", { class: "option-text" }, [q.options[letter]])
      ]);
      optionsWrap.appendChild(row);
    });
    main.appendChild(optionsWrap);
    layout.appendChild(main);

    var footer = el("div", { class: "exam-footer" }, [
      el("button", {
        class: "nav-action-btn", disabled: state.currentIndex === 0 ? "disabled" : null,
        onclick: function () { state.currentIndex = Math.max(0, state.currentIndex - 1); saveState(); render(); }
      }, ["← Previous"]),
      el("button", {
        class: "nav-action-btn", disabled: state.currentIndex === EXAM.questions.length - 1 ? "disabled" : null,
        onclick: function () { state.currentIndex = Math.min(EXAM.questions.length - 1, state.currentIndex + 1); saveState(); render(); }
      }, ["Next →"]),
      el("button", { class: "submit-btn", onclick: openSubmitModal }, ["Submit Exam"])
    ]);

    root.appendChild(topbar(true));
    root.appendChild(layout);
    root.appendChild(footer);
    startTimer();
    updateTimerDisplay();
  }

  function renderNavigator() {
    var nav = el("div", { class: "navigator" });
    nav.appendChild(el("h4", {}, ["Questions"]));
    var grid = el("div", { class: "nav-grid" });
    EXAM.questions.forEach(function (q, i) {
      var classes = ["nav-btn"];
      if (state.answers[q.id]) classes.push("answered");
      if (state.flags[q.id]) classes.push("flagged");
      if (i === state.currentIndex) classes.push("current");
      grid.appendChild(el("button", {
        class: classes.join(" "),
        onclick: function () { state.currentIndex = i; saveState(); render(); }
      }, [String(i + 1)]));
    });
    nav.appendChild(grid);
    nav.appendChild(el("div", { class: "nav-legend" }, [
      el("div", {}, [el("span", { class: "dot answered" }), "Answered"]),
      el("div", {}, [el("span", { class: "dot flagged" }), "Flagged"]),
      el("div", {}, [el("span", { class: "dot unanswered" }), "Unanswered"])
    ]));
    return nav;
  }

  // ---------------------------------------------------------------- timer
  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(function () {
      if (computeRemaining() <= 0) {
        submitExam(true);
        return;
      }
      updateTimerDisplay();
    }, 1000);
  }
  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
  function updateTimerDisplay() {
    var timerEl = document.getElementById("timerEl");
    if (!timerEl) return;
    var remaining = computeRemaining();
    timerEl.textContent = formatTime(remaining);
    timerEl.classList.remove("warn", "critical");
    if (remaining <= 300) timerEl.classList.add("critical");
    else if (remaining <= 600) timerEl.classList.add("warn");
    var counter = document.getElementById("qCounter");
    if (counter) counter.textContent = "Question " + (state.currentIndex + 1) + " of " + EXAM.questions.length;
  }

  // ---------------------------------------------------------------- submit
  function openSubmitModal() {
    var total = EXAM.questions.length;
    var answered = answeredCount();
    var unanswered = total - answered;
    var flagged = flaggedCount();

    var overlay = el("div", { class: "modal-overlay", onclick: function (e) { if (e.target === overlay) overlay.remove(); } });
    var modal = el("div", { class: "modal" }, [
      el("h3", {}, ["Submit exam?"]),
      el("p", {}, ["Once submitted, the timer stops and you cannot change any answers."]),
      el("div", { class: "modal-stats" }, [
        modalStat(String(answered), "Answered"),
        modalStat(String(unanswered), "Unanswered"),
        modalStat(String(flagged), "Flagged")
      ]),
      el("div", { class: "modal-actions" }, [
        el("button", { class: "nav-action-btn", onclick: function () { overlay.remove(); } }, ["Keep Working"]),
        el("button", { class: "submit-btn", onclick: function () { overlay.remove(); submitExam(false); } }, ["Submit Now"])
      ])
    ]);
    overlay.appendChild(modal);
    root.appendChild(overlay);
  }
  function modalStat(n, l) {
    return el("div", { class: "modal-stat" }, [el("span", { class: "n" }, [n]), el("span", { class: "l" }, [l])]);
  }

  function submitExam(auto) {
    stopTimer();
    state.phase = "submitted";
    state.submittedAt = Date.now();
    var maxSeconds = EXAM.durationMinutes * 60;
    var usedSeconds = state.startedAt ? Math.round((state.submittedAt - state.startedAt) / 1000) : maxSeconds;
    state.timeUsedSeconds = Math.min(maxSeconds, Math.max(0, usedSeconds));
    saveState();
    render();
    if (auto) {
      setTimeout(function () { alert("Time's up — your exam was submitted automatically."); }, 50);
    }
  }

  // ---------------------------------------------------------------- results
  function scoreExam() {
    var total = EXAM.questions.length;
    var correct = 0;
    var byChapter = {};
    EXAM.questions.forEach(function (q) {
      var cn = chapterNum(q.chapter);
      if (!byChapter[cn]) byChapter[cn] = { correct: 0, total: 0 };
      byChapter[cn].total += 1;
      var isCorrect = state.answers[q.id] === q.correct;
      if (isCorrect) { correct += 1; byChapter[cn].correct += 1; }
    });
    return { total: total, correct: correct, pct: Math.round((correct / total) * 1000) / 10, byChapter: byChapter };
  }

  function renderResults() {
    stopTimer();
    var score = scoreExam();
    var pass = score.pct >= EXAM.passMarkPct;

    var shell = el("div", { class: "center-shell" });
    var card = el("div", { class: "card" });

    card.appendChild(el("div", { class: "score-circle " + (pass ? "pass" : "fail") }, [
      el("span", { class: "pct" }, [score.pct + "%"]),
      el("span", { class: "frac" }, [score.correct + " / " + score.total])
    ]));
    var wrap = el("div", {});
