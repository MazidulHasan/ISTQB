}
.sol-badge.correct { background: var(--green-bg); color: var(--green); }
.sol-badge.incorrect { background: var(--red-bg); color: var(--red); }
.sol-badge.unanswered { background: var(--surface-2); color: var(--text-muted); }
.sol-tag { font-size: 0.76rem; color: var(--text-muted); }
.sol-q { font-weight: 600; margin: 0 0 14px; white-space: pre-line; line-height: 1.55; }
.sol-note {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-note strong {
  display: block;
  margin-bottom: 5px;
  color: var(--text-muted);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-note p {
  margin: 0;
  white-space: pre-line;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.88rem;
  line-height: 1.5;
}
.sol-marker-box {
  background: var(--marker-bg);
  border: 1px solid color-mix(in srgb, var(--marker) 55%, var(--border));
  border-radius: 8px;
  margin: 0 0 14px;
  padding: 10px 12px;
}
.sol-marker-box > strong {
  display: block;
  margin-bottom: 6px;
  color: var(--marker);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.sol-marker-item {
  display: grid;
  grid-template-columns: minmax(120px, 0.36fr) minmax(0, 1fr);
  gap: 10px;
  font-size: 0.88rem;
  line-height: 1.45;
  padding: 5px 0;
}
.sol-marker-item + .sol-marker-item { border-top: 1px solid color-mix(in srgb, var(--marker) 30%, transparent); }
.sol-marker-term { font-weight: 700; }
.sol-marker-note { color: var(--text-muted); }
.sol-option {
  display: flex; gap: 10px; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.92rem; line-height: 1.5;
  border: 1px solid transparent;
}
.sol-option.is-correct { background: var(--green-bg); border-color: var(--green); }
.sol-option.is-your-wrong { background: var(--red-bg); border-color: var(--red); }
.sol-option-mark { font-weight: 700; flex-shrink: 0; }
.sol-block { margin-top: 12px; font-size: 0.92rem; line-height: 1.6; }
.sol-block h5 { margin: 14px 0 4px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
.sol-block p { margin: 0 0 6px; }

.jump-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; }
.jump-nav a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; font-size: 0.75rem;
  text-decoration: none; border: 1px solid var(--border); color: var(--text);
}
.jump-nav a.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.jump-nav a.incorrect { background: var(--red-bg); border-color: var(--red); color: var(--red); }

.footer-note { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 30px; }
.footer-note + .footer-note { margin-top: 8px; }

</style>

<script>
window.__EXAM__ = {"examId": "2026-09-03-hard-01", "title": "ISTQB CTFL v4.0.1 - Hard Mock Exam", "generated": "2026-09-03", "durationMinutes": 75, "passMarkPct": 65, "bankVersion": 1, "variant": "hard", "questions": [{"id": "Q321", "chapter": "5.1", "topic": "Entry Criteria and Exit Criteria", "type": "C", "difficulty": "red", "question": "A Scrum team says a user story may enter development only if acceptance criteria are testable and required test data is available. It says the story may be considered releasable only after planned tests are executed and critical defects are resolved or accepted by stakeholders. What are these criteria called in Agile terms?", "options": {"A": "Definition of Done, then Definition of Ready", "B": "Definition of Ready, then Definition of Done", "C": "Risk register, then test completion report", "D": "Test basis, then test object"}, "correct": "B", "why_correct": "Entry criteria define preconditions for starting an activity. In Agile, entry criteria for a user story are often called Definition of Ready. Exit criteria define what must be achieved to declare completion. In Agile, exit criteria for a releasable item are often called Definition of Done.", "option_notes": {"A": "Incorrect. It reverses ready and done.", "B": "Correct. Ready maps to entry criteria; Done maps to exit criteria.", "C": "Incorrect. These are different test management work products.", "D": "Incorrect. These terms refer to what testing is based on and what is tested."}, "distractor_note": "Ready and done sound intuitive, but exam options often swap them. Ready is before work; done is completion.", "alt_wording": "How do entry and exit criteria map to Definition of Ready and Definition of Done?"}, {"id": "Q299", "chapter": "2.1", "topic": "Shift Left", "type": "E", "difficulty": "red", "question": "Which activity is NOT a good example of shift left in testing?", "options": {"A": "Reviewing draft requirements from a tester's perspective before coding starts", "B": "Writing component tests before or during code implementation", "C": "Starting static analysis before dynamic testing or as part of CI", "D": "Postponing all non-functional testing until a complete production-like system exists"}, "correct": "D", "why_correct": "Shift left means performing testing earlier in the SDLC, such as early reviews, test-first practices, static analysis in CI, and where possible early non-functional testing at component level. It does not mean neglecting later testing, but postponing all non-functional testing is the opposite of the shift-left idea.", "option_notes": {"A": "Incorrect. This is a shift-left practice.", "B": "Incorrect. Test-first/component testing during implementation supports shift left.", "C": "Incorrect. Early static analysis is a shift-left example.", "D": "Correct. It delays testing rather than moving it earlier."}, "distractor_note": "Some non-functional testing needs a representative environment, but CTFL explicitly says starting it earlier where possible is a shift-left practice.", "alt_wording": "Which practice contradicts the shift-left principle?"}, {"id": "Q314", "chapter": "4.2", "topic": "State Transition Coverage Strength", "type": "F", "difficulty": "red", "question": "Which TWO statements about state transition coverage are correct?\n\nI. Full valid transitions coverage guarantees full all states coverage.\nII. Full all states coverage guarantees full valid transitions coverage.\nIII. Full all transitions coverage includes attempting invalid transitions shown in a state table.\nIV. Invalid transitions should preferably be grouped many at a time in one test case to avoid defect masking.", "options": {"A": "I and III", "B": "I and IV", "C": "II and III", "D": "II and IV"}, "correct": "A", "why_correct": "Valid transitions coverage is stronger than all states coverage, so full valid transitions coverage guarantees all states coverage. All transitions coverage includes valid transitions and attempts to execute invalid transitions. For invalid transitions, testing only one invalid transition in a single test case helps avoid defect masking.", "option_notes": {"A": "Correct. Statements I and III are true.", "B": "Incorrect. Statement IV says the opposite of the syllabus guidance.", "C": "Incorrect. Statement II reverses the coverage relationship.", "D": "Incorrect. Both II and IV are false."}, "distractor_note": "Coverage relationships are a common hard-exam trap: stronger coverage implies weaker coverage, not the reverse.", "alt_wording": "Which state transition coverage criterion is stronger, and how are invalid transitions handled?"}, {"id": "Q297", "chapter": "1.5", "topic": "Independence of Testing", "type": "D", "difficulty": "red", "question": "A safety-critical device team wants independent evidence but also needs rapid feedback from developers who know the code. Which approach is MOST consistent with the CTFL view of independence?", "options": {"A": "Use only external testers, because developers cannot find defects in their own work", "B": "Use multiple independence levels, such as developer component tests plus independent system testing", "C": "Use only author testing, because independence usually creates delays and should be avoided", "D": "Move all testing to business users, because acceptance testing replaces technical testing"}, "correct": "B", "why_correct": "CTFL says independence can help testers find different defects due to different backgrounds and biases, but it is not a replacement for familiarity. For many projects it is best to combine multiple levels of independence, such as developers testing their own components and independent testers handling higher-level testing.", "option_notes": {"A": "Incorrect. Developers can efficiently find many defects in their own code.", "B": "Correct. It balances independence with technical familiarity.", "C": "Incorrect. Independence has benefits, especially when stronger evidence is needed.", "D": "Incorrect. Acceptance testing does not replace component, integration, system, or technical testing."}, "distractor_note": "Hard independence questions often use absolutes. CTFL favors context-sensitive combinations, not one universal independence level.", "alt_wording": "What is the best testing independence strategy when both objectivity and product knowledge matter?"}, {"id": "Q320", "chapter": "4.5", "topic": "Acceptance Test-Driven Development", "type": "D", "difficulty": "red", "question": "In an ATDD workshop, customers, developers and testers agree acceptance criteria for a prescription-renewal story before implementation. Which test case is BEST aligned with ATDD?", "options": {"A": "A test derived from the acceptance criteria before development, covering a business-readable example of renewal approval or rejection", "B": "A code-only unit test written after development to increase statement coverage", "C": "A random exploratory note created after release with no link to acceptance criteria", "D": "A defect report template for any anomaly found during system testing"}, "correct": "A", "why_correct": "ATDD is a test-first approach in which test cases are created before implementing the user story and are derived from acceptance criteria, with perspectives from customers, developers and testers. The test should express accepted behavior of the story.", "option_notes": {"A": "Correct. It matches pre-implementation, acceptance criteria, and multiple perspectives.", "B": "Incorrect. A code-only unit test after development is closer to ordinary unit testing, not ATDD.", "C": "Incorrect. Exploratory notes after release are not ATDD test derivation.", "D": "Incorrect. A defect report template is not an acceptance test case."}, "distractor_note": "ATDD can produce executable tests, but the defining clue is acceptance criteria before implementation, not code coverage after implementation.", "alt_wording": "Which test case is derived from acceptance criteria as part of acceptance test-driven development?"}, {"id": "Q324", "chapter": "5.1", "topic": "Testing Quadrants", "type": "C", "difficulty": "red", "question": "Which pairing of Agile testing quadrant and example is MOST accurate?", "options": {"A": "Q1: business-facing exploratory usability testing that critiques the product", "B": "Q2: business-facing story tests and examples that support the team", "C": "Q3: technology-facing component tests included in CI", "D": "Q4: business-facing acceptance criteria examples used to guide development"}, "correct": "B", "why_correct": "Q2 is business facing and supports the team; it includes functional tests, examples, user story tests, prototypes, API testing and simulations that check acceptance criteria. Q1 is technology facing and supports the team; Q3 is business facing and critiques the product; Q4 is technology facing and critiques the product.", "option_notes": {"A": "Incorrect. That describes Q3, not Q1.", "B": "Correct. Q2 supports the team from a business-facing perspective.", "C": "Incorrect. Component tests in CI are Q1.", "D": "Incorrect. Acceptance criteria examples guiding development are Q2, not Q4."}, "distractor_note": "Keep the two axes separate: business vs technology facing, and support the team vs critique the product.", "alt_wording": "Classify examples into the Agile testing quadrants."}, {"id": "Q316", "chapter": "4.3", "topic": "Branch Coverage", "type": "H", "difficulty": "red", "question": "A control flow graph has 18 branches. A test suite has exercised 15 of them and all 10 executable statements. What is the branch coverage?", "options": {"A": "56%", "B": "83%", "C": "100%", "D": "Branch coverage cannot be lower than statement coverage"}, "correct": "B", "why_correct": "Branch coverage is exercised branches divided by total branches. The calculation is 15/18 = 83.3%, usually rounded to 83%. 100% statement coverage does not imply 100% branch coverage.", "option_notes": {"A": "Incorrect. This does not match the branch calculation.", "B": "Correct. 15 of 18 branches is about 83%.", "C": "Incorrect. Three branches are unexercised.", "D": "Incorrect. 100% statement coverage can occur without 100% branch coverage."}, "distractor_note": "Branch coverage subsumes statement coverage only at 100% branch coverage, not the other way around.", "alt_wording": "How do you calculate branch coverage when statement coverage is already complete?"}, {"id": "Q295", "chapter": "1.4", "topic": "Test Activities", "type": "C", "difficulty": "red", "question": "A tester derives measurable coverage criteria from acceptance criteria, identifies that payment refunds need tests for approved, rejected and pending states, and only later writes specific input values and expected results. Which activity is mainly being performed first?", "options": {"A": "Test analysis", "B": "Test implementation", "C": "Test execution", "D": "Test completion"}, "correct": "A", "why_correct": "Test analysis answers 'what to test?' by analyzing the test basis, identifying test conditions, assessing testability, and deriving measurable coverage criteria. Writing detailed test cases, test data, and procedures is part of later design and implementation activities.", "option_notes": {"A": "Correct. The clues are coverage criteria and test conditions derived from the test basis.", "B": "Incorrect. Implementation creates or acquires testware needed for execution, such as procedures, scripts, suites, and data.", "C": "Incorrect. Execution runs tests and compares actual with expected results.", "D": "Incorrect. Completion archives testware, reports lessons learned, and closes a test activity."}, "distractor_note": "Questions often blur analysis, design, and implementation. 'What to test?' points to analysis; 'how to test?' points to design.", "alt_wording": "Which test activity identifies test conditions and coverage items before detailed test cases are created?"}, {"id": "Q313", "chapter": "4.2", "topic": "State Transition Testing", "type": "H", "difficulty": "red", "question": "A ticket can be in New, Assigned, In Progress or Closed. A test suite visits New, Assigned and Closed, but never In Progress. What is the all states coverage?", "options": {"A": "25%", "B": "50%", "C": "75%", "D": "100%"}, "correct": "C", "why_correct": "All states coverage is the number of exercised states divided by the total number of states. Three of four states are exercised, so coverage is 3/4 = 75%.", "option_notes": {"A": "Incorrect. One state is missed, not one covered.", "B": "Incorrect. Three states are visited.", "C": "Correct. Three of four states gives 75%.", "D": "Incorrect. In Progress is not covered."}, "distractor_note": "All states coverage ignores whether every transition was covered. It only asks which states were exercised.", "alt_wording": "What percentage of states has been exercised by the test sequence?"}, {"id": "Q306", "chapter": "3.2", "topic": "Review Process Activities", "type": "D", "difficulty": "red", "question": "During a requirements review, participants discuss logged anomalies, decide whether each is a defect, assign ownership and agree whether a follow-up review is needed. Which review process activity is mainly taking place?", "options": {"A": "Planning", "B": "Review initiation", "C": "Individual review", "D": "Communication and analysis"}, "correct": "D", "why_correct": "Communication and analysis is where anomalies are analyzed and discussed, decisions are made about status, ownership and required actions, the quality level is considered, and follow-up actions may be agreed.", "option_notes": {"A": "Incorrect. Planning defines scope, objectives, quality characteristics, exit criteria, effort and schedule.", "B": "Incorrect. Review initiation ensures participants have access, understand roles, and are ready to start.", "C": "Incorrect. Individual review is where reviewers separately examine the work product and log anomalies, questions and recommendations.", "D": "Correct. The clue is discussion, classification, ownership and follow-up decisions."}, "distractor_note": "Do not classify every meeting as planning. The content of the meeting matters.", "alt_wording": "Which review activity analyzes anomalies and decides their status and required actions?"}, {"id": "Q330", "chapter": "5.5", "topic": "Defect Report Content", "type": "D", "difficulty": "red", "question": "A tester reports: \"Checkout is broken and needs fixing urgently.\" Which improvement would BEST align the report with CTFL defect report guidance for a dynamic testing anomaly?", "options": {"A": "Add objective context such as test object/version, environment, test case, steps, data, expected and actual results, evidence, severity, priority, status and references", "B": "Remove reproduction details because debugging is the developer's job", "C": "Replace the report with a risk register entry because anomalies are always product risks", "D": "Set severity and priority to the same value because they are synonyms"}, "correct": "A", "why_correct": "A defect report should provide enough information to reproduce, classify, analyze and resolve the anomaly, as well as support quality tracking and process improvement. For dynamic testing this includes context, test object and environment, steps/data/evidence, expected and actual results, severity, priority, status and references.", "option_notes": {"A": "Correct. It makes the report actionable and traceable.", "B": "Incorrect. Reproduction details are essential even though debugging is separate.", "C": "Incorrect. Anomalies may become defects, false positives or change requests; they still need defect management.", "D": "Incorrect. Severity is impact; priority is urgency/order for fixing."}, "distractor_note": "A short angry title is not enough. Good defect reports are objective, reproducible and useful for resolution.", "alt_wording": "Which information should be included in a defect report from dynamic testing?"}, {"id": "Q329", "chapter": "5.4", "topic": "Configuration Management", "type": "D", "difficulty": "red", "question": "A test environment configuration is approved for release-candidate testing. Later, a database image, service stub version and browser version must be changed. What should happen according to configuration management support for testing?", "options": {"A": "The environment may be changed informally as long as the tests still run", "B": "The approved baseline should be changed only through formal change control, with versions and relationships tracked", "C": "Only source code requires version control; environments are not configuration items", "D": "The previous baseline should be deleted so earlier test results cannot be reproduced"}, "correct": "B", "why_correct": "For a complex configuration item such as a test environment, configuration management records component items, relationships and versions. Once approved for testing, it becomes a baseline and can be changed only through formal change control. CM also supports reverting to previous baselines to reproduce results.", "option_notes": {"A": "Incorrect. Informal changes undermine baseline integrity and repeatability.", "B": "Correct. It captures baseline control, versioning and traceability.", "C": "Incorrect. Test environments and testware can be configuration items.", "D": "Incorrect. Keeping previous baselines supports reproduction of prior results."}, "distractor_note": "Configuration management is not only for code; it protects the integrity of test items, testware, environments and results.", "alt_wording": "How does CM handle changes to an approved test environment baseline?"}, {"id": "Q322", "chapter": "5.1", "topic": "Three-Point Estimation", "type": "H", "difficulty": "red", "question": "For a data-migration test task, experts estimate optimistic a = 12 hours, most likely m = 18 hours, and pessimistic b = 42 hours. Using the CTFL three-point formula, what are E and SD?", "options": {"A": "E = 24 hours, SD = 5 hours", "B": "E = 21 hours, SD = 5 hours", "C": "E = 18 hours, SD = 30 hours", "D": "E = 72 hours, SD = 6 hours"}, "correct": "B", "why_correct": "The CTFL three-point estimate is E = (a + 4*m + b) / 6. Here E = (12 + 4*18 + 42) / 6 = (12 + 72 + 42) / 6 = 126/6 = 21 hours. The standard deviation is SD = (b - a) / 6 = (42 - 12) / 6 = 5 hours.", "option_notes": {"A": "Incorrect. This likely uses a simple average for E.", "B": "Correct. It applies both weighted mean and SD formulas.", "C": "Incorrect. It confuses the most likely estimate with E and the range with SD.", "D": "Incorrect. It does not divide the weighted sum by 6."}, "distractor_note": "Hard estimation questions often mix simple average, weighted average, range, and SD.", "alt_wording": "Calculate the weighted three-point estimate and estimation error."}, {"id": "Q300", "chapter": "2.2", "topic": "Test Levels", "type": "B", "difficulty": "red", "question": "A retailer's checkout service works internally, but the team now tests how it exchanges order, payment, fraud-screening and shipping messages with external providers in an environment similar to production. Which test level is MOST directly described?", "options": {"A": "Component integration testing", "B": "System testing", "C": "System integration testing", "D": "User acceptance testing"}, "correct": "C", "why_correct": "System integration testing focuses on interfaces between the system under test and other systems or external services, preferably in an environment similar to the operational environment. The scenario is about external provider interactions rather than internal component interfaces or user validation.", "option_notes": {"A": "Incorrect. Component integration testing focuses on interfaces between components.", "B": "Incorrect. System testing focuses on overall behavior and capabilities of the complete system.", "C": "Correct. External systems/services and production-like integration are the clues.", "D": "Incorrect. Acceptance testing focuses on validation and readiness for deployment from the user/business perspective."}, "distractor_note": "The word 'integration' alone is not enough. Look for components inside the system versus the system interacting with external systems.", "alt_wording": "Which test level tests interfaces between the system under test and other systems?"}, {"id": "Q319", "chapter": "4.5", "topic": "Acceptance Criteria Formats", "type": "C", "difficulty": "red", "question": "A team documents one acceptance criterion as \"Given an inactive card, When the customer tries to withdraw cash, Then the ATM keeps the card and shows a contact-bank message.\" Another criterion is a table mapping card status and PIN status to allowed actions. Which formats are used, in order?", "options": {"A": "Rule-oriented, then scenario-oriented", "B": "Scenario-oriented, then rule-oriented", "C": "Exploratory, then white-box", "D": "Technical review, then inspection"}, "correct": "B", "why_correct": "Given/When/Then expresses a scenario-oriented acceptance criterion. A table mapping input conditions to outcomes is a rule-oriented acceptance criterion, such as an input-output mapping.", "option_notes": {"A": "Incorrect. It reverses the two formats.", "B": "Correct. Given/When/Then is scenario-oriented; the mapping table is rule-oriented.", "C": "Incorrect. These are not technique categories in this context.", "D": "Incorrect. Review types are not acceptance criteria formats."}, "distractor_note": "BDD-style language uses scenarios, while tables and verification lists are commonly rule-oriented.", "alt_wording": "Classify Given/When/Then and input-output mapping acceptance criteria formats."}, {"id": "Q318", "chapter": "4.4", "topic": "Checklist-Based Testing", "type": "E", "difficulty": "red", "question": "Which item would be LEAST suitable for a checklist used in checklist-based testing?", "options": {"A": "Can each mandatory field reject blank input independently?", "B": "Does the screen preserve user-entered values after a validation error?", "C": "Has the test environment met all entry criteria before testing starts?", "D": "Can keyboard-only users complete the form without losing focus?"}, "correct": "C", "why_correct": "Checklist items should be directly and separately checkable test conditions, often phrased as questions. The syllabus warns that checklists should not contain items better suited as entry criteria, exit criteria, items too general, or items that can be checked automatically.", "option_notes": {"A": "Incorrect. This is a directly testable checklist item.", "B": "Incorrect. This is a concrete behavior to check.", "C": "Correct. This is better suited as an entry criterion than a checklist test condition.", "D": "Incorrect. This is a directly checkable usability/accessibility-oriented item."}, "distractor_note": "Checklist-based testing and entry criteria both use lists, but their purposes differ.", "alt_wording": "Which checklist entry belongs outside a testing checklist because it is really an entry criterion?"}, {"id": "Q331", "chapter": "6.2", "topic": "Benefits and Risks of Test Automation", "type": "F", "difficulty": "red", "question": "Which TWO statements about test automation are realistic according to CTFL?\n\nI. Automation can reduce repetitive manual work and provide faster feedback.\nII. Acquiring a tool guarantees lasting benefits without maintenance or training.\nIII. Automation can free testers to design deeper tests, but overreliance can reduce human critical thinking.\nIV. Manual testing is no longer needed when DevOps has a large automated regression suite.", "options": {"A": "I and III", "B": "I and IV", "C": "II and III", "D": "II and IV"}, "correct": "A", "why_correct": "Automation can save time on repetitive work, improve consistency, provide objective measures, shorten execution time and give faster feedback. It may also free testers for deeper test design. However, tools require introduction, maintenance and training, and overreliance on tools or ignoring human critical thinking is a risk. Manual testing, especially from the user's perspective, can still be needed.", "option_notes": {"A": "Correct. Both statements balance realistic benefits and risks.", "B": "Incorrect. Statement IV is an automation overclaim.", "C": "Incorrect. Statement II is false because tools do not guarantee benefits without effort.", "D": "Incorrect. Both II and IV are false."}, "distractor_note": "Hard automation questions often use exaggerated claims. CTFL frames automation as valuable but effortful and not a replacement for human judgment.", "alt_wording": "Which automation claims are benefits, and which are risks or unrealistic expectations?"}, {"id": "Q301", "chapter": "2.2", "topic": "Test Types", "type": "F", "difficulty": "red", "question": "Which TWO statements about test types are correct?\n\nI. Functional testing checks what the test object should do.\nII. Non-functional testing can sometimes use functional tests while checking constraints such as response time.\nIII. Black-box testing requires knowledge of the internal code structure.\nIV. White-box testing derives tests only from user-visible requirements.", "options": {"A": "I and II", "B": "I and III", "C": "II and IV", "D": "III and IV"}, "correct": "A", "why_correct": "Functional testing evaluates the functions a component or system should perform. Non-functional testing evaluates how well the system behaves and may derive tests from functional tests while checking constraints such as performance. Black-box testing is based on specified behavior without internal structure; white-box testing is based on implementation or internal structure.", "option_notes": {"A": "Correct. Statements I and II match the syllabus.", "B": "Incorrect. Statement III reverses black-box and white-box.", "C": "Incorrect. Statement IV reverses white-box and black-box.", "D": "Incorrect. Both III and IV are false."}, "distractor_note": "This targets the common mix-up between test type labels: functional/non-functional describe quality focus; black-box/white-box describe basis for deriving tests.", "alt_wording": "Which pair correctly describes functional, non-functional, black-box and white-box testing?"}, {"id": "Q315", "chapter": "4.3", "topic": "Statement Coverage", "type": "D", "difficulty": "red", "question": "A team has 100% statement coverage for a calculation function. Which conclusion is MOST defensible?", "options": {"A": "Every executable statement has been exercised at least once, but some branch or data-dependent defects may still remain", "B": "All decision outcomes and all paths through the function have necessarily been tested", "C": "All missing requirements in the function have been detected", "D": "The function contains no defects because every statement was executed"}, "correct": "A", "why_correct": "100% statement coverage means every executable statement has been exercised at least once. It does not guarantee all branches, paths, data combinations, or defects of omission have been tested, and executing a defective statement may not always reveal the defect.", "option_notes": {"A": "Correct. It states the achievement and the limitation.", "B": "Incorrect. Statement coverage does not imply branch or path coverage.", "C": "Incorrect. Missing requirements are defects of omission and may not be detected by structure-based tests.", "D": "Incorrect. Coverage does not prove absence of defects."}, "distractor_note": "Coverage is evidence about what has been exercised, not proof that every exercised item is correct.", "alt_wording": "What can and cannot be concluded from 100% statement coverage?"}, {"id": "Q328", "chapter": "5.3", "topic": "Test Progress Report vs Test Completion Report", "type": "E", "difficulty": "red", "question": "Which item is MORE characteristic of a test progress report than a test completion report?", "options": {"A": "Testing planned for the next reporting period", "B": "Lessons learned from the completed test level", "C": "Final evaluation against original exit criteria", "D": "Summary of unmitigated risks and defects not fixed at closure"}, "correct": "A", "why_correct": "Test progress reports are produced during testing to support monitoring and control. They include the testing period, progress, impediments, metrics, changed risks, and testing planned for the next period. Test completion reports summarize a completed activity and include closure evaluation, deviations, unmitigated risks, defects not fixed, and lessons learned.", "option_notes": {"A": "Correct. Looking ahead to the next period is progress-report content.", "B": "Incorrect. Lessons learned are typical completion-report content.", "C": "Incorrect. Final evaluation against original plan/exit criteria belongs to completion reporting.", "D": "Incorrect. Closure risks and unfixed defects are typical completion-report content."}, "distractor_note": "Both report types can contain metrics and risks. Timing and audience purpose distinguish them.", "alt_wording": "Which report supports ongoing control rather than end-of-activity closure?"}, {"id": "Q308", "chapter": "4.2", "topic": "Equivalence Partitioning", "type": "H", "difficulty": "red", "question": "A shipping calculator accepts package weight in kg with these partitions: invalid below 0, valid 0 through 5, valid over 5 through 20, valid over 20 through 50, and invalid over 50. A test set uses weights -1, 0, 10 and 60. What is the EP coverage?", "options": {"A": "60%", "B": "80%", "C": "100%", "D": "Cannot be determined because boundary values were not tested"}, "correct": "B", "why_correct": "The coverage items for equivalence partitioning are the partitions. There are five partitions. The tests cover below 0, 0 through 5, over 5 through 20, and over 50. They do not cover over 20 through 50. Coverage is 4/5 = 80%.", "option_notes": {"A": "Incorrect. Three partitions would be 60%, but four are exercised.", "B": "Correct. Four of five partitions are covered.", "C": "Incorrect. The 20-50 valid partition is missing.", "D": "Incorrect. EP coverage can be measured independently of whether BVA was applied."}, "distractor_note": "The values 0 and 60 may draw attention to boundaries, but the technique asked is EP, where partitions are the coverage items.", "alt_wording": "How many equivalence partitions have been exercised by the selected test data?"}, {"id": "Q293", "chapter": "1.2", "topic": "Testing, Quality Control, and Quality Assurance", "type": "C", "difficulty": "red", "question": "A release manager says, \"Our tests passed, so quality assurance is complete.\" Which response is MOST accurate according to CTFL terminology?", "options": {"A": "Correct, because testing and quality assurance are synonyms when performed before release", "B": "Incorrect, because testing is a form of quality control, while quality assurance is broader and process-oriented", "C": "Correct, because quality assurance means finding all defects before users see them", "D": "Incorrect, because testing belongs only to debugging and not to quality management"}, "correct": "B", "why_correct": "Testing is one quality control activity because it evaluates work products and detects defects. Quality assurance is broader and focuses on whether appropriate processes are defined, implemented, and improved. Passing tests gives useful quality information but does not mean quality assurance is complete.", "option_notes": {"A": "Incorrect. Testing and QA are related but not synonyms.", "B": "Correct. It distinguishes product/work-product evaluation from broader process assurance.", "C": "Incorrect. Neither testing nor QA can prove all defects are absent.", "D": "Incorrect. Testing is not debugging; it is part of quality control."}, "distractor_note": "The wording tempts you to equate any quality activity with QA. CTFL separates quality control activities such as testing from quality assurance activities focused on process.", "alt_wording": "How does testing relate to quality assurance and quality control?"}, {"id": "Q305", "chapter": "3.2", "topic": "Review Types", "type": "C", "difficulty": "red", "question": "A medical software team needs a highly formal review with the full generic process, collected metrics, and a rule that the author must not act as review leader or scribe. Which review type is BEST described?", "options": {"A": "Informal review", "B": "Walkthrough", "C": "Technical review", "D": "Inspection"}, "correct": "D", "why_correct": "An inspection is the most formal review type, follows the complete generic process, aims to find the maximum number of anomalies, collects metrics for process improvement, and does not allow the author to act as review leader or scribe.", "option_notes": {"A": "Incorrect. Informal reviews do not follow a defined process and require no formal output.", "B": "Incorrect. A walkthrough is led by the author and may educate reviewers or build consensus.", "C": "Incorrect. A technical review is led by a moderator and performed by technically qualified reviewers, but the strict author restriction and maximum formality point to inspection.", "D": "Correct. All stated clues match inspection."}, "distractor_note": "Technical review and inspection both can detect anomalies and evaluate quality. Formality, metrics, complete process, and author restrictions identify inspection.", "alt_wording": "Which review type is the most formal and collects metrics for process improvement?"}, {"id": "Q303", "chapter": "2.3", "topic": "Maintenance Testing", "type": "F", "difficulty": "red", "question": "Which TWO factors most directly influence the scope of maintenance testing for an operational warehouse system after a database upgrade?", "options": {"A": "Degree of risk of the change and size of the existing system", "B": "Number of developers on vacation and whether tests are manual", "C": "Whether the release is called a hot fix and the tester's independence level only", "D": "Color of the task board and number of review meetings held"}, "correct": "A", "why_correct": "The scope of maintenance testing typically depends on the degree of risk of the change, the size of the existing system, and the size of the change. A database upgrade is an environmental migration trigger, but scope is driven by risk and change/system size.", "option_notes": {"A": "Correct. These are two of the explicit scope factors.", "B": "Incorrect. Staffing may affect planning, but these are not the syllabus scope factors.", "C": "Incorrect. A hot fix may be a trigger, but the scope factors are risk and size-related.", "D": "Incorrect. These are unrelated to maintenance testing scope."}, "distractor_note": "Do not confuse triggers for maintenance testing with the factors that determine how much maintenance testing is needed.", "alt_wording": "What determines how much testing is needed after modifying, migrating, or retiring an operational system?"}, {"id": "Q310", "chapter": "4.2", "topic": "2-Value vs 3-Value Boundary Value Analysis", "type": "D", "difficulty": "red", "question": "A requirement says discount applies when loyalty points are <= 1000. The code was accidentally written so the discount applies only when points == 1000. Which BVA approach is MORE likely to expose this specific defect around the 1000 boundary?", "options": {"A": "2-value BVA using 1000 and 1001 only", "B": "3-value BVA using 999, 1000 and 1001", "C": "Equivalence partitioning using only one valid value such as 500", "D": "Decision table testing with the points condition removed as irrelevant"}, "correct": "B", "why_correct": "3-value BVA includes the boundary value and both closest neighbors. Testing 999 should show that the discount is wrongly not applied when it should be. 2-value BVA with 1000 and 1001 can miss this exact mistake because both observed results may match the faulty equality implementation at those two values.", "option_notes": {"A": "Incorrect. This pair can miss the implementation that only handles exactly 1000.", "B": "Correct. The lower neighbor 999 is likely to expose the error.", "C": "Incorrect. EP with a single valid value may help, but the question asks the boundary-focused approach more likely to expose the specific defect.", "D": "Incorrect. Removing the condition would prevent testing the relevant rule."}, "distractor_note": "This mirrors the syllabus nuance: 3-value BVA is more rigorous and may detect defects overlooked by 2-value BVA.", "alt_wording": "Which BVA version can detect a <= boundary implemented as equality?"}, {"id": "Q317", "chapter": "4.4", "topic": "Exploratory Testing", "type": "C", "difficulty": "red", "question": "A tester is given a 90-minute charter to explore refund fraud scenarios, designs tests while learning the feature, records discoveries on a session sheet, and debriefs with the product owner afterward. Which technique is MOST directly described?", "options": {"A": "Checklist-based testing", "B": "Exploratory testing using a session-based approach", "C": "Decision table testing", "D": "Statement testing"}, "correct": "B", "why_correct": "Exploratory testing involves simultaneous learning, test design, execution, and evaluation. Session-based exploratory testing adds a time box, a charter, session notes or sheets, and a debriefing with interested stakeholders.", "option_notes": {"A": "Incorrect. Checklist-based testing is guided by checklist items, not primarily by learning and a chartered session.", "B": "Correct. The charter, time box, learning during testing, session sheet and debrief are direct clues.", "C": "Incorrect. Decision table testing is based on combinations of conditions and actions.", "D": "Incorrect. Statement testing is a white-box code coverage technique."}, "distractor_note": "A charter is not a checklist. It provides focused objectives while preserving exploratory design during execution.", "alt_wording": "Which experience-based technique simultaneously designs, executes and evaluates tests while learning?"}, {"id": "Q309", "chapter": "4.2", "topic": "Boundary Value Analysis", "type": "H", "difficulty": "red", "question": "A form accepts appointment lead time from 3 to 30 days inclusive. Using 3-value BVA for integer days, which set gives 100% coverage of the two boundaries with the fewest distinct values?", "options": {"A": "3, 30", "B": "2, 3, 4, 29, 30, 31", "C": "1, 3, 30, 32", "D": "2, 4, 29, 31"}, "correct": "B", "why_correct": "For 3-value BVA, each boundary value and both neighboring values are coverage items. The lower boundary 3 requires 2, 3 and 4. The upper boundary 30 requires 29, 30 and 31. Together that is 2, 3, 4, 29, 30 and 31.", "option_notes": {"A": "Incorrect. This covers only the boundary values, not their neighbors.", "B": "Correct. It covers each boundary and both neighbors.", "C": "Incorrect. Values 1 and 32 are not the closest neighbors of the boundaries, and 2, 4, 29 and 31 are missing.", "D": "Incorrect. It omits the actual boundary values 3 and 30."}, "distractor_note": "2-value BVA and 3-value BVA differ by coverage items. 3-value includes both neighbors around each boundary.", "alt_wording": "Which integer values satisfy 3-value BVA for an inclusive valid range?"}, {"id": "Q294", "chapter": "1.3", "topic": "Testing Principles", "type": "D", "difficulty": "red", "question": "An online lender has executed all specified loan-approval test cases with no failures. After launch, customers abandon the process because the required document upload flow is confusing, although it behaves exactly as specified. Which testing principle BEST explains this outcome?", "options": {"A": "Tests wear out", "B": "Defects cluster together", "C": "Absence-of-defects fallacy", "D": "Exhaustive testing is impossible"}, "correct": "C", "why_correct": "The absence-of-defects fallacy says that finding and fixing defects, or having no observed failures, does not help if the system does not satisfy users' needs and expectations. Here the product conforms to the specification but fails validation in real use.", "option_notes": {"A": "Incorrect. Tests wear out concerns repeated tests becoming less effective at finding new defects.", "B": "Incorrect. Defect clustering concerns many defects being concentrated in a few components.", "C": "Correct. The product can be defect-free relative to specified tests yet still fail stakeholder needs.", "D": "Incorrect. Exhaustive testing is relevant to impossible complete coverage, but the central issue is user value."}, "distractor_note": "The phrase 'all specified test cases' is bait for thinking about coverage. The business failure is about validation and usefulness.", "alt_wording": "Which principle applies when a system passes its tests but is not useful to stakeholders?"}, {"id": "Q325", "chapter": "5.2", "topic": "Risk Level", "type": "H", "difficulty": "red", "question": "A product risk has likelihood 0.25 and impact 80 on a financial-loss scale. Another risk has likelihood 0.5 and impact 30. Using quantitative risk level as likelihood multiplied by impact, which statement is correct?", "options": {"A": "The first risk has level 20 and is higher than the second risk's level 15", "B": "The first risk has level 80 because impact alone determines risk level", "C": "The second risk has level 30 because likelihood is ignored after assessment", "D": "Both risks have the same level because both likelihoods are greater than zero"}, "correct": "A", "why_correct": "In a quantitative approach, risk level can be calculated as risk likelihood multiplied by risk impact. The first risk is 0.25 * 80 = 20. The second risk is 0.5 * 30 = 15. Therefore the first has the higher calculated risk level.", "option_notes": {"A": "Correct. It applies likelihood multiplied by impact.", "B": "Incorrect. Impact alone is not the quantitative risk level.", "C": "Incorrect. Likelihood remains part of the calculation.", "D": "Incorrect. Different likelihood-impact combinations can produce different levels."}, "distractor_note": "High impact alone is not the same as high risk level; likelihood and impact are considered together.", "alt_wording": "Calculate and compare risk levels using likelihood and impact."}, {"id": "Q327", "chapter": "5.2", "topic": "Product Risk Analysis and Test Scope", "type": "D", "difficulty": "red", "question": "A risk workshop finds that incorrect dosage calculation is high likelihood and high impact, while report-font mismatch is low likelihood and low impact. Which test response is MOST consistent with risk-based testing?", "options": {"A": "Apply equal test depth to both items because all defects are equally important", "B": "Increase testing thoroughness, earlier execution, appropriate techniques and coverage for dosage calculation", "C": "Skip testing dosage calculation because high-risk areas are too dangerous to test", "D": "Test only the report-font mismatch first because it is easier to automate"}, "correct": "B", "why_correct": "Product risk analysis focuses test effort to minimize residual product risk. Its results influence test scope, test levels and types, techniques, coverage, effort estimation and prioritization so critical defects can be found as early as possible.", "option_notes": {"A": "Incorrect. Risk-based testing intentionally varies test effort by analyzed risk.", "B": "Correct. High product risk should drive deeper and earlier testing with suitable techniques and coverage.", "C": "Incorrect. High-risk areas usually need more focused treatment, not avoidance.", "D": "Incorrect. Ease of automation alone should not override risk priority."}, "distractor_note": "Risk-based testing is not just ordering tests; it can change scope, depth, levels, techniques, and coverage.", "alt_wording": "How should product risk analysis influence test thoroughness and scope?"}, {"id": "Q298", "chapter": "2.1", "topic": "SDLC Impact on Testing", "type": "C", "difficulty": "red", "question": "Which statement BEST contrasts testing in sequential and iterative/incremental SDLC models?", "options": {"A": "Sequential models prevent static testing, while iterative models prevent dynamic testing", "B": "Sequential models usually delay dynamic testing until executable code exists; iterative models may perform static and dynamic testing at all levels in each increment", "C": "Sequential models require exploratory testing only; iterative models require only scripted testing", "D": "Sequential models eliminate regression testing; iterative models eliminate reviews"}, "correct": "B", "why_correct": "In sequential models, testers can review requirements and design early, but dynamic testing usually waits until executable code is available later. In iterative and incremental models, each iteration can deliver a working increment, so static and dynamic testing may occur repeatedly and at multiple test levels.", "option_notes": {"A": "Incorrect. Static testing is possible in sequential models; dynamic testing is possible in iterative models.", "B": "Correct. It captures the timing difference without overstating it.", "C": "Incorrect. The syllabus does not assign only one technique category to either model.", "D": "Incorrect. Regression testing and reviews can be useful in both contexts."}, "distractor_note": "The correct answer is about scope, timing, documentation, automation, and roles being adapted to the lifecycle, not about banning whole test types.", "alt_wording": "How does the chosen SDLC affect when static and dynamic testing can happen?"}, {"id": "Q312", "chapter": "4.2", "topic": "Decision Table Coverage", "type": "H", "difficulty": "red", "question": "A minimized decision table for subscription renewal has 7 feasible columns. A test suite exercises columns R1, R2, R2, R5 and R7. What is the decision table coverage?", "options": {"A": "4/7, about 57%", "B": "5/7, about 71%", "C": "7/7, 100%", "D": "Cannot be calculated from columns"}, "correct": "A", "why_correct": "Decision table coverage is the number of exercised feasible columns divided by the total feasible columns. Duplicate execution of R2 does not add new coverage. The distinct exercised columns are R1, R2, R5 and R7, so coverage is 4/7, about 57%.", "option_notes": {"A": "Correct. Four distinct feasible columns are covered.", "B": "Incorrect. It counts the duplicate R2 execution as new coverage.", "C": "Incorrect. R3, R4 and R6 are not covered.", "D": "Incorrect. Columns are the coverage items for decision table testing."}, "distractor_note": "Coverage uses unique coverage items, not number of executed test cases when duplicates exist.", "alt_wording": "How is decision table rule coverage calculated when a rule is tested more than once?"}, {"id": "Q323", "chapter": "5.1", "topic": "Additional Coverage Prioritization", "type": "H", "difficulty": "red", "question": "A team prioritizes tests by additional requirements coverage. Test T1 covers R1,R2,R3; T2 covers R3,R4; T3 covers R4,R5,R6; T4 covers R2,R6. Which order is BEST if ties are broken by the lowest test ID?", "options": {"A": "T1, T3, T2, T4", "B": "T3, T1, T4, T2", "C": "T1, T2, T3, T4", "D": "T4, T2, T1, T3"}, "correct": "A", "why_correct": "Additional coverage prioritization selects the test with the highest coverage first, then each next test that adds the most not-yet-covered items. T1 and T3 each cover three initially, so the tie goes to T1. Remaining uncovered are R4,R5,R6; T3 adds all three, T2 adds R4 only, and T4 adds R6 only. After T3, all requirements are covered, so the tie among zero-additional tests goes to T2 before T4.", "option_notes": {"A": "Correct. It follows additional coverage with the stated tie rule.", "B": "Incorrect. T3 could be first without the tie rule, but lowest ID selects T1 first.", "C": "Incorrect. T2 adds only one after T1, while T3 adds three.", "D": "Incorrect. T4 has the least initial coverage."}, "distractor_note": "Coverage-based and additional coverage prioritization differ after the first choice. Recompute remaining uncovered items each step.", "alt_wording": "Apply additional coverage prioritization to select the next test case."}, {"id": "Q292", "chapter": "1.1", "topic": "Testing and Debugging", "type": "F", "difficulty": "red", "question": "Consider these statements about a defect found in source code during a peer review:\n\nI. The review is static testing because the code is evaluated without execution.\nII. The developer must reproduce the failure before fixing the defect.\nIII. After the fix, re-running a test that would have exposed the defect is confirmation testing.\n\nWhich statements are correct?", "options": {"A": "I and II only", "B": "I and III only", "C": "II and III only", "D": "I, II and III"}, "correct": "B", "why_correct": "A review of source code without execution is static testing. If static testing finds the defect directly, the developer does not need to reproduce a dynamic failure before removing it. After the fix, checking that the original problem no longer occurs is confirmation testing, which is a testing activity rather than debugging.", "option_notes": {"A": "Incorrect. Statement II is false because reproduction is needed for failures from dynamic testing, not for a defect directly identified by static testing.", "B": "Correct. Static testing can find the defect directly, and the post-fix check is confirmation testing.", "C": "Incorrect. Statement I is true and statement II is false.", "D": "Incorrect. Statement II makes the set too broad."}, "distractor_note": "The trap is applying the dynamic-testing debugging sequence of reproduce, diagnose, fix to a defect already located by static testing.", "alt_wording": "Which activity is testing and which is debugging when a review finds a defect before execution?"}, {"id": "Q304", "chapter": "3.1", "topic": "Static Testing vs Dynamic Testing", "type": "F", "difficulty": "red", "question": "Which TWO statements correctly compare static and dynamic testing?\n\nI. Static testing can be applied to non-executable work products.\nII. Dynamic testing finds defects directly without needing analysis of failures.\nIII. Static testing can identify some defects that are hard to trigger dynamically.\nIV. Dynamic testing can measure maintainability without executing code.", "options": {"A": "I and III", "B": "I and IV", "C": "II and III", "D": "II and IV"}, "correct": "A", "why_correct": "Static testing can examine non-executable work products such as requirements, models and test plans. It can also find defects on rarely executed or hard-to-reach paths. Dynamic testing causes failures from which defects are determined through analysis; quality characteristics dependent on execution, such as performance, are dynamic testing examples.", "option_notes": {"A": "Correct. Statements I and III match the static testing value and applicability.", "B": "Incorrect. Statement IV assigns a non-execution characteristic to dynamic testing incorrectly.", "C": "Incorrect. Statement II is false because dynamic testing causes failures, then analysis finds defects.", "D": "Incorrect. Both II and IV are false."}, "distractor_note": "The trap is saying dynamic testing directly finds defects. CTFL distinguishes observed failure from underlying defect.", "alt_wording": "Which differences explain why static and dynamic testing complement each other?"}, {"id": "Q311", "chapter": "4.2", "topic": "Decision Table Testing", "type": "H", "difficulty": "red", "question": "A loan pre-check uses three Boolean conditions: age eligible, income verified, and existing fraud alert. A full limited-entry decision table is created, but combinations where fraud alert is true and income verified is false are impossible because fraud alerts are recorded only after income verification. How many feasible rules remain?", "options": {"A": "4", "B": "6", "C": "8", "D": "12"}, "correct": "B", "why_correct": "Three Boolean conditions create 2^3 = 8 full rules. The impossible combination income verified = false and fraud alert = true can occur with age eligible true or false, so two rules are infeasible. The feasible rule count is 8 - 2 = 6.", "option_notes": {"A": "Incorrect. That would remove four rules, but only two are infeasible.", "B": "Correct. Six feasible combinations remain.", "C": "Incorrect. This is the full table before removing infeasible rules.", "D": "Incorrect. Three Boolean conditions do not create twelve full limited-entry rules."}, "distractor_note": "Watch whether infeasibility applies under every value of another condition. Here age still has two possible values for the impossible pair.", "alt_wording": "How many decision table columns remain after deleting infeasible combinations?"}, {"id": "Q307", "chapter": "4.1", "topic": "Test Technique Categories", "type": "C", "difficulty": "red", "question": "A tester designs one set of tests from API contract rules, another set from a control-flow graph, and a third set from production incident patterns. What is the correct classification, in order?", "options": {"A": "White-box, black-box, experience-based", "B": "Black-box, white-box, experience-based", "C": "Experience-based, black-box, white-box", "D": "Black-box, experience-based, white-box"}, "correct": "B", "why_correct": "Tests derived from specified behavior such as API contract rules are black-box/specification-based. Tests derived from internal structure such as a control-flow graph are white-box/structure-based. Tests derived from incident patterns and tester knowledge are experience-based.", "option_notes": {"A": "Incorrect. It swaps contract rules and control-flow graph.", "B": "Correct. Specification, structure, and experience are classified in that order.", "C": "Incorrect. Incident patterns are the third item, not the first.", "D": "Incorrect. A control-flow graph is white-box, not experience-based."}, "distractor_note": "The same test object can be tested using all three categories. Classification depends on the basis for designing the tests.", "alt_wording": "Which technique category is specification-based, structure-based, or based on tester knowledge?"}, {"id": "Q326", "chapter": "5.2", "topic": "Project Risks vs Product Risks", "type": "F", "difficulty": "red", "question": "Which TWO items are product risks rather than project risks?\n\nI. A supplier may deliver the test environment two weeks late.\nII. The payment algorithm may round tax incorrectly for cross-border orders.\nIII. The team may lack enough performance-testing skills for the release date.\nIV. The mobile app may expose personal data through an insecure cache.", "options": {"A": "I and III", "B": "I and IV", "C": "II and IV", "D": "II and III"}, "correct": "C", "why_correct": "Product risks are related to product quality characteristics, such as incorrect calculations, security vulnerabilities, runtime errors, poor user experience or performance. Project risks affect the management and control of the project, such as supplier delay or insufficient skills.", "option_notes": {"A": "Incorrect. I and III are project risks.", "B": "Incorrect. I is a project risk; IV is a product risk.", "C": "Correct. Incorrect tax calculation and insecure data caching are product quality risks.", "D": "Incorrect. III is a people/project risk."}, "distractor_note": "Ask what suffers directly: the project plan/schedule/budget, or the delivered product's quality and behavior.", "alt_wording": "Classify risks as project risks or product risks."}, {"id": "Q296", "chapter": "1.4", "topic": "Testware by Test Activity", "type": "E", "difficulty": "red", "question": "Which work product is LEAST likely to be an output of test implementation?", "options": {"A": "Prioritized test procedures assembled into test suites", "B": "Manual or automated test scripts", "C": "Verified test environment items such as stubs or drivers", "D": "A test completion report summarizing lessons learned"}, "correct": "D", "why_correct": "Test implementation produces or organizes the testware needed for execution, such as procedures, scripts, suites, data, schedules, and environment items. A test completion report is produced during test completion, not test implementation.", "option_notes": {"A": "Incorrect. This belongs to test implementation.", "B": "Incorrect. Creating scripts is a test implementation output.", "C": "Incorrect. Environment items such as stubs and drivers may be implementation work products.", "D": "Correct. This belongs to test completion."}, "distractor_note": "The negative wording asks for the item outside implementation. Completion reports sound like documentation but come after execution/closure.", "alt_wording": "Which item is test completion testware rather than test implementation testware?"}, {"id": "Q302", "chapter": "2.2", "topic": "Confirmation Testing vs Regression Testing", "type": "C", "difficulty": "red", "question": "A defect fix changes a tax calculation module. The tester first reruns the previously failing tax case and then runs checkout, invoice and reporting tests selected after impact analysis. What is the BEST classification of these activities?", "options": {"A": "Both sets are confirmation testing because both follow a fix", "B": "The rerun of the failing case is confirmation testing; the broader affected-area tests are regression testing", "C": "The rerun of the failing case is regression testing; the broader affected-area tests are confirmation testing", "D": "Both sets are debugging because they occur after a defect fix"}, "correct": "B", "why_correct": "Confirmation testing checks whether the original defect was fixed, often by rerunning the test that previously failed. Regression testing checks that no adverse consequences were introduced by the change, and impact analysis helps determine its extent.", "option_notes": {"A": "Incorrect. Broader affected-area tests are regression tests, not confirmation tests.", "B": "Correct. It separates the fix check from checks for side effects.", "C": "Incorrect. It swaps the two concepts.", "D": "Incorrect. Testing after a fix is not debugging."}, "distractor_note": "The time sequence 'after a fix' applies to both, so use purpose: prove the defect is gone versus look for unintended side effects.", "alt_wording": "Which post-change activity confirms the original fix, and which checks for adverse consequences?"}]};
</script>
<script>
// ISTQB CTFL Mock Exam engine — self-contained, inlined by tools/render_exam.py.
// No questions are rendered into the visible DOM until the candidate clicks "Start Exam".
(function () {
  "use strict";

  var EXAM = window.__EXAM__;
  var STORAGE_KEY = "istqb-exam-state:" + EXAM.examId;
  var THEME_KEY = "istqb-exam-theme";
  var root = document.getElementById("app");
  var timerInterval = null;
  // Set once startOrResume() runs during THIS page load. Reloading the file always lands
  // back on the start/resume gate first — it never silently drops the candidate back into
  // a question — even if an earlier browser session had already clicked Start.
  var resumedThisSession = false;

  // ---------------------------------------------------------------- state
  function freshState() {
    return {
      phase: "not_started", // not_started | in_progress | cleanup_offer | cleanup | submitted
      answers: {},          // { questionId: "A" }
      flags: {},             // { questionId: true }
      notes: {},             // { questionId: "rough work typed while solving" }
      markers: {},           // { questionId: [{ id, term, note, source, selectedText, ... }] }
      currentIndex: 0,
      deadline: null,        // ms epoch timestamp — remaining time is derived from this, not decremented,
      startedAt: null,       // so the clock keeps real wall-clock time even if the tab is closed and reopened
      cleanupQuestionIds: [], // fixed list of flagged/unanswered questions offered after the main timer expires
      cleanupDeadline: null,
      cleanupStartedAt: null,
      cleanupOfferedAt: null,
      cleanupTimeUsedSeconds: null,
      cleanupUsed: false,
      submittedAt: null,
      timeUsedSeconds: null,
      exported: false     // whether "Export Results" has been clicked this attempt — used to warn before a retake discards an unexported score
    };
  }

  // Remaining seconds, computed from the stored deadline so it reflects real elapsed time
  // even across a closed tab / reloaded file, matching how a real proctored exam timer behaves.
  function computeRemaining() {
    if (state.phase === "cleanup") {
      if (!state.cleanupDeadline) return cleanupDurationSeconds();
      return Math.round((state.cleanupDeadline - Date.now()) / 1000);
    }
    if (!state.deadline) return EXAM.durationMinutes * 60;
    return Math.round((state.deadline - Date.now()) / 1000);
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      var parsed = JSON.parse(raw);
      return Object.assign(freshState(), parsed);
    } catch (e) {
      return freshState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage full / disabled — degrade silently */ }
  }

  var state = loadState();

  // ---------------------------------------------------------------- rough-notes panel position
  // A display preference, not exam progress — stored separately so it persists across
  // different exam sittings (unlike `state`, which is keyed per exam id).
  var NOTES_UI_KEY = "istqb-exam-notes-ui";

  function freshNotesUI() {
    return { position: "bottom", x: null, y: null, w: null, h: null }; // position: bottom | right | float
  }
  function loadNotesUI() {
    try {
      var raw = localStorage.getItem(NOTES_UI_KEY);
      if (!raw) return freshNotesUI();
      return Object.assign(freshNotesUI(), JSON.parse(raw));
    } catch (e) { return freshNotesUI(); }
  }
  function saveNotesUI() {
    try { localStorage.setItem(NOTES_UI_KEY, JSON.stringify(notesUI)); } catch (e) { /* ignore */ }
  }
  var notesUI = loadNotesUI();

  function setNotesPosition(pos) {
    if (notesUI.position === pos) return;
    notesUI.position = pos;
    saveNotesUI();
    render();
  }

  function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

  // Only relevant in float mode. Applies the last dragged coordinates, if any —
  // otherwise the CSS default (bottom-right corner) is left in place.
  function applyFloatPosition(panel) {
    if (notesUI.x === null || notesUI.y === null) return;
    var maxLeft = Math.max(4, window.innerWidth - 40);
    var maxTop = Math.max(4, window.innerHeight - 40);
    panel.style.left = clamp(notesUI.x, 4, maxLeft) + "px";
    panel.style.top = clamp(notesUI.y, 4, maxTop) + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
  }

  function makeDraggable(panel, handle) {
    var dragging = false;
    var startX = 0, startY = 0, startLeft = 0, startTop = 0;
    handle.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".postoggle-btn")) return; // let the dock/float buttons handle their own clicks
      dragging = true;
      handle.setPointerCapture(e.pointerId);
      var rect = panel.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left; startTop = rect.top;
      panel.classList.add("dragging");
    });
    handle.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var newLeft = clamp(startLeft + (e.clientX - startX), 4, window.innerWidth - panel.offsetWidth - 4);
      var newTop = clamp(startTop + (e.clientY - startY), 4, window.innerHeight - panel.offsetHeight - 4);
      panel.style.left = newLeft + "px";
      panel.style.top = newTop + "px";
      panel.style.right = "auto";
      panel.style.bottom = "auto";
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      panel.classList.remove("dragging");
      notesUI.x = parseInt(panel.style.left, 10);
      notesUI.y = parseInt(panel.style.top, 10);
      saveNotesUI();
    }
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  }

  // Applies the last manually-resized width/height, if any — otherwise the panel keeps
  // its CSS default size. The same saved size is reused across bottom/right/float, since
  // it's a general "how big do I like my notes box" preference, not a per-mode setting.
  function applyStoredSize(panel) {
    if (notesUI.w) panel.style.width = notesUI.w + "px";
    if (notesUI.h) panel.style.height = notesUI.h + "px";
  }

  // The panel is fully rebuilt on every question change, so a plain CSS `resize` drag
  // would otherwise be forgotten the moment the candidate clicks Next. There's no
  // resize-start/resize-end event for the native corner grip, so we arm a flag when a
  // mousedown lands in that ~18px corner hit-region, then compare the panel's size on
  // the next mouseup (wherever it ends) and persist it if it actually changed.
  var currentScratchPanel = null;
  var scratchResizeArmed = false;
  function scratchPanelMouseDown(e) {
    var rect = e.currentTarget.getBoundingClientRect();
    var nearRight = rect.right - e.clientX <= 18;
    var nearBottom = rect.bottom - e.clientY <= 18;
    scratchResizeArmed = nearRight && nearBottom;
  }
  document.addEventListener("mouseup", function () {
    if (!scratchResizeArmed) return;
    scratchResizeArmed = false;
    if (!currentScratchPanel || !currentScratchPanel.isConnected) return;
    var rect = currentScratchPanel.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    if (w !== notesUI.w || h !== notesUI.h) {
      notesUI.w = w;
      notesUI.h = h;
      saveNotesUI();
    }
  });

  // ---------------------------------------------------------------- theme
  function applyTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  }
  function toggleTheme() {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
  }
  applyTheme();

  // ---------------------------------------------------------------- utils
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return; // omit — do not stringify to "null"
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function formatTime(totalSeconds) {
    var s = Math.max(0, totalSeconds);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function timeLimitLabel() {
    var base = EXAM.durationMinutes + ":00";
    if (!state.cleanupQuestionIds || !state.cleanupQuestionIds.length) return base;
    return base + " + " + formatTime(cleanupDurationSeconds()) + " extra";
  }

  function chapterNum(chapterCode) {
    return chapterCode.split(".")[0];
  }

  var CHAPTER_NAMES = {
    "1": "Fundamentals of Testing",
    "2": "Testing Throughout the SDLC",
    "3": "Static Testing",
    "4": "Test Analysis and Design",
    "5": "Managing the Test Activities",
    "6": "Test Tools"
  };

  function answeredCount() { return Object.keys(state.answers).length; }
  function flaggedCount() { return Object.keys(state.flags).filter(function (k) { return state.flags[k]; }).length; }
  function markersFor(questionId) {
    return state.markers && Array.isArray(state.markers[questionId]) ? state.markers[questionId] : [];
  }
  function markerCount() {
    if (!state.markers) return 0;
    return Object.keys(state.markers).reduce(function (n, questionId) {
      return n + markersFor(questionId).length;
    }, 0);
  }
  function noteFor(questionId) {
    return state.notes && state.notes[questionId] ? state.notes[questionId] : "";
  }
  function questionById(questionId) {
    return EXAM.questions.find(function (q) { return q.id === questionId; }) || null;
  }
  function originalQuestionNumber(questionId) {
    var idx = EXAM.questions.findIndex(function (q) { return q.id === questionId; });
    return idx >= 0 ? idx + 1 : "?";
  }
  function remainingQuestionIds() {
    return EXAM.questions
      .filter(function (q) { return !state.answers[q.id] || !!state.flags[q.id]; })
      .map(function (q) { return q.id; });
  }
  function cleanupDurationSeconds() {
    return (state.cleanupQuestionIds || []).length * 60;
  }
  function activeQuestions() {
    if (state.phase !== "cleanup") return EXAM.questions;
    return (state.cleanupQuestionIds || []).map(questionById).filter(Boolean);
  }
  function activeQuestionCount() {
    return activeQuestions().length;
  }

  // ---------------------------------------------------------------- render dispatch
  function render() {
    root.innerHTML = "";
    if (state.phase === "submitted") { renderResults(); return; }
    if (state.phase === "cleanup_offer") { renderCleanupOffer(); return; }
    if ((state.phase === "in_progress" || state.phase === "cleanup") && resumedThisSession) { renderExam(); return; }
    renderStart(); // covers not_started, and in_progress before the candidate has clicked Resume
  }

  // ---------------------------------------------------------------- start screen
  function renderStart() {
    stopTimer();
    var inProgress = state.phase === "in_progress" || state.phase === "cleanup";
    var inCleanup = state.phase === "cleanup";

    var shell = el("div", { class: "center-shell" });
    var card = el("div", { class: "card" });

    if (inProgress) {
      var total = inCleanup ? activeQuestionCount() : EXAM.questions.length;
      var answered = inCleanup
        ? activeQuestions().filter(function (q) { return !!state.answers[q.id]; }).length
        : answeredCount();
      card.appendChild(el("div", { class: "resume-banner" }, [
        (inCleanup ? "A remaining-question round is already in progress (" : "An exam is already in progress (") +
        answered + "/" + total + " answered, " + formatTime(computeRemaining()) +
        " remaining). Starting over will discard that progress."
      ]));
    }

    card.appendChild(el("h1", { class: "start-title" }, [EXAM.title]));
    card.appendChild(el("p", { class: "start-sub" }, [
      "Generated " + EXAM.generated + " · Question bank v" + (EXAM.bankVersion || 1)
    ]));

    var meta = el("div", { class: "meta-grid" }, [
      metaTile(String(EXAM.questions.length), "Questions"),
      metaTile(EXAM.durationMinutes + " min", "Time Limit"),
      metaTile(EXAM.passMarkPct + "%", "Pass Mark"),
      metaTile(Math.round(EXAM.questions.length * EXAM.passMarkPct / 100) + "/" + EXAM.questions.length, "To Pass")
    ]);
    card.appendChild(meta);

    var rules = el("ul", { class: "rules-list" }, [
      el("li", {}, ["Every question has a single best answer. No answers or explanations are shown until you submit."]),
      el("li", {}, ["A countdown timer starts the moment you click Start and cannot be paused. When it reaches 00:00, the exam either submits or offers a remaining-question round."]),
      el("li", {}, ["If the main timer ends while questions are still unanswered or flagged, you can start a remaining-question round with 1 minute for each of those questions."]),
      el("li", {}, ["Use the question navigator to jump to any question in any order, and flag questions to revisit."]),
      el("li", {}, ["Use Learning Marker when a term, topic, option, or phrase feels unclear. Markers are exported with your results so they can be turned into a permanent A-Z review page after the exam."]),
      el("li", {}, ["Each question has a rough-notes area for scratch work; it auto-saves with your local exam progress. Use the small buttons above it to dock the notes to the bottom, dock them to the right, or float them anywhere on screen — and drag its bottom-right corner to resize it to whatever size you like."]),
      el("li", {}, ["Your progress is saved in this browser automatically — closing the tab and reopening this file will resume where you left off."]),
      el("li", {}, ["After submitting, you can review the full solutions with explanations and export your results as a file."])
    ]);
    card.appendChild(rules);

    card.appendChild(el("button", {
      class: "big-btn", onclick: function () { startOrResume(inProgress); }
    }, [inProgress ? (inCleanup ? "Resume Remaining Round" : "Resume Exam") : "Start Exam"]));

    if (inProgress) {
      card.appendChild(el("button", {
        class: "big-btn secondary", style: "margin-top:10px;", onclick: function () {
          if (confirm("Discard your in-progress exam and start a fresh attempt?")) {
            state = freshState();
            saveState();
            render();
          }
        }
      }, ["Start Over Instead"]));
    }

    shell.appendChild(card);
    root.appendChild(topbar(false));
    root.appendChild(shell);
  }

  function metaTile(num, label) {
    return el("div", { class: "meta-tile" }, [
      el("span", { class: "num" }, [num]),
      el("span", { class: "label" }, [label])
    ]);
  }

  function startOrResume(wasInProgress) {
    if (!wasInProgress) {
      state = freshState();
      state.phase = "in_progress";
      state.startedAt = Date.now();
      state.deadline = state.startedAt + EXAM.durationMinutes * 60000;
    }
    resumedThisSession = true;
    saveState();
    render();
  }

  // Replays this exact sitting (same 40 questions, same order) with a clean timer and
  // blank answers/flags/notes. Warns first, since an unexported attempt's score/answers
  // have no other record once cleared.
  function retakeExam() {
    var msg = state.exported
      ? "Retake this exam with the same 40 questions? Your answers, flags, and rough notes will be cleared and the timer will restart."
      : "You haven't exported this attempt's results yet, so retaking now will permanently lose your answers and score for it. Retake anyway?";
    if (!confirm(msg)) return;
    startOrResume(false);
  }

  // ---------------------------------------------------------------- top bar
  function topbar(showTimer) {
    var bar = el("div", { class: "exam-topbar" }, [
      el("span", { class: "exam-title" }, [EXAM.title])
    ]);
    bar.appendChild(el("span", { class: "spacer" }));
    if (showTimer) {
      bar.appendChild(el("span", { class: "q-counter", id: "qCounter" }, [
        (state.phase === "cleanup" ? "Remaining " : "Question ") + (state.currentIndex + 1) + " of " + activeQuestionCount()
      ]));
      bar.appendChild(el("span", { class: "timer", id: "timerEl" }, [formatTime(computeRemaining())]));
    }
    bar.appendChild(el("button", { class: "icon-btn", title: "Toggle theme", onclick: toggleTheme }, ["\u{1F319}"]));
    return bar;
  }

  // ---------------------------------------------------------------- rough-notes panel
  function renderScratchPanel(q) {
    function posBtn(pos, icon, title) {
      return el("button", {
        type: "button",
        class: "postoggle-btn" + (notesUI.position === pos ? " active" : ""),
        title: title,
        onclick: function () { setNotesPosition(pos); }
      }, [icon]);
    }

    var header = el("div", { class: "scratch-header" }, [
      el("span", { class: "scratch-label" }, ["Rough notes"]),
      el("div", { class: "scratch-postoggle" }, [
        posBtn("bottom", "⬇", "Dock to bottom"),
        posBtn("right", "▶", "Dock to right"),
        posBtn("float", "✦", "Float — drag anywhere")
      ])
    ]);

    var panel = el("section", {
      class: "scratch-panel pos-" + notesUI.position,
      onmousedown: scratchPanelMouseDown
    }, [
      header,
      el("textarea", {
        id: "scratch_" + q.id,
        class: "scratch-input",
        rows: "7",
        spellcheck: "false",
        placeholder: "Use this space for rough work, calculations, eliminations, or reminders. Auto-saved in this browser.",
        oninput: function (e) {
          if (!state.notes) state.notes = {};
          var value = e.target.value;
          if (value.trim()) state.notes[q.id] = value;
          else delete state.notes[q.id];
          saveState();
        }
      }, [noteFor(q.id)])
    ]);

    applyStoredSize(panel);
    currentScratchPanel = panel;

    if (notesUI.position === "float") {
